        function analyzeRecipeHarmfulContent(recipe) {
            const haystack = [
                recipe?.title,
                recipe?.author,
                recipe?.category,
                recipe?.country,
                recipe?.cuisine,
                recipe?.tips,
                ...(recipe?.ingredients || []),
                ...(recipe?.instructions || []).map(step => getRecipeInstructionText(step))
            ].filter(Boolean).join('\n');

            const findings = harmfulContentPatterns
                .map(entry => {
                    const match = haystack.match(entry.pattern);
                    if (!match) return null;
                    return {
                        label: entry.label,
                        matchedText: String(match[0] || '').trim()
                    };
                })
                .filter(Boolean);

            return {
                flagged: findings.length > 0,
                findings
            };
        }

        async function adminForceUnpublishByPublishedId(publishedRecipeId, sourceLabel = 'admin-force') {

                const snapshot = await docRef.get();
                if (!snapshot.exists) {
                    showToast('Published recipe not found.', 'alert-circle');

                const existing = { ...snapshot.data(), id: snapshot.id };
                if (existing.publicationState === 'retracted') {

                const updatedAt = new Date();

                    publicationState: 'retracted',
                    retractedAt: updatedAt,
                    updatedAt,
                    moderation: {
                        action: sourceLabel,
                        actorId: currentUser.uid || '',
                        actorEmail: currentUser.email || '',
                        at: updatedAt

                }, { merge: true });

                upsertPublishedRecipeCacheEntry({
                    ...existing,
                    id: snapshot.id,
                    publicationState: 'retracted',
                    retractedAt: updatedAt,
                    updatedAt
                });

                const linkedLocal = getLocalRecipeByPublishedId(snapshot.id);
                if (linkedLocal) {
                    linkedLocal.publicationState = 'retracted';
                    linkedLocal.scheduledRetractionAt = '';
                    linkedLocal.retractionRequestedAt = '';

                logModerationAction('admin-force-recipe-offline', {

        async function adminScanDuplicatePublishedRecipes({ autoRetract = false, silent = false } = {}) {
            if (!isCurrentUserAdmin()) {
                showToast('Admin rights required.', 'alert-circle');
                return;
            }
            if (!firebaseInitialized || !isAuthenticated || !currentUser) {
                showToast('Sign in required for duplicate scan.', 'alert-circle');
                return;
            }
            if (duplicateCleanupInFlight) return;

            duplicateCleanupInFlight = true;
            try {
                const db = firebase.firestore();
                const snapshot = await db.collection('published-recipes').orderBy('publishedAt', 'desc').limit(300).get();
                const liveRecipes = snapshot.docs
                    .map(doc => ({ ...doc.data(), id: doc.id }))
                    .filter(recipe => recipe.publicationState !== 'retracted');

                const grouped = new Map();
                liveRecipes.forEach(recipe => {
                    const signature = getPublishedRecipeSignature(recipe);
                    if (!signature) return;
                    if (!grouped.has(signature)) grouped.set(signature, []);
                    grouped.get(signature).push(recipe);
                });

                const duplicates = [];
                grouped.forEach(items => {
                    if (items.length < 2) return;
                    const sorted = [...items].sort((a, b) => {
                        const aMs = new Date(a.updatedAt || a.publishedAt || 0).getTime();
                        const bMs = new Date(b.updatedAt || b.publishedAt || 0).getTime();
                        return bMs - aMs;
                    });
                    sorted.slice(1).forEach(entry => duplicates.push(entry));
                });

                if (duplicates.length === 0) {
                    logModerationAction('admin-duplicate-scan', {
                        reason: 'No duplicates found',
                        details: { autoRetract: autoRetract === true, duplicateCount: 0 }
                    });
                    if (!silent) showToast('No duplicate published recipes found.', 'check-circle');
                    return;
                }

                if (!autoRetract) {
                    logModerationAction('admin-duplicate-scan', {
                        reason: 'Duplicates detected',
                        details: { autoRetract: false, duplicateCount: duplicates.length }
                    });
                    if (!silent) {
                        createModal('Duplicate scan results', `
                            <div class="space-y-3">
                                <p class="text-sm font-semibold text-forest">Found ${duplicates.length} duplicate live recipe${duplicates.length === 1 ? '' : 's'}.</p>
                                <p class="text-sm text-sage">Use "Auto-clean duplicates now" to retract older copies automatically.</p>
                            </div>
                        `, [{ text: 'Close', primary: true, onClick: () => closeModal() }]);
                    }
                    return;
                }

                const batch = db.batch();
                const now = new Date();
                duplicates.forEach(recipe => {
                    const ref = db.collection('published-recipes').doc(recipe.id);
                    batch.set(ref, {
                        publicationState: 'retracted',
                        retractedAt: now,
                        updatedAt: now,
                        moderation: {
                            action: 'duplicate-auto-cleanup',
                            actorId: currentUser.uid || '',
                            actorEmail: currentUser.email || '',
                            at: now
                        }
                    }, { merge: true });
                });
                await batch.commit();

                duplicates.forEach(recipe => {
                    upsertPublishedRecipeCacheEntry({
                        ...recipe,
                        publicationState: 'retracted',
                        retractedAt: now,
                        updatedAt: now
                    });
                });

                recipes.forEach(recipe => {
                    if (!recipe?.publishedId) return;
                    if (!duplicates.some(entry => entry.id === recipe.publishedId)) return;
                    recipe.publicationState = 'retracted';
                    recipe.scheduledRetractionAt = '';
                    recipe.retractionRequestedAt = '';
                });
                saveData();
                logModerationAction('admin-duplicate-auto-clean', {
                    reason: 'Auto-clean duplicates executed',
                    details: { duplicateCount: duplicates.length }
                });
                if (!silent) showToast(`Auto-clean completed. ${duplicates.length} duplicate recipe${duplicates.length === 1 ? '' : 's'} set offline.`, 'shield-check');
            } catch (error) {
                showToast(`Duplicate scan failed: ${error.message}`, 'alert-circle');
            } finally {
                duplicateCleanupInFlight = false;
                lastDuplicateCleanupAt = Date.now();
            }
        }

        async function maybeRunAutomaticDuplicateCleanup() {
            if (!isCurrentUserAdmin() || !adminConfig.duplicateAutoCleanupEnabled) return;
            if (Date.now() - lastDuplicateCleanupAt < 20 * 60 * 1000) return;
            await adminScanDuplicatePublishedRecipes({ autoRetract: true, silent: true });
        }

        async function adminScanPublishedRecipesForHarmfulContent({ autoRetract = false } = {}) {
            if (!isCurrentUserAdmin()) {
                showToast('Admin rights required.', 'alert-circle');
                return;
            }
            if (!firebaseInitialized || !isAuthenticated || !currentUser) {
                showToast('Sign in required for harmful-content scan.', 'alert-circle');
                return;
            }

            try {
                const snapshot = await firebase.firestore().collection('published-recipes').orderBy('publishedAt', 'desc').limit(300).get();
                const liveRecipes = snapshot.docs
                    .map(doc => ({ ...doc.data(), id: doc.id }))
                    .filter(recipe => recipe.publicationState !== 'retracted');

                const flagged = liveRecipes
                    .map(recipe => ({ recipe, result: analyzeRecipeHarmfulContent(recipe) }))
                    .filter(entry => entry.result.flagged);

                if (flagged.length === 0) {
                    logModerationAction('admin-harmful-content-scan', {
                        reason: 'No harmful content detected',
                        details: { autoRetract: autoRetract === true, flaggedCount: 0 }
                    });
                    showToast('No harmful content detected in live published recipes.', 'check-circle');
                    return;
                }

                if (!autoRetract) {
                    logModerationAction('admin-harmful-content-scan', {
                        reason: 'Flagged recipes found',
                        details: { autoRetract: false, flaggedCount: flagged.length }
                    });
                    createModal('Harmful-content scan', `
                        <div class="space-y-3">
                            <p class="text-sm font-semibold text-forest">Flagged recipes found: ${flagged.length}</p>
                            <p class="text-sm text-sage">Use "Auto-retract flagged now" to immediately move all flagged recipes offline.</p>
                        </div>
                    `, [{ text: 'Close', primary: true, onClick: () => closeModal() }]);
                    return;
                }

                for (const entry of flagged) {
                    await adminForceUnpublishByPublishedId(entry.recipe.id, 'harmful-content-auto-cleanup');
                }

                logModerationAction('admin-harmful-content-auto-clean', {
                    reason: 'Auto-retract flagged recipes executed',
                    details: { flaggedCount: flagged.length }
                });

                showToast(`Harmful-content cleanup finished. ${flagged.length} recipe${flagged.length === 1 ? '' : 's'} moved offline.`, 'shield-check');
            } catch (error) {
                showToast(`Harmful-content scan failed: ${error.message}`, 'alert-circle');
            }
        }

        function migrateLegacyStorageToCurrentAccount() {
            const accountId = getCurrentAccountStorageId();

            [legacyRecipeSettingsStorageKey, legacyRecipeDataStorageKey, legacyRecipeFamiliesStorageKey].forEach(baseKey => {

        function getReadableAuthErrorMessage(error) {
            const code = String(error?.code || '');
            const backendDetail = String(
                error?.customData?._tokenResponse?.errorMessage
                || error?.customData?.serverResponse
                || error?.message
                || ''
            );
            if (code.includes('invalid-email')) return 'Use a valid email address.';
            if (code.includes('missing-password') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Your email or password is incorrect.';
            if (code.includes('email-already-in-use')) return 'This email address already has an account.';
            if (code.includes('weak-password')) return 'Choose a stronger password with at least 6 characters.';
            if (code.includes('user-not-found')) return 'No account exists for this email address yet.';
            if (code.includes('too-many-requests')) return 'Too many attempts. Please wait a moment and try again.';
            if (code.includes('operation-not-allowed')) return 'This sign-in method is not enabled. Enable Email/Password in Firebase Console → Authentication → Sign-in method.';
            if (code.includes('unauthorized-domain')) return 'This domain is not authorized for Firebase Auth. Add www.uculi.com and uculi.com in Firebase Authentication → Settings → Authorized domains.';
            if (code.includes('redirect-uri-mismatch')) return 'Google OAuth redirect URI mismatch. Add the required Firebase auth handler URL in Google Cloud OAuth client settings.';
            if (code.includes('popup-blocked') || code.includes('popup-closed-by-user')) return 'Google sign-in popup was blocked or closed. Try again or use redirect sign-in.';
            if (code.includes('network-request-failed')) return 'Network error. Check your internet connection and try again.';
            if (code.includes('internal-error')) {
                if (backendDetail) {
                    return `Server error from authentication provider: ${backendDetail}`;
                }
                return `Server error from authentication provider. [${code}]`;
            }
            const displayCode = code || 'unknown';
            return `Authentication failed [${displayCode}]: ${error?.message || 'Please try again.'}`;
        }

        // uculi.com en elk subdomein daarvan is de echte site. Testmodus mag daar nooit aan.
        function isProductionUculiHost() {
            if (typeof window === 'undefined') return false;
            const hostname = String(window.location.hostname || '').toLowerCase();
            return hostname === 'uculi.com' || hostname.endsWith('.uculi.com');
        }

        function isFourPartLanAddress(hostname) {
            const parts = String(hostname || '').split('.');
            if (parts.length !== 4) return null;
            const numbers = parts.map(part => (/^\d{1,3}$/.test(part) ? Number(part) : NaN));
            if (numbers.some(part => !Number.isInteger(part) || part > 255)) return null;
            return numbers;
        }

        // Thuisnetwerk: 192.168.*, 10.* en 172.16 tot en met 172.31.
        function isPrivateLanHostname(hostname) {
            const parts = isFourPartLanAddress(hostname);
            if (!parts) return false;
            const [first, second] = parts;
            if (first === 192 && second === 168) return true;
            if (first === 10) return true;
            return first === 172 && second >= 16 && second <= 31;
        }

        // Tijdelijke tunnels zodat een telefoon de lokale app kan openen zolang Firebase nog niet live is.
        function isTemporaryPreviewTunnelHost(hostname) {
            const host = String(hostname || '').toLowerCase();
            return host.endsWith('.loca.lt')
                || host.endsWith('.ngrok-free.app')
                || host.endsWith('.ngrok.io')
                || host.endsWith('.trycloudflare.com');
        }

        // Preview is dit apparaat: een bestand, localhost, een thuisnetwerk of een tijdelijke tunnel.
        // Op uculi.com blijft dit altijd uit.
        function isLocalDeveloperPreviewContext() {
            if (typeof window === 'undefined' || isProductionUculiHost()) return false;
            const hostname = String(window.location.hostname || '').toLowerCase();
            if (window.location.protocol === 'file:') return true;
            if (hostname === 'localhost' || hostname === '127.0.0.1') return true;
            if (isPrivateLanHostname(hostname)) return true;
            return isTemporaryPreviewTunnelHost(hostname);
        }

        function authAgreementsAccepted() {

        function isCloudAuthConfigured() {
            const config = window.UCULI_FIREBASE_CONFIG || {};
            const key = String(config.apiKey || '');
            return Boolean(key) && key !== 'YOUR_API_KEY' && key !== 'local-dev-not-a-real-key';
        }

        function hashLocalSecret(email, secret) {
            let hash = 2166136261;
            const input = `${String(email || '').toLowerCase()}::${secret}`;
            for (let index = 0; index < input.length; index += 1) {
                hash ^= input.charCodeAt(index);
                hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(16);
        }

        function readLocalAccounts() {
            try {
                const parsed = JSON.parse(localStorage.getItem('uculiLocalAccounts') || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                return [];
            }
        }

        function writeLocalAccounts(accounts) {
            localStorage.setItem('uculiLocalAccounts', JSON.stringify(accounts));
        }

        function activateLocalAccountSession(account) {
            currentUser = {
                uid: account.uid,
                email: account.email,
                displayName: `${account.firstName || ''} ${account.lastName || ''}`.trim() || account.email
            };
            isAuthenticated = true;
            localStorage.setItem('uculiLocalSession', account.uid);
            migrateLegacyStorageToCurrentAccount();
            loadData();
            userSettings.name = userSettings.name || currentUser.displayName;
            userSettings.email = account.email;
            userSettings.termsAccepted = true;
            userSettings.termsAcceptedAt = userSettings.termsAcceptedAt || new Date().toISOString();
            userSettings.termsAcceptedVersion = userSettings.termsAcceptedVersion || 'v2026-04';

            syncAuthenticatedAppChrome();

        function restoreLocalAccountSession() {
            const uid = localStorage.getItem('uculiLocalSession');
            if (!uid) return false;
            const account = readLocalAccounts().find(entry => entry.uid === uid);
            if (!account) return false;
            activateLocalAccountSession(account);
            return true;
        }

        function registerLocalAccount({ firstName, lastName, email, password }) {
            const accounts = readLocalAccounts();
            const normalized = email.toLowerCase();
            if (accounts.some(entry => entry.email === normalized)) {
                showToast('This email address already has an account.', 'alert-circle');
                return false;
            }
            const account = {
                uid: `local-${hashLocalSecret(normalized, 'account')}`,
                email: normalized,
                firstName,
                lastName,
                passwordHash: hashLocalSecret(normalized, password)
            };
            accounts.push(account);
            writeLocalAccounts(accounts);
            activateLocalAccountSession(account);
            showToast('Account saved on this device.', 'check-circle');
            return true;
        }

        function signInLocalAccount(email, password) {
            const normalized = email.toLowerCase();
            const account = readLocalAccounts().find(entry => entry.email === normalized);
            if (!account || account.passwordHash !== hashLocalSecret(normalized, password)) {
                showToast('Your email or password is incorrect.', 'alert-circle');
                return false;
            }
            activateLocalAccountSession(account);
            return true;
        }

        function finishLocalBoot() {
            dismissAuthLoadingScreen();
            if (restoreLocalAccountSession()) return;
            if (activateDeveloperBypassSession()) {
                renderList();

            const requestedAuthMode = getRequestedAuthViewMode();

        function initializeFirebase() {
            if (!isCloudAuthConfigured()) {
                finishLocalBoot();
                return;
            }

            const firebaseConfig = window.UCULI_FIREBASE_CONFIG || {};

            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                firebaseInitialized = true;

                // Handle redirect result from mobile Google sign-in
                firebase.auth().getRedirectResult().then(result => {
                    if (result && result.user) {
                        const u = result.user;
                        userSettings.email = u.email || userSettings.email || '';
                        const existingName = String(userSettings.name || '').trim();
                        const googleName = String(u.displayName || '').trim();
                        if (!existingName && googleName) {
                            userSettings.name = googleName;
                        }
                        userSettings.profilePic = u.photoURL || userSettings.profilePic;
                        saveData();
                        syncToFirestore();
                        showToast(`Welcome, ${u.displayName || 'Chef'}!`, 'check-circle');
                    }
                }).catch(error => {
                    if (error.code !== 'auth/no-current-user') {
                        const code = String(error?.code || 'unknown');
                        showToast(`${getReadableAuthErrorMessage(error)} [${code}]`, 'alert-circle');
                    }
                });

                firebase.auth().onAuthStateChanged(user => {
                    currentUser = user;
                    isAuthenticated = !!user;
                    if (user) {
                        migrateLegacyStorageToCurrentAccount();
                        loadData();
                        userSettings.email = user.email || userSettings.email || '';
                        const existingName = String(userSettings.name || '').trim();
                        const googleName = String(user.displayName || '').trim();
                        if (!existingName) {
                            userSettings.name = googleName || user.email?.split('@')[0] || '';
                        }
                        userSettings.profilePic = user.photoURL || userSettings.profilePic;
                        saveData();
                        syncAuthenticatedAppChrome();
                        // Always render the list first so there's a real screen behind any modal
                        renderList();
                        if (!userSettings.termsAccepted) {
                            maybeShowFirstRunTutorial();
                            showTermsAcceptanceModal();
                        } else {
                            maybeShowFirstRunTutorial();
                        }
                        // Auto-dismiss landing page when a returning session is restored
                        document.getElementById('app-landing')?.remove();
                        sessionStorage.setItem(landingSessionKey, '1');
                        dismissAuthLoadingScreen();
                        loadFamiliesFromFirestore();
                        setTimeout(() => checkFamilyRemovals(), 1000);
                    } else if (activateDeveloperBypassSession()) {
                        dismissAuthLoadingScreen();
                        renderList();
                    } else {
                        resetAuthenticatedUserState();
                        syncAuthenticatedAppChrome();
                        dismissAuthLoadingScreen();
                        renderAuthGate();
                    }
                });
            } catch (error) {
                console.error('Firebase initialization error:', error);
            }
        }

                await firebase.auth().signInWithEmailAndPassword(email, password);
                // onAuthStateChanged handles navigation
            } catch (error) {
                const authText = getAuthI18n();
                showToast(getReadableAuthErrorMessage(error), 'alert-circle');
                if (btn) { btn.disabled = false; btn.innerHTML = `<i data-lucide="log-in" class="h-4 w-4"></i>${authText.submitLogin}`; lucide.createIcons(); }

        async function registerWithEmailPassword() {
            if (!authAgreementsAccepted()) return;

            const firstName = document.getElementById('auth-first-name')?.value?.trim() || '';
            const lastName = document.getElementById('auth-last-name')?.value?.trim() || '';

        function shouldUseRedirectForGoogleSignIn() {
            // Only fall back to redirect if popups are explicitly unsupported (e.g. WebView, iOS PWA installed mode)
            const ua = navigator.userAgent || '';
            const isInstalledPWA = window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone;
            const isWebView = /wv|WebView/i.test(ua);
            return isInstalledPWA || isWebView;
        }

        async function signInWithGoogle(origin = 'app') {

                showCloudSetupStatusModal(origin);

            }

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                if (shouldUseRedirectForGoogleSignIn()) {
                    await firebase.auth().signInWithRedirect(provider);

                const result = await firebase.auth().signInWithPopup(provider);
                currentUser = result.user;
                isAuthenticated = true;
                userSettings.email = currentUser.email || userSettings.email || '';
                const existingName = String(userSettings.name || '').trim();
                const googleName = String(currentUser.displayName || '').trim();
                if (!existingName && googleName) {
                    userSettings.name = googleName;
                }

                        await firebase.auth().signInWithRedirect(provider);

        async function syncToFirestore() {
            if (isDeveloperBypassSession()) return;
            if (!hasPremiumAccess() || !isAuthenticated || !firebaseInitialized || !currentUser) return;

            try {
                const db = firebase.firestore();
                const moderationStatus = getResolvedCurrentUserModerationStatus();
                const enforceProfileOffline = moderationStatus.profileOffline === true || moderationStatus.socialIsolation === true;
                await db.collection('users').doc(currentUser.uid).set({
                    email: currentUser.email || '',
                    displayName: enforceProfileOffline ? '' : (userSettings.name || currentUser.displayName || 'Chef'),
                    photoURL: currentUser.photoURL || userSettings.profilePic || '',
                    bannerPic: userSettings.bannerPic || '',
                    country: enforceProfileOffline ? '' : (userSettings.country || ''),
                    bio: enforceProfileOffline ? '' : (userSettings.bio || ''),
                    isPublic: enforceProfileOffline ? false : userSettings.isPublic,
                    preferredLanguage: userSettings.language || 'en',
                    familyBookIds: (userFamilies || []).map(family => family.id).filter(Boolean),
                    updatedAt: new Date()
                }, { merge: true });

                const normalizedFamilies = (userFamilies || []).map(normalizeFamilyRecord).filter(family => family.id);
                if (normalizedFamilies.length > 0) {
                    const batch = db.batch();
                    normalizedFamilies.forEach(family => {
                        const familyDoc = db.collection('family-books').doc(String(family.id));
                        batch.set(familyDoc, {
                            id: String(family.id),
                            name: String(family.name || 'Family book').trim(),
                            tag: String(family.tag || ''),
                            colorKey: String(family.colorKey || 'sage'),
                            creatorId: String(family.creatorId || currentUser.uid || ''),
                            memberIds: Array.isArray(family.memberIds) ? family.memberIds.filter(Boolean) : [],
                            removedMembers: Array.isArray(family.removedMembers) ? family.removedMembers : [],
                            removedMemberIds: Array.isArray(family.removedMembers) ? family.removedMembers.map(member => member.userId).filter(Boolean) : [],
                            updatedAt: new Date()
                        }, { merge: true });
                    });
                    await batch.commit();
                }
            } catch (error) {
                console.error('Firestore sync error:', error);
            }
        }

        async function loadFamiliesFromFirestore() {
            if (isDeveloperBypassSession()) return;
            if (!hasPremiumAccess() || !isAuthenticated || !firebaseInitialized || !currentUser) return;

            try {
                const db = firebase.firestore();
                const [activeSnapshot, removedSnapshot] = await Promise.all([
                    db.collection('family-books').where('memberIds', 'array-contains', currentUser.uid).get(),
                    db.collection('family-books').where('removedMemberIds', 'array-contains', currentUser.uid).get()
                ]);

                const mergedFamilies = new Map();
                [activeSnapshot, removedSnapshot].forEach(snapshot => {
                    snapshot.forEach(doc => {
                        const data = doc.data() || {};
                        mergedFamilies.set(doc.id, normalizeFamilyRecord({
                            ...data,
                            id: data.id || doc.id,
                            removedMembers: Array.isArray(data.removedMembers) ? data.removedMembers : []
                        }));
                    });
                });

                if (mergedFamilies.size === 0) return;

                userFamilies = Array.from(mergedFamilies.values()).map(normalizeFamilyRecord);
                localStorage.setItem(getScopedStorageKey(legacyRecipeFamiliesStorageKey), JSON.stringify(userFamilies));
                syncNotificationBell();

                if (currentView === 'profile') {
                    renderProfile();
                } else if (currentView === 'index') {
                    renderList();
                }
            } catch (error) {
                console.error('Family cloud load error:', error);
            }
        }

        function getRecipeInstructionText(step) {
            return typeof step === 'string' ? step : step?.text || '';
        }

        function getRecipeInstructionImage(step) {
            return typeof step === 'string' ? '' : step?.image || '';
        }

        function getRecipeInstructionMinutes(step) {
            const explicit = typeof step === 'object' && step ? Number(step.minutes) : 0;
            if (Number.isFinite(explicit) && explicit > 0) return Math.round(explicit);
            return readStepMinutes(getRecipeInstructionText(step)) || 0;
        }

        function normalizeRecipeInstructionStep(step) {
            const text = getRecipeInstructionText(step).trim();
            if (!text) return null;

            return {
                text,
                image: getRecipeInstructionImage(step),
                minutes: getRecipeInstructionMinutes(step)
            };
        }

        function normalizeRecipeInstructions(steps) {
            return (steps || []).map(normalizeRecipeInstructionStep).filter(Boolean);
        }

        function runUculiAI() {
            showTemporaryFeatureOffline('Uculi AI Auto-Fill', 'It will stay offline until the recipe AI output is rebuilt and re-tested next week.');
            return;

            if (draftIngredients.length === 0 && draftSteps.length === 0) {
                showToast('Add ingredients or instructions first for the AI to analyze.', 'alert-circle');
                return;
            }

            let prepMins = 5 + (draftIngredients.length * 2);
            let cookMins = 0;
            let combinedText = [...draftIngredients, ...draftSteps.map(s => getRecipeInstructionText(s))].join(' ').toLowerCase();

            if (combinedText.match(/bake|roast|oven|horno|hornear|cuire|backen|forno/)) cookMins += 30;
            if (combinedText.match(/boil|simmer|hervir|bouillir|kochen|bollire/)) cookMins += 15;
            if (combinedText.match(/fry|saute|freir|frire|braten|friggere/)) cookMins += 10;

            let servings = 4;
            let diff = draftSteps.length > 10 ? 'Hard' : (draftSteps.length > 5 ? 'Medium' : 'Easy');

            let cuisine = 'European';
            if (combinedText.match(/soy|tofu|ginger|rice|noodle|sesame|soya/)) cuisine = 'Asian';
            if (combinedText.match(/pasta|tomato|basil|mozzarella|parmesan|pizza/)) cuisine = 'Italian';
            if (combinedText.match(/cumin|coriander|chili|tortilla|taco|curry|garam/)) cuisine = combinedText.includes('tortilla') ? 'Mexican' : 'Indian';

            let isVegetarian = !combinedText.match(/chicken|beef|pork|meat|fish|salmon|shrimp|pollo|carne|pescado|poulet|viande|poisson/);
            let isVegan = isVegetarian && !combinedText.match(/cheese|milk|butter|egg|cream|queso|leche|mantequilla|huevo|fromage|lait|beurre|oeuf/);

            document.getElementById('r-prepTime').value = prepMins;
            document.getElementById('r-cookTime').value = cookMins;
            document.getElementById('r-servings').value = servings;
            document.getElementById('r-difficulty').value = diff;
            document.getElementById('r-cuisine').value = cuisine;

            const dietCheckboxes = document.querySelectorAll('.diet-checkbox');
            dietCheckboxes.forEach(cb => {
                cb.checked = false;
                if (isVegetarian && cb.value === 'Vegetarian') cb.checked = true;
                if (isVegan && cb.value === 'Vegan') cb.checked = true;
            });

            showToast('Uculi AI has populated the recipe fields!', 'sparkles');
        }

        function cloneRecipeInstructionStep(step) {
            const normalizedStep = normalizeRecipeInstructionStep(step);
            return normalizedStep ? { ...normalizedStep } : null;
        }

        function getPublishedVersionCode(recipe) {
            if (!recipe) return initialPublishedVersionCode;

            const numericCode = Number(recipe.publishedVersionCode);
            if (Number.isFinite(numericCode) && numericCode >= initialPublishedVersionCode) {
                return Math.round(numericCode);
            }

            const numericVersion = Number.parseFloat(recipe.publishedVersion);
            if (Number.isFinite(numericVersion) && numericVersion >= 1) {
                return Math.round(numericVersion * 100);
            }

            return initialPublishedVersionCode;
        }

        function formatPublishedVersion(versionCode) {
            return (versionCode / 100).toFixed(2);
        }

        function getPublishedVersionLabel(recipe) {
            if (!recipe?.publishedId && recipe?.publishedVersionCode == null && recipe?.publishedVersion == null) return '';
            return `v${formatPublishedVersion(getPublishedVersionCode(recipe))}`;
        }

        function buildPublishedContentSignature(recipe) {
            const normalizedDiet = [...new Set((recipe.diet || []).filter(Boolean))].sort((left, right) => left.localeCompare(right));
            const normalizedInstructions = normalizeRecipeInstructions(recipe.instructions);

            return JSON.stringify({
                title: recipe.title || '',
                author: recipe.author || '',
                category: recipe.category || '',
                country: recipe.country || '',
                profile: recipe.profile || '',
                prepTime: Number(recipe.prepTime) || 0,
                cookTime: Number(recipe.cookTime) || 0,
                servings: Number(recipe.servings) || 0,
                difficulty: recipe.difficulty || '',
                diet: normalizedDiet,
                cuisine: recipe.cuisine || '',
                ingredients: [...(recipe.ingredients || [])],
                instructions: normalizedInstructions,
                tips: recipe.tips || ''
            });
        }

        function hasRecipeChangesSincePublish(recipe) {
            if (!recipe?.publishedId) return false;
            return buildPublishedContentSignature(recipe) !== (recipe.publishedContentSignature || '');
        }

        function isRecipePublishedLive(recipe) {
            return Boolean(recipe?.publishedId) && recipe.publicationState !== 'retracted';
        }

        function getRecipePublishedAtMs(recipe) {
            const publishedAtValue = recipe?.publishedAt;
            if (!publishedAtValue) return Number.NaN;

            if (typeof publishedAtValue?.toMillis === 'function') {
                return publishedAtValue.toMillis();
            }

            if (publishedAtValue instanceof Date) {
                return publishedAtValue.getTime();
            }

            if (typeof publishedAtValue === 'number') {
                return publishedAtValue;
            }

            const parsedMs = new Date(publishedAtValue).getTime();
            return Number.isFinite(parsedMs) ? parsedMs : Number.NaN;
        }

        function canUnpublishImmediately(recipe) {
            if (!recipe || recipe.familyId || !isRecipePublishedLive(recipe)) return false;

            const publishedAtMs = getRecipePublishedAtMs(recipe);
            if (!Number.isFinite(publishedAtMs)) return false;

            const ageMs = Date.now() - publishedAtMs;
            return ageMs >= 0 && ageMs <= publicationQuickRetractionWindowMs;
        }

        function getPublishActionLabel(recipe) {
            if (!recipe?.publishedId) {
                return recipe?.familyId ? 'Request publish vote' : 'Publish';
            }

            if (recipe?.publicationState === 'pending-retract') {
                return 'Offline in 24h';
            }

            if (isRecipePublishedLive(recipe)) {
                if (canUnpublishImmediately(recipe)) return 'Unpublish now (1h)';
                return 'Take offline in 24h';
            }

            if (recipe?.familyId) {
                return hasRecipeChangesSincePublish(recipe) ? 'Request republish vote' : 'Request publish vote';
            }

            return hasRecipeChangesSincePublish(recipe) ? 'Republish update' : 'Republish';
        }

        function getLocalRecipeByPublishedId(publishedRecipeId) {
            return recipes.find(recipe => recipe.source !== 'published' && recipe.publishedId === publishedRecipeId) || null;
        }

        function getPublishedRecipeFromCache(publishedRecipeId) {
            return publishedRecipesCache.find(recipe => recipe.id === publishedRecipeId) || null;
        }

        function isSavedPublishedRecipeOutdated(recipe) {
            if (!recipe || recipe.source !== 'published' || !recipe.publishedId) return false;

            const latestPublishedRecipe = getPublishedRecipeFromCache(recipe.publishedId);
            if (!latestPublishedRecipe || latestPublishedRecipe.publicationState === 'retracted') return false;

            return getPublishedVersionCode(latestPublishedRecipe) > getPublishedVersionCode(recipe);
        }

        function upsertPublishedRecipeCacheEntry(publishedRecipe) {
            if (!publishedRecipe?.id) return;

            const existingIndex = publishedRecipesCache.findIndex(recipe => recipe.id === publishedRecipe.id);
            if (existingIndex === -1) {
                publishedRecipesCache.push(publishedRecipe);
                return;
            }

            publishedRecipesCache[existingIndex] = publishedRecipe;
        }

        function buildPublishedRecipePayload(recipe, signature, versionCode) {
            return {
                title: recipe.title || '',
                author: recipe.author || 'Unknown',
                source: 'published',
                category: recipe.category || '',
                country: recipe.country || '',
                profile: recipe.profile || defaultPlaceholderProfile,
                prepTime: Number(recipe.prepTime) || 0,
                cookTime: Number(recipe.cookTime) || 0,
                servings: Number(recipe.servings) || 4,
                difficulty: recipe.difficulty || '',
                diet: [...(recipe.diet || [])],
                cuisine: recipe.cuisine || '',
                ingredients: [...(recipe.ingredients || [])],
                instructions: normalizeRecipeInstructions(recipe.instructions),
                tips: recipe.tips || '',
                authorEmail: currentUser?.email || userSettings.email || '',
                authorName: currentUser?.displayName || recipe.author || userSettings.name || 'Chef',
                authorId: currentUser?.uid || '',
                updatedAt: new Date(),
                likes: Array.isArray(recipe.likes) ? [...recipe.likes] : [],
                publicationState: 'live',
                publishedVersionCode: versionCode,
                publishedVersion: formatPublishedVersion(versionCode),
                publishedContentSignature: signature
            };
        }

        function getActiveFamilyMemberIds(family) {
            if (!family) return [];
            const removedIds = new Set((family.removedMembers || []).map(member => member?.userId).filter(Boolean));
            return [...new Set((family.memberIds || []).filter(Boolean))].filter(memberId => !removedIds.has(memberId));
        }

        function getPublicationApprovalThreshold(memberCount) {
            return Math.floor(memberCount / 2) + 1;
        }

        function resolveRecipePublicationVoteNotifications(recipeId, resolutionMessage = '') {
            const nowIso = new Date().toISOString();
            let changed = false;
            getFamilyNotifications().forEach(notification => {
                if (notification.type !== 'publication-vote' || notification.recipeId !== recipeId) return;
                if (!notification.resolvedAt) {
                    notification.resolvedAt = nowIso;
                    changed = true;
                }
                if (resolutionMessage) {
                    notification.message = resolutionMessage;
                    changed = true;
                }
            });
            if (changed) saveData();
        }

        function scheduleRecipeRetraction(recipe) {
            const retractionAtIso = new Date(Date.now() + publicationRetractionDelayMs).toISOString();
            recipe.publicationState = 'pending-retract';
            recipe.retractionRequestedAt = new Date().toISOString();
            recipe.scheduledRetractionAt = retractionAtIso;
            saveData();
            showToast(`Recipe scheduled to go offline on ${new Date(retractionAtIso).toLocaleString()}.`, 'cloud-off');
            return retractionAtIso;
        }

        async function requestFamilyPublicationVote(recipe) {
            const family = recipe.familyId ? getFamilyById(recipe.familyId) : null;
            if (!family?.id) {
                showToast('This recipe is marked as family but has no active family book. Save it as personal to publish.', 'alert-circle');
                return false;
            }

            const familyMembers = getActiveFamilyMemberIds(family);
            if (familyMembers.length < 2) {
                showToast('Family publication needs at least 2 active family members. Save it as personal to publish.', 'alert-circle');
                return false;
            }

            if (recipe.pendingPublicationVote?.status === 'pending') {
                showToast('A family publication vote is already pending. Open notifications to check votes.', 'bell');
                showNotificationsModal();
                return false;
            }

            const actorId = getCurrentActorId();
            const expiresAtIso = new Date(Date.now() + familyPublicationVoteTimeoutMs).toISOString();
            const threshold = getPublicationApprovalThreshold(familyMembers.length);

            recipe.pendingPublicationVote = {
                status: 'pending',
                requestedAt: new Date().toISOString(),
                requestedBy: actorId,
                familyId: family.id,
                requiredMemberIds: familyMembers,
                threshold,
                votes: { [actorId]: 'approve' },
                expiresAt: expiresAtIso
            };

            addFamilyNotification({
                type: 'publication-vote',
                title: 'Publication vote requested',
                message: `Vote to publish "${recipe.title}". Majority (${threshold}/${familyMembers.length}) is required before upload.`,
                familyId: family.id,
                recipeId: recipe.id,
                recipeTitle: recipe.title,
                action: {
                    kind: 'publication-vote',
                    expiresAt: expiresAtIso,
                    requiredMemberIds: familyMembers,
                    threshold,
                    votes: { [actorId]: 'approve' }
                }
            });

            saveData();
            syncNotificationBell();
            showToast('Family recipe: publish request sent for majority vote via notifications.', 'bell');
            return false;
        }

        async function publishRecipe(recipeId, options = {}) { if(!hasPremiumAccess()) { showPremiumModal("publish recipes"); return; }
            if (!isAuthenticated || !firebaseInitialized || !currentUser) {
                showToast('Sign in to publish recipes', 'alert-circle');
                return false;
            }

            if (isCurrentUserPublishBlocked()) {
                showToast(getActiveModerationMessage() || 'Publishing is currently blocked for your account.', 'shield-x', true);
                return false;
            }

            try {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe) return false;

                const bypassFamilyVote = options?.bypassFamilyVote === true;

                if (recipe.publicationState === 'pending-retract') {
                    const scheduledAtMs = new Date(recipe.scheduledRetractionAt || 0).getTime();
                    if (Number.isFinite(scheduledAtMs) && scheduledAtMs > Date.now()) {
                        showToast(`Already scheduled to go offline on ${new Date(scheduledAtMs).toLocaleString()}.`, 'clock');
                        return false;
                    }
                }

                if (isRecipePublishedLive(recipe) && recipe.publishedId) {
                    if (canUnpublishImmediately(recipe)) {
                        return unpublishRecipe(recipe.id, { source: 'quick-window' });
                    }

                    const retractionAtIso = scheduleRecipeRetraction(recipe);
                    try {
                        const db = firebase.firestore();
                        await db.collection('published-recipes').doc(recipe.publishedId).set({
                            publicationState: 'pending-retract',
                            retractionRequestedAt: recipe.retractionRequestedAt,
                            scheduledRetractionAt: retractionAtIso,
                            updatedAt: new Date()
                        }, { merge: true });
                    } catch (error) {
                        console.error('Retraction schedule sync failed:', error);
                    }
                    return true;
                }

                if (adminConfig.harmfulContentGuardEnabled) {
                    const moderationResult = analyzeRecipeHarmfulContent(recipe);
                    if (moderationResult.flagged) {
                        showHarmfulContentBlockedModal(recipe.title, moderationResult);
                        return false;
                    }
                }

                if (!bypassFamilyVote && recipe.familyId) {
                    return requestFamilyPublicationVote(recipe);
                }

                if (recipe.source === 'published' && !isPublishedRecipeOwnedByCurrentUser(recipe)) {
                    showToast('Only the original author can republish this community recipe.', 'alert-circle');
                    return false;
                }

                const db = firebase.firestore();
                let existingPublishedRecipe = null;
                let docRef = recipe.publishedId
                    ? db.collection('published-recipes').doc(recipe.publishedId)
                    : db.collection('published-recipes').doc();

                if (recipe.publishedId) {
                    const docSnapshot = await docRef.get();
                    if (docSnapshot.exists) {
                        existingPublishedRecipe = { ...docSnapshot.data(), id: docSnapshot.id };
                        if (!isPublishedRecipeOwnedByCurrentUser(existingPublishedRecipe)) {
                            showToast('Only the original author can update this published recipe.', 'alert-circle');
                            return false;
                        }
                    }
                }

                const signature = buildPublishedContentSignature(recipe);
                const previousSignature = existingPublishedRecipe?.publishedContentSignature || recipe.publishedContentSignature || signature;
                const isFirstPublish = !recipe.publishedId;
                const wasRetracted = !isFirstPublish && !isRecipePublishedLive(existingPublishedRecipe || recipe);
                const hasContentChanges = signature !== previousSignature;
                let versionCode = isFirstPublish ? initialPublishedVersionCode : getPublishedVersionCode(existingPublishedRecipe || recipe);

                if (!isFirstPublish && hasContentChanges) {
                    versionCode += 1;
                }

                const publishedAt = existingPublishedRecipe?.publishedAt || recipe.publishedAt || new Date();
                const payload = buildPublishedRecipePayload(recipe, signature, versionCode);

                await docRef.set({
                    ...payload,
                    publishedAt,
                    retractedAt: null
                }, { merge: true });

                recipe.publishedId = docRef.id;
                recipe.publishedAt = publishedAt;
                recipe.publishedVersionCode = versionCode;
                recipe.publishedVersion = formatPublishedVersion(versionCode);
                recipe.publishedContentSignature = signature;
                recipe.publicationState = 'live';
                recipe.scheduledRetractionAt = '';
                recipe.retractionRequestedAt = '';
                delete recipe.pendingPublicationVote;
                resolveRecipePublicationVoteNotifications(recipe.id, `Publication approved. "${recipe.title}" is now live in Browse.`);
                saveData();

                upsertPublishedRecipeCacheEntry({
                    ...payload,
                    id: docRef.id,
                    publishedAt,
                    retractedAt: null,
                    scheduledRetractionAt: null,
                    retractionRequestedAt: null
                });

                const versionLabel = `v${formatPublishedVersion(versionCode)}`;
                if (isFirstPublish) {
                    showToast(`Recipe published to Browse as ${versionLabel}`, 'check-circle');
                } else if (wasRetracted) {
                    showToast(`Recipe is back in Browse as ${versionLabel}`, 'check-circle');
                } else if (hasContentChanges) {
                    showToast(`Published update live as ${versionLabel}`, 'check-circle');
                } else {
                    showToast(`Recipe is already live as ${versionLabel}`, 'check-circle');
                }

                maybeRunAutomaticDuplicateCleanup();

                return true;
            } catch (error) {
                showToast(`Publish error: ${error.message}`, 'alert-circle');
                return false;
            }
        }

        async function unpublishRecipe(recipeId, options = {}) {
            if (!isAuthenticated || !firebaseInitialized || !currentUser) {
                showToast('Sign in to retract published recipes', 'alert-circle');
                return false;
            }

            try {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe?.publishedId) {
                    showToast('This recipe only exists locally right now, so there is nothing to remove from Browse.', 'info');
                    return false;
                }

                const db = firebase.firestore();
                const docRef = db.collection('published-recipes').doc(recipe.publishedId);
                const docSnapshot = await docRef.get();
                const existingPublishedRecipe = docSnapshot.exists ? { ...docSnapshot.data(), id: docSnapshot.id } : null;

                if (existingPublishedRecipe && !isPublishedRecipeOwnedByCurrentUser(existingPublishedRecipe)) {
                    showToast('Only the original author can retract this recipe.', 'alert-circle');
                    return false;
                }

                const updatedAt = new Date();
                await docRef.set({
                    publicationState: 'retracted',
                    retractedAt: updatedAt,
                    updatedAt
                }, { merge: true });

                recipe.publicationState = 'retracted';
                recipe.scheduledRetractionAt = '';
                recipe.retractionRequestedAt = '';
                saveData();

                upsertPublishedRecipeCacheEntry({
                    ...(existingPublishedRecipe || {}),
                    id: recipe.publishedId,
                    publicationState: 'retracted',
                    retractedAt: updatedAt,
                    updatedAt
                });

                const source = options?.source || 'manual';
                if (source === 'quick-window') {
                    showToast('Recipe unpublished instantly (within 1-hour window).', 'cloud-off');
                } else if (source === 'scheduled') {
                    showToast('Scheduled unpublish completed. Recipe is now offline.', 'cloud-off');
                } else {
                    showToast('Recipe removed from Browse. Saved copies stay with other cooks.', 'cloud-off');
                }
                return true;
            } catch (error) {
                showToast(`Unpublish error: ${error.message}`, 'alert-circle');
                return false;
            }
        }

        async function loadPublishedRecipes() {
            if (!firebaseInitialized) return [];

            try {
                const db = firebase.firestore();
                const snapshot = await db.collection('published-recipes').orderBy('publishedAt', 'desc').limit(50).get();
                publishedRecipesCache = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                hasLoadedPublishedRecipesCache = true;
                return publishedRecipesCache.filter(recipe => recipe.publicationState !== 'retracted');
            } catch (error) {
                console.error('Error loading published recipes:', error);
                return [];
            }
        }

        async function refreshPublishedRecipeById(publishedRecipeId) {
            if (!firebaseInitialized || !publishedRecipeId) return null;

            try {
                const db = firebase.firestore();
                const docSnapshot = await db.collection('published-recipes').doc(publishedRecipeId).get();
                if (!docSnapshot.exists) return null;

                const publishedRecipe = { ...docSnapshot.data(), id: docSnapshot.id };
                upsertPublishedRecipeCacheEntry(publishedRecipe);
                return publishedRecipe;
            } catch (error) {
                console.error('Error refreshing published recipe:', error);
                return null;
            }
        }

        function ensurePublishedRecipesCacheLoaded() {
            if (!firebaseInitialized || hasLoadedPublishedRecipesCache || isLoadingPublishedRecipesCache) return;
            if (!recipes.some(recipe => recipe.source === 'published' && recipe.publishedId)) return;

            isLoadingPublishedRecipesCache = true;
            loadPublishedRecipes()
                .catch(() => [])
                .finally(() => {
                    isLoadingPublishedRecipesCache = false;
                    if (currentView === 'index') renderList();
                });
        }

        function queuePublishedRecipeStatusRefresh(localRecipeId, publishedRecipeId) {
            if (!firebaseInitialized || !publishedRecipeId) return;

            const now = Date.now();
            const lastCheckedAt = publishedRecipeStatusChecks[publishedRecipeId] || 0;
            if (now - lastCheckedAt < 120000) return;

            publishedRecipeStatusChecks[publishedRecipeId] = now;
            refreshPublishedRecipeById(publishedRecipeId).then(() => {
                if (currentView === 'index' && recipes.some(recipe => recipe.id === localRecipeId)) {
                    renderDetail(localRecipeId);
                }
            });
        }

        function isPublishedRecipeOwnedByCurrentUser(recipe) {
            if (!recipe) return false;
            if (currentUser?.uid && recipe.authorId) return recipe.authorId === currentUser.uid;
            if (userSettings.email && recipe.authorEmail) return recipe.authorEmail === userSettings.email;
            return false;
        }

        function isRecipeOwnedByCurrentUser(recipe) {
            if (!recipe) return false;
            if (recipe.source === 'published') return isPublishedRecipeOwnedByCurrentUser(recipe);
            return true;
        }

        function isRecipeEditable(recipe) {
            return Boolean(recipe && recipe.source === 'local');
        }

        function isRecipeAlwaysFavorite(recipe) {
            return Boolean(recipe && recipe.source === 'local');
        }

        function isRecipeFavorited(recipe) {
            if (!recipe) return false;
            return isRecipeAlwaysFavorite(recipe) || Boolean(userSettings.favorites?.includes(recipe.id));
        }

        function canRateRecipe(recipe) {
            return Boolean(recipe) && !isRecipeOwnedByCurrentUser(recipe);
        }

                primary: 'app-btn-primary text-white',
                accent: 'border-gold bg-gold text-white hover:border-yellow-600 hover:bg-yellow-600',
                secondary: 'border-parchmentDark bg-white text-forest hover:border-gold hover:text-sage',
                subtle: 'border-sage border-opacity-20 bg-accent bg-opacity-60 text-forest hover:border-gold hover:bg-white hover:text-sage',

                danger: 'border-red-200 bg-white text-red-500 hover:border-red-500 hover:text-red-600'
            };

            return `${baseClasses} ${sizeClasses}${widthClass} ${variantClasses[variant] || variantClasses.secondary}`;

        function applyStaticAppButtonClasses(root = document) {

            return recipes.some(recipe => recipe.source === 'published' && recipe.publishedId === publishedRecipeId);
        }

        function getPublishedRecipeLikeCount(recipe) {
            return Array.isArray(recipe?.likes) ? recipe.likes.length : 0;
        }

        function getCurrentLikeActorId() {
            return currentUser?.uid || userSettings.email || null;
        }

        function hasUserLikedPublishedRecipe(recipe) {
            const actorId = getCurrentLikeActorId();
            if (!actorId || !Array.isArray(recipe?.likes)) return false;
            return recipe.likes.includes(actorId);
        }

        function getTotalPublishedLikesForAuthor(authorId) {
            if (!authorId) return 0;
            return (publishedRecipesCache || [])
                .filter(recipe => recipe.authorId === authorId && recipe.publicationState !== 'retracted')
                .reduce((total, recipe) => total + getPublishedRecipeLikeCount(recipe), 0);
        }

        function isAuthorInMyActiveFamilies(authorId) {
            if (!authorId) return false;
            return (userFamilies || []).some(family => {
                const isRemoved = family?.removedMembers?.some(member => member.userId === currentUser?.uid);
                if (isRemoved) return false;
                return Array.isArray(family?.memberIds) && family.memberIds.includes(authorId);
            });

        async function togglePublishedRecipeLike(publishedRecipeId, returnView = 'browse') {
            if (!isAuthenticated || !firebaseInitialized || !currentUser) {
                showToast('Log in om recepten te liken.', 'alert-circle', true);
                return;
            }

            if (isCurrentUserSociallyIsolated()) {
                showToast('Likes are disabled while your account is under permanent social restriction.', 'alert-circle', true);
                return;
            }

            const actorId = getCurrentLikeActorId();
            if (!actorId) {
                showToast('Kon je profiel niet bepalen voor likes.', 'alert-circle', true);
                return;
            }

            const recipe = publishedRecipesCache.find(item => item.id === publishedRecipeId);
            if (!recipe) {
                showToast('Recept niet gevonden.', 'alert-circle', true);
                return;
            }

            if (isPublishedRecipeOwnedByCurrentUser(recipe)) {
                showToast('Je kunt je eigen recept niet liken.', 'alert-circle');
                return;
            }
            if (isAuthorInMyActiveFamilies(recipe.authorId)) {
                showToast('Likes voor recepten van je families staan uit.', 'alert-circle');
                return;
            }

            const liked = hasUserLikedPublishedRecipe(recipe);

            try {
                const db = firebase.firestore();
                const recipeRef = db.collection('published-recipes').doc(publishedRecipeId);
                await recipeRef.update({
                    likes: liked
                        ? firebase.firestore.FieldValue.arrayRemove(actorId)
                        : firebase.firestore.FieldValue.arrayUnion(actorId),
                    updatedAt: new Date()
                });

                recipe.likes = Array.isArray(recipe.likes) ? recipe.likes : [];
                if (liked) {
                    recipe.likes = recipe.likes.filter(id => id !== actorId);
                    showToast('Like verwijderd.', 'heart-off');
                } else {
                    recipe.likes = [...recipe.likes, actorId];
                    showToast('Recipe geliked!', 'heart');
                }
                upsertPublishedRecipeCacheEntry({ ...recipe });

                if (returnView === 'detail') {
                    renderPublishedRecipeDetail(publishedRecipeId);
                    return;
                }
                if (returnView === 'profile') {
                    renderProfile();
                    return;
                }
                if (returnView === 'public-profile' && viewedPublicProfileAuthorId) {
                    renderPublicProfile(viewedPublicProfileAuthorId);
                    return;
                }
                renderBrowse();
            } catch (error) {
                console.error('Toggle like error:', error);
                showToast('Liken lukte niet. Probeer opnieuw.', 'alert-circle', true);
            }
        }

        function toggleSavedPublishedRecipe(publishedRecipeId, returnView = 'browse') {
            if (isCurrentUserSociallyIsolated()) {
                showToast('Saving community recipes is disabled while your account is under permanent social restriction.', 'alert-circle', true);
                return;
            }

            const existingIndex = recipes.findIndex(recipe => recipe.source === 'published' && recipe.publishedId === publishedRecipeId);

            if (existingIndex !== -1) {
                const removedRecipe = recipes[existingIndex];
                recipes.splice(existingIndex, 1);
                userSettings.favorites = (userSettings.favorites || []).filter(id => id !== removedRecipe.id);
                saveData();
                showToast('Removed from your Index', 'heart-off');
                if (returnView === 'detail') renderPublishedRecipeDetail(publishedRecipeId);
                else if (returnView === 'public-profile' && viewedPublicProfileAuthorId) renderPublicProfile(viewedPublicProfileAuthorId);
                else renderBrowse();
                return;
            }

            const publishedRecipe = publishedRecipesCache.find(recipe => recipe.id === publishedRecipeId);
            if (!publishedRecipe) return;

            recipes.unshift({
                ...publishedRecipe,
                id: generateId(),
                source: 'published',
                publishedId: publishedRecipe.id,
                author: publishedRecipe.authorName || publishedRecipe.author || 'Chef',
                profile: publishedRecipe.profile || defaultPlaceholderProfile,
                ingredients: [...(publishedRecipe.ingredients || [])],
                instructions: normalizeRecipeInstructions(publishedRecipe.instructions),
                diet: [...(publishedRecipe.diet || [])],
                publishedVersionCode: getPublishedVersionCode(publishedRecipe),
                publishedVersion: formatPublishedVersion(getPublishedVersionCode(publishedRecipe)),
                publishedContentSignature: publishedRecipe.publishedContentSignature || buildPublishedContentSignature(publishedRecipe),
                publicationState: publishedRecipe.publicationState || 'live',
                checkedIngredients: [],
                checkedSteps: [],
                personalNotes: '',
                lastOpened: Date.now()
            });

            saveData();
            showToast('Saved to your Index', 'heart');
            if (returnView === 'detail') renderPublishedRecipeDetail(publishedRecipeId);
            else if (returnView === 'public-profile' && viewedPublicProfileAuthorId) renderPublicProfile(viewedPublicProfileAuthorId);
            else renderBrowse();
        }

        function exportAllAsJSON() {
            if (requirePremiumFeature('backupDownload')) {
                return;
            }

            const backup = {
                settings: userSettings,
                recipes,
                exportDate: new Date().toISOString()
            };

            const dataStr = JSON.stringify(backup, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `recipe-archive-backup-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showToast('Backup downloaded!', 'download');
        }

        function importFromJSON(e) {
            if (requirePremiumFeature('backupRestore')) {
                e.target.value = '';
                return;
            }

            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const backup = JSON.parse(event.target.result);
                    if (backup.settings && backup.recipes) {
                        userSettings = { ...userSettings, ...backup.settings };
                        recipes = backup.recipes;
                        saveData();
                        showToast('Backup restored successfully!', 'check-circle');
                        renderList();
                        e.target.value = '';
                    } else {
                        showToast('Invalid backup file format', 'alert-circle');
                    }
                } catch (err) {
                    showToast('Error restoring backup', 'x-circle');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

            const recipe = recipes.find(r => r.id === recipeId);

            const normalizePdfText = (value, fallback = '') => {
                const normalized = String(value ?? fallback)
                    .replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '')
                    .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')
                    .replace(/\u00A0/g, ' ')
                    .normalize('NFKD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/[“”]/g, '"')
                    .replace(/[‘’]/g, "'")
                    .replace(/[–—]/g, '-')
                    .replace(/•/g, '-')
                    .replace(/°/g, ' deg')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .replace(/[^\x20-\x7E]/g, '')
                    .trim();
                return normalized || fallback;
