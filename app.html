<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uculi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
        <!-- Firebase -->
        <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js" defer></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js" defer></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js" defer></script>
        <!-- Google Sign-In -->
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <script src="firebase-config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: '#f6f1e8',
                        paper: '#fbf8f3',
                        parchmentDark: '#E4D7C4',
                        sage: '#909870',
                        forest: '#1c1410',
                        gold: '#c89050',
                        accent: '#fbf8f3'
                    },
                    fontFamily: {
                        fantasy: ['"Fraunces"', 'serif'],
                        serif: ['"Fraunces"', 'serif'],
                        body: ['"Outfit"', 'sans-serif'],
                        sans: ['"Outfit"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --shell-bg: #f6f1e8;
            --shell-border: #E4D7C4;
            --body-bg: #f6f1e8;
            --text-primary: #1c1410;
            --text-muted: #909870;
            --surface-main: #fbf8f3;
            --surface-soft: #f6f1e8;
            --surface-muted: #f6f1e8;
        }

        body {
            background-color: var(--body-bg);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            color: var(--text-primary);
        }

        #app-shell {
            background-color: var(--shell-bg);
            border-color: var(--shell-border);
            transition: background-color 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
        }

        #app-content {
            padding-bottom: calc(6rem + env(safe-area-inset-bottom, 0px));
            transition: padding-bottom 220ms ease;
        }

        #main-nav {
            will-change: transform, opacity;
        }

        #main-header {
            position: sticky;
            top: 0;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: calc(1rem + env(safe-area-inset-top, 0px)) 1.5rem 1rem;
            background: rgba(251, 248, 243, 0.85); /* parchment but slightly transparent */
            border-bottom: 1px solid rgba(144, 152, 112, 0.28);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .app-header-brand {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .app-header-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.85rem;
            height: 2.85rem;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 1rem;
            border: 1px solid rgba(28, 20, 16, 0.12);
            background: #fbf8f3;
            box-shadow: 0 10px 18px rgba(28, 20, 16, 0.12);
        }

        .app-header-mark img,
        .brand-boekje {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .brand-apple {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
            border-radius: 999px;
            object-fit: cover;
        }

        .app-header-copy {
            min-width: 0;
        }

        .app-header-kicker {
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: #909870;
        }

        .app-header-subtitle {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.18rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: #909870;
        }

        #main-nav {
            position: fixed;
            left: 50%;
            bottom: 0.75rem;
            width: min(calc(100vw - 1.5rem), 54rem);
            margin: 0;
            transform: translateX(-50%);
            border: 1px solid rgba(144, 152, 112, 0.18);
            border-radius: 1.25rem;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            box-shadow: 0 16px 34px rgba(28, 20, 16, 0.16);
            z-index: 40;
        }

        .floating-back-button {
            position: absolute;
            left: 1rem;
            bottom: calc(5.75rem + env(safe-area-inset-bottom, 0px));
            width: 3rem;
            height: 3rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.9rem;
            border: 1px solid rgba(144, 152, 112, 0.28);
            background: rgba(255, 255, 255, 0.96);
            color: #1c1410;
            box-shadow: 0 10px 22px rgba(28, 20, 16, 0.16);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 46;
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease, color 180ms ease, border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
        }

        .floating-back-button.is-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .floating-back-button:hover {
            border-color: rgba(200, 144, 80, 0.55);
            color: #c89050;
            box-shadow: 0 12px 24px rgba(28, 20, 16, 0.2);
        }

        .floating-back-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .app-nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 0.2rem;
            padding: 0.35rem;
        }

        .app-nav-button {
            position: relative;
            display: flex;
            flex: 1 1 0;
            min-width: 0;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            padding: 0.8rem 0.45rem 0.7rem;
            border-radius: 1rem;
            color: var(--text-muted);
            transition: transform 180ms ease, color 180ms ease, background-color 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        }

        .app-nav-button i {
            margin-bottom: 0;
            transition: transform 180ms ease, color 180ms ease;
        }

        .app-nav-button:hover {
            color: var(--text-primary);
        }

        .app-nav-button.is-active {
            color: var(--text-primary);
            background: linear-gradient(180deg, rgba(251, 248, 243, 0.95), rgba(246, 241, 232, 0.92));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 10px 18px rgba(28, 20, 16, 0.08);
        }

        .app-nav-button.is-active i,
        .app-nav-button.is-active svg {
            color: #1c1410;
            fill: #909870;
            stroke: #1c1410;
            transform: none;
        }

        .app-nav-button.is-active::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0.28rem;
            width: 1rem;
            height: 0.16rem;
            transform: translateX(-50%);
            border-radius: 999px;
            background: #909870;
        }

        .app-nav-button svg {
            width: 1.5rem;
            height: 1.5rem;
        }

        .app-nav-label {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .header-icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.75rem;
            height: 2.75rem;
            flex: 0 0 2.75rem;
            border-radius: 0.85rem;
            border: 1px solid rgba(144, 152, 112, 0.28);
            background: #fbf8f3;
            color: #1c1410;
            box-shadow: none;
        }

        .header-icon-button:hover {
            border-color: rgba(200, 144, 80, 0.55);
            color: #c89050;
        }

        #main-header #header-back,
        #main-header #header-help,
        #main-header #header-open-settings {
            width: 2.75rem;
            height: 2.75rem;
            padding: 0;
        }

        #header-back[hidden],
        #header-help[hidden],
        #header-open-settings[hidden],
        #undo-delete-label {
            display: none !important;
        }

        #undo-delete-button {
            width: 2.75rem;
            height: 2.75rem;
            padding: 0;
            justify-content: center;
        }

        .floating-back-button {
            display: none !important;
        }

        .settings-sheet {
            max-width: 40rem;
            margin: 0 auto;
            background: transparent;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            min-height: 2.75rem;
            padding: 0.35rem 0.2rem;
            color: #1c1410;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .settings-status {
            min-width: 0;
            color: #909870;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: right;
        }

        .settings-divider {
            height: 1px;
            margin: 0.2rem 0;
            background: rgba(144, 152, 112, 0.35);
        }

        .settings-select {
            max-width: 11.5rem;
            height: 2.1rem;
            border: 0;
            background: transparent;
            color: #909870;
            font-weight: 700;
            text-align: right;
        }

        .settings-actions {
            padding: 0.15rem 0 0.45rem;
        }

        button.settings-row {
            width: 100%;
            background: transparent;
            text-align: left;
        }

        .settings-disclosure {
            overflow: hidden;
        }

        .settings-disclosure > summary {
            list-style: none;
        }

        .settings-disclosure > summary::-webkit-details-marker {
            display: none;
        }

        .settings-disclosure-chevron {
            transition: transform 180ms ease, color 180ms ease, border-color 180ms ease, background-color 180ms ease;
        }

        .settings-disclosure[open] .settings-disclosure-chevron {
            transform: rotate(180deg);
            color: #c89050;
            border-color: rgba(200, 144, 80, 0.45);
            background-color: rgba(200, 144, 80, 0.12);
        }

        @media (min-width: 768px) {
            #main-header {
                padding: calc(1.1rem + env(safe-area-inset-top, 0px)) 1.6rem 1.1rem;
            }

            .app-nav-inner {
                justify-content: center;
                gap: 0.75rem;
                padding: 0.55rem 0.7rem;
            }

            .app-nav-button {
                flex: 0 1 auto;
                min-width: 5.2rem;
                padding: 0.85rem 0.95rem 0.75rem;
            }
        }

        @media (min-width: 1024px) {
            .floating-back-button {
                left: 1.25rem;
                top: calc(6.6rem + env(safe-area-inset-top, 0px));
                bottom: auto;
            }
        }

        .action-row,
        .index-toolbar,
        .profile-actions,
        .settings-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-start;
            gap: 0.5rem;
        }

        .button-pair {
            display: flex;
            flex-wrap: nowrap;
            align-items: stretch;
            justify-content: stretch;
            width: 100%;
            gap: 0.5rem;
        }

        .button-pair > button,
        .button-pair > label {
            flex: 1 1 0;
            width: auto;
            min-width: 0;
            max-width: none;
            justify-content: center;
        }

        .index-toolbar {
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 0.4rem;
        }

        .index-view-switch {
            display: contents;
        }

        .index-view-switch > button,
        .index-toolbar > button {
            flex: 0 0 2.75rem;
            width: 2.75rem;
            min-width: 2.75rem;
            max-width: 2.75rem;
            height: 2.75rem;
            min-height: 2.75rem;
            padding-left: 0;
            padding-right: 0;
        }

        .quick-add-submit {
            flex-shrink: 0;
            width: 2.75rem;
            height: 2.75rem;
            margin-right: 0.25rem;
            border: 1px solid #556340;
            border-radius: 0.75rem;
            background: #62724c;
            color: #fbf8f3;
        }

        .quick-add-submit:hover {
            background: #909870;
            border-color: #7d8a62;
            color: #fbf8f3;
        }

        button.app-btn-primary,
        label.app-btn-primary {
            background-color: #62724c;
            border-color: #556340;
            color: #fbf8f3;
        }

        button.app-btn-primary:hover,
        label.app-btn-primary:hover {
            background-color: #909870;
            border-color: #7d8a62;
            color: #fbf8f3;
        }

        button.notebook-view-toggle.is-active {
            background-color: #62724c;
            color: #fbf8f3;
        }

        #header-add-recipe {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            height: 2.75rem;
            padding: 0 0.9rem;
            border-radius: 0.85rem;
            background: #62724c;
            color: #fbf8f3;
            font-family: Outfit, sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1;
            box-shadow: none;
        }

        #header-add-recipe:hover {
            background: #c89050;
            color: #1c1410;
        }

        #header-add-recipe[hidden] {
            display: none !important;
        }

        .profile-banner {
            position: relative;
            height: 6.5rem;
            background-color: #f6f1e8;
            background-position: center;
            background-size: cover;
        }

        .profile-banner::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(246, 241, 232, 0.2), rgba(28, 20, 16, 0.22));
        }

        .profile-identity {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-top: -2.15rem;
            padding: 0 1rem 1.15rem;
            text-align: center;
        }

        .profile-avatar {
            width: 5.25rem;
            height: 5.25rem;
            flex: 0 0 auto;
            border: 3px solid #fbf8f3;
            border-radius: 999px;
            background-color: #f6f1e8;
            background-position: center;
            background-size: cover;
            box-shadow: 0 10px 22px rgba(28, 20, 16, 0.16);
        }

        .profile-copy {
            min-width: 0;
            width: 100%;
        }

        .profile-name {
            margin: 0;
            color: #1c1410;
            font-size: clamp(1.65rem, 7vw, 2.15rem);
            line-height: 1.1;
            overflow-wrap: anywhere;
        }

        .profile-place {
            margin: 0.35rem 0 0;
            color: #909870;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            line-height: 1.35;
            text-transform: uppercase;
        }

        .profile-bio {
            margin: 0.55rem 0 0;
            color: #1c1410;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .profile-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.45rem;
        }

        .profile-chips {
            margin-top: 0.75rem;
        }

        .profile-actions {
            margin-top: 0.85rem;
        }

        @media (min-width: 768px) {
            .profile-banner {
                height: 10.5rem;
            }

            .profile-identity {
                display: grid;
                grid-template-columns: 7.25rem minmax(0, 1fr);
                align-items: start;
                gap: 1.25rem;
                margin-top: 0;
                padding: 0 2rem 1.5rem;
                text-align: left;
            }

            .profile-avatar {
                width: 7.25rem;
                height: 7.25rem;
                margin-top: -3rem;
            }

            .profile-copy {
                flex: 1 1 auto;
                width: auto;
            }

            .profile-name {
                font-size: 2.6rem;
            }

            .profile-chips {
                justify-content: flex-start;
            }
        }

        .app-overlay {
            align-items: flex-end;
            justify-content: center;
            padding: 1rem;
            padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .app-modal-panel {
            width: min(100%, 42rem);
            max-height: min(92vh, 92dvh);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--shell-border);
            border-radius: 1rem;
            background: var(--surface-main);
            box-shadow: 0 24px 44px rgba(28, 20, 16, 0.2);
        }

        .app-modal-panel--wide {
            width: min(100%, 72rem);
        }

        .app-modal-body {
            flex: 1 1 auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .app-modal-footer {
            display: flex;
            flex-direction: column-reverse;
            gap: 0.75rem;
        }

        @media (min-width: 640px) {
            .app-overlay {
                align-items: center;
                padding: 1.5rem;
            }

            .app-modal-footer {
                flex-direction: row;
                align-items: center;
                justify-content: flex-end;
            }
        }

        @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
            body.desktop-nav-autohide-enabled #app-content {
                padding-bottom: calc(6rem + env(safe-area-inset-bottom, 0px));
            }

            body.desktop-nav-autohide-enabled #main-nav {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
                transition: transform 220ms ease, opacity 220ms ease, box-shadow 220ms ease, width 220ms ease, background-color 220ms ease;
            }

            body.desktop-nav-hidden #main-nav {
                transform: translateX(-50%) translateY(calc(100% + 0.75rem));
                opacity: 0;
                box-shadow: none;
            }

            body.desktop-nav-autohide-enabled #main-nav:hover,
            body.desktop-nav-autohide-enabled #main-nav:focus-within {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 1023px) {
            .floating-back-button {
                display: none !important;
            }
        }

        @media (max-width: 767px) {
            #main-header {
                gap: 0.45rem;
                padding: calc(0.4rem + env(safe-area-inset-top, 0px)) 0.7rem 0.35rem;
            }

            #main-header h1 {
                font-size: 1.2rem;
            }

            #main-header > button {
                height: 2.75rem;
                gap: 0.35rem;
                padding-left: 0.9rem;
                padding-right: 0.9rem;
                font-size: 0.82rem;
                line-height: 1.15;
            }

            #main-header > button i {
                width: 0.95rem;
                height: 0.95rem;
            }

            #header-add-recipe {
                width: 2.75rem;
                padding: 0;
            }

            #header-add-recipe .header-add-label {
                display: none;
            }

            .index-overview {
                margin-bottom: 0.75rem !important;
            }

            .index-overview .index-overview-head {
                padding: 0.2rem 0 0.75rem !important;
            }

            .index-overview .index-overview-title {
                font-size: 1.15rem;
                line-height: 1.15;
            }

            .index-overview .index-overview-count {
                margin-top: 0.35rem !important;
            }

            .index-overview .index-plan-note {
                margin-top: 0.5rem !important;
                padding: 0.15rem 0 0 !important;
            }

            .index-overview .index-plan-detail {
                display: none;
            }

            .app-header-brand {
                gap: 0.65rem;
            }

            .app-header-mark {
                width: 2.15rem;
                height: 2.15rem;
                border-radius: 0.55rem;
            }

            .app-header-kicker {
                font-size: 0.54rem;
                letter-spacing: 0.18em;
            }

            .app-header-subtitle {
                font-size: 0.68rem;
                line-height: 1.2;
                max-width: none;
                white-space: nowrap;
            }

            .app-header-subtitle .brand-apple {
                width: 0.85rem;
                height: 0.85rem;
            }

            .app-header-mark {
                box-shadow: none;
            }

            #app-shell {
                border-width: 0;
                box-shadow: none;
            }

            #app-content {
                padding-bottom: calc(4.35rem + env(safe-area-inset-bottom, 0px));
            }

            #app-content .screen-sheet,
            #app-content .profile-sheet > .bg-white,
            #app-content .profile-sheet > .grid > div,
            body.chrome-push:not(.cooking-mode-active) .push-sheet,
            body.chrome-push:not(.cooking-mode-active) .detail-shell {
                background-color: transparent;
                background-image: none;
                border-width: 0;
                border-radius: 0;
                box-shadow: none;
            }

            #app-content .screen-sheet > div,
            #app-content .index-overview-head {
                background-color: transparent;
                background-image: none;
            }

            #app-content .index-plan-note,
            #app-content .quiet-panel {
                background-color: transparent;
                border-width: 0;
                border-radius: 0;
                box-shadow: none;
                padding-left: 0;
                padding-right: 0;
            }

            #app-content .screen-sheet > .border-b,
            #app-content .screen-sheet > [class*="p-"],
            #app-content .screen-sheet > [class*="px-"] {

            if (isPermanent) return 'Permanent';

            if (durationUnit === 'weeks') return `${value} week${value === 1 ? '' : 's'}`;
            if (durationUnit === 'months') return `${value} month${value === 1 ? '' : 's'}`;
            return `${value} day${value === 1 ? '' : 's'}`;
        }

        function getDurationExpirationIso(durationUnit, durationValue, isPermanent = false) {
            if (isPermanent) return '';
            const value = Math.max(1, Number(durationValue) || 1);
            const now = new Date();
            const next = new Date(now.getTime());
            if (durationUnit === 'weeks') {
                next.setDate(next.getDate() + (value * 7));
            } else if (durationUnit === 'months') {
                next.setMonth(next.getMonth() + value);
            } else {
                next.setDate(next.getDate() + value);
            }
            return next.toISOString();
        }

            if (!normalized) return '';
            const primaryCode = normalized.split(/[-_]/)[0];
            return supportedAppLanguages.includes(primaryCode) ? primaryCode : '';
        }

        function detectPreferredSupportedLanguage() {
            const candidates = [];
            if (Array.isArray(navigator?.languages)) {
                candidates.push(...navigator.languages);
            }
            candidates.push(navigator?.language, navigator?.userLanguage);

            for (const candidate of candidates) {
                const resolved = resolveSupportedLanguage(candidate);
                if (resolved) return resolved;
            }

            return 'en';
        }

        function getRequestedUiLanguage() {
            return resolveSupportedLanguage(new URLSearchParams(window.location.search || '').get(uiLanguageQueryParam));
        }

        function getActiveUiLanguage() {
            return (
                resolveSupportedLanguage(userSettings?.language)
                || resolveSupportedLanguage(localStorage.getItem(globalUiLanguageStorageKey))
                || detectPreferredSupportedLanguage()
            );
        }

        function ensureUiLanguagePreference() {
            const language = getRequestedUiLanguage() || getActiveUiLanguage() || 'en';
            userSettings.language = language;
            document.documentElement.lang = language;
            localStorage.setItem(globalUiLanguageStorageKey, language);
            return language;
        }

        const _UNIT_KEYS_SORTED = Object.keys(_UNIT_MAP).sort((a,b) => b.length - a.length);

        const _NO_CONVERT = new Set([

        const _TEXT2NUM = [
            [/\banderhalf\b/gi,1.5],[/\bdrieënhalf\b/gi,3.5],[/\btweeënhalf\b/gi,2.5],
            [/\bone\s+and\s+a\s+half\b/gi,1.5],[/\btwo\s+and\s+a\s+half\b/gi,2.5],
            [/\bmedio\b/gi,0.5],[/\bmedia\b/gi,0.5],

        function _escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
        function _sround(n,d=1){ const f=Math.pow(10,d); return Math.round(n*f)/f; }

        function _extractAmount(text) {
            let t = text.replace(/½/g,'0.5').replace(/¼/g,'0.25').replace(/¾/g,'0.75')
                        .replace(/⅓/g,'0.333').replace(/⅔/g,'0.667').replace(/,/g,'.').trim();
            const f2 = t.match(/^(\d+)\s+(\d+)\/(\d+)\b/);
            if (f2) return {amount: +f2[1] + +f2[2] / +f2[3], rest: t.slice(f2[0].length).trim()};
            const f1 = t.match(/^(\d+)\/(\d+)\b/);
            if (f1) return {amount: +f1[1] / +f1[2], rest: t.slice(f1[0].length).trim()};
            const n = t.match(/^(\d+\.?\d*)/);
            if (n) return {amount: parseFloat(n[1]), rest: t.slice(n[0].length).trim()};
            return {amount: null, rest: t};
        }

        function _extractUnit(text) {
            const lo = text.toLowerCase();
            for (const k of _UNIT_KEYS_SORTED) {
                if (new RegExp('^' + _escRe(k) + '(?=[\\s,.]|$)','i').test(lo))
                    return {unitKey: k, rest: text.slice(k.length).trim()};
            }
            return {unitKey: null, rest: text};
        }

        function _checkNoConvert(text) {
            const lo = text.toLowerCase();
            const sorted = [..._NO_CONVERT].sort((a,b)=>b.length-a.length);
            for (const term of sorted) {
                if (new RegExp('^' + _escRe(term) + '(?=[\\s,.]|$)','i').test(lo))
                    return {noConvert: term, rest: text.slice(term.length).trim()};
            }
            return {noConvert: null, rest: text};
        }

        function _stripConn(s){ return s.replace(/^(of|van|de|del|la|el|los|las)\s+/i,'').trim(); }

        function _smartConvert(rawText, system) {
            if (!rawText) return rawText;
            // Step 1: text → number
            let t = String(rawText);
            for (const [re, val] of _TEXT2NUM) t = t.replace(re, String(val));
            // Step 2: amount
            const {amount, rest: r1} = _extractAmount(t);
            // Step 3a: no-convert check
            const {noConvert, rest: r2} = _checkNoConvert(r1);
            if (noConvert) {
                // Absolute: return as-is, original preserved
                const qty = amount !== null ? `${amount} ` : '';
                return `${qty}${noConvert} ${_stripConn(r2)}`.trim();
            }
            // Step 3b: unit match
            const {unitKey, rest: r3} = _extractUnit(r1);
            if (!unitKey || amount === null) return rawText; // unknown → pass-through
            const meta = _UNIT_MAP[unitKey];
            const baseVal = amount * meta.b;
            const orig = `${amount} ${unitKey}`;
            let cv, cu;
            if (meta.u === 'ml') {
                if (system === 'imperial') {
                    if (baseVal >= 60)  { cv = _sround(baseVal/240, 2); cu = 'cups'; }
                    else               { cv = _sround(baseVal/29.5735, 2); cu = 'fl.oz'; }
                } else {
                    if (baseVal >= 1000){ cv = _sround(baseVal/1000, 2); cu = 'liter'; }
                    else if (baseVal >= 100){ cv = _sround(baseVal, 0); cu = 'ml'; }
                    else               { cv = _sround(baseVal, 1); cu = 'ml'; }
                }
            } else {
                if (system === 'imperial') {
                    if (baseVal >= 226) { cv = _sround(baseVal/453.592, 2); cu = 'lb'; }
                    else               { cv = _sround(baseVal/28.3495, 1); cu = 'oz'; }
                } else {
                    if (baseVal >= 1000){ cv = _sround(baseVal/1000, 2); cu = 'kg'; }
                    else               { cv = _sround(baseVal, 0); cu = 'gram'; }
                }
            }
            const ingredient = _stripConn(r3).trim() || r3 || '';
            const alreadySame = (unitKey === cu || (unitKey === 'ml' && cu === 'ml') || (unitKey === 'g' && cu === 'gram'));
            if (alreadySame && cv === amount) return rawText; // nothing changed
            return `${cv} ${cu} ${ingredient} (${orig})`.replace(/\s+/g,' ').trim();
        }

        // Temperature conversion (separate, always applies)
        function _convertTemp(text, system) {
            if (system === 'imperial') {
                return text.replace(/(\d+[\.,]?\d*)\s*(°c|celsius|graden celsius)\b/gi, (_, n) => {
                    const f = Math.round((parseFloat(n.replace(',','.')) * 9/5) + 32);
                    return `${n}°C (${f}°F)`;
                });
            } else {
                return text.replace(/(\d+[\.,]?\d*)\s*(°f|fahrenheit)\b/gi, (_, n) => {
                    const c = Math.round((parseFloat(n.replace(',','.')) - 32) * 5/9);
                    return `${c}°C`;
                });
            }
        }

        function applyMeasurementSystem(text) {
            let resultText = String(text || '');
            if (!resultText) return resultText;
            const system = (userSettings.measurementSystem || 'Metric') === 'Imperial' ? 'imperial' : 'metric';
            resultText = _convertTemp(resultText, system);
            return _smartConvert(resultText, system);
        }

            const emblemIds = ['', 'pot', 'whisk', 'leaf', 'spoon', 'carrot', 'egg', 'wheat', 'apple'];

            nextCover.spineLabel = normalizedSpineLabel === 'Uculi' ? '' : normalizedSpineLabel;
            nextCover.emblem = emblemIds.includes(cover?.emblem) ? cover.emblem : '';
            nextCover.emblemColor = emblemColors.includes(cover?.emblemColor) ? cover.emblemColor : 'default';
            nextCover.emblemWeight = emblemWeights.includes(cover?.emblemWeight) ? cover.emblemWeight : 'normal';

        function getNotebookCoverStickerPalette(color) {
            const palettes = {

                blue: { bg: '#83b7da', text: '#21475e' },
                coral: { bg: '#ef9b82', text: '#5d2f24' },
                sage: { bg: '#95be96', text: '#29432d' },
                lilac: { bg: '#d9beea', text: '#4b3555' },

        function getNotebookCoverStickerCoordinates(position) {
            const positions = {

                'top-right': { x: 80, y: 20 },
                'center': { x: 50, y: 48 },
                'center-right': { x: 78, y: 50 },

        function getNotebookCoverStickerSize(size, isEmojiOnly = false, isTransparent = false) {
            if (isEmojiOnly) {
                if (isTransparent) {
                    const floatingEmojiSizes = {

                        lg: 'h-20 w-20 text-5xl'

                    md: 'h-14 w-14 text-3xl',
                    lg: 'h-16 w-16 text-4xl'

                return emojiSizes[size] || emojiSizes.md;

                md: 'min-w-[6.5rem] px-4 py-2.5 text-[11px]',

        }

        function getDefaultNotebookStickyNote(seed = 0, side = 'right') {
            const normalizedSide = side === 'left' ? 'left' : 'right';
            const preset = { side: normalizedSide, x: 76, y: 24, rotation: -4, color: 'butter', size: 'md' };

            return {
                id: `notebook-note-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                text: '',
                color: preset.color,
                size: preset.size,
                scale: 1,
                rotation: preset.rotation,
                side: preset.side,

        function normalizeNotebookStickyNoteSide(value, fallback = 'right') {
            const side = String(value || '').toLowerCase();
            if (side === 'left' || side === 'right') return side;

        }

        function clampNotebookStickyNoteX(value) {
            return Math.max(12, Math.min(88, Number(value)));

        function getNotebookStickyNotePreviewLimit(note) {

        function getNotebookStickyNotePreviewMarkup(note) {
            const rawText = String(note?.text ?? '').trim();
            const seedSource = `${note?.id || ''}${rawText || 'preview'}`;

            const buildPseudoWord = (wordSeed, isSignature = false) => {

                            : isSignature

        function fitCoverTextToBox(el) {
            if (!(el instanceof HTMLElement)) return;
            const copy = el.closest('.cover-face-copy');
            const limit = copy?.clientWidth || el.clientWidth;
            if (limit < 20) return;
            el.style.fontSize = '';
            el.style.whiteSpace = 'nowrap';
            el.style.overflowWrap = 'normal';
            const computed = parseFloat(getComputedStyle(el).fontSize) || 16;
            const inPreview = Boolean(el.closest('#cover-editor-preview-surface'));
            const min = inPreview ? 13 : 18;
            let size = computed;
            let guard = 0;
            while (el.scrollWidth > limit + 1 && size > min && guard < 80) {
                size = Math.max(min, size - 1);
                el.style.fontSize = `${size}px`;
                guard += 1;
            }
            el.style.whiteSpace = 'normal';
            el.style.overflowWrap = 'break-word';
            if (el.scrollWidth > limit + 1) {
                el.style.overflowWrap = 'anywhere';
            }
        }

        function fitCoverPlate(plate) {
            if (!(plate instanceof HTMLElement)) return;
            const limit = plate.parentElement?.clientWidth || plate.clientWidth;
            if (limit < 20) return;
            plate.style.fontSize = '';
            plate.style.letterSpacing = '';
            plate.style.maxWidth = '100%';
            plate.style.whiteSpace = 'nowrap';
            plate.style.overflowWrap = 'normal';
            const computed = parseFloat(getComputedStyle(plate).fontSize) || 10;
            let size = computed;
            let guard = 0;
            while (plate.scrollWidth > limit + 1 && size > 8 && guard < 30) {
                size = Math.max(8, size - 0.5);
                plate.style.fontSize = `${size}px`;
                guard += 1;
            }
            if (plate.scrollWidth > limit + 1) {
                plate.style.letterSpacing = '0.06em';
            }
            plate.style.whiteSpace = 'normal';
            plate.style.overflowWrap = plate.scrollWidth > limit + 1 ? 'anywhere' : 'break-word';
        }

        function fitNotebookCoverText(root) {
            const scope = root && typeof root.querySelectorAll === 'function' ? root : document;
            scope.querySelectorAll('.cover-face-copy').forEach(copy => {
                if (!(copy instanceof HTMLElement) || !copy.isConnected) return;
                fitCoverTextToBox(copy.querySelector('.cover-face-title'));
                fitCoverTextToBox(copy.querySelector(':scope > p'));
                fitCoverPlate(copy.querySelector('.notebook-cover-plate'));
            });
        }

        function scheduleNotebookCoverTextFit(root) {
            const scope = root || document;
            const run = () => fitNotebookCoverText(scope);
            run();
            requestAnimationFrame(() => {
                run();
                const families = new Set();
                scope.querySelectorAll?.('.cover-face-copy')?.forEach(copy => {
                    const family = getComputedStyle(copy).fontFamily.split(',')[0].replaceAll('"', '').trim();
                    if (family) families.add(family);
                });
                const loads = [...families].map(family => document.fonts?.load?.(`700 16px "${family}"`)?.catch(() => undefined));
                Promise.all(loads).then(() => requestAnimationFrame(run));
            });
        }

            const modal = document.getElementById('cover-editor-modal');
            if (!modal) return;
            renderCoverEditor();
            modal.classList.remove('hidden', 'opacity-0');
            modal.firstElementChild?.classList.remove('scale-95');

            const modal = document.getElementById('cover-editor-modal');

            preview.innerHTML = renderNotebookCoverFace(draftNotebookCover, previewRecipe, totalPages, true);

            if (!draftNotebookCover) return;

            draftNotebookCover = normalizeNotebookCover(draftNotebookCover);
            const readout = document.querySelector(`[data-cover-readout="${field}"]`);

            if (!draftNotebookCover?.stickers?.[index]) return;
            draftNotebookCover.stickers[index][field] = field === 'rotation' ? Number(value) : value;

        }

        function updateDraftCoverStickerPosition(index, x, y) {
            if (!draftNotebookCover?.stickers?.[index]) return;
            draftNotebookCover.stickers[index].x = Math.max(8, Math.min(92, Number(x)));
            draftNotebookCover.stickers[index].y = Math.max(10, Math.min(90, Number(y)));
        }

        function attachCoverEditorInteractions() {
            const previewSurface = document.getElementById('cover-editor-preview-surface');
            if (!previewSurface) return;

            previewSurface.querySelectorAll('[data-cover-sticker-index]').forEach(stickerEl => {
                stickerEl.addEventListener('pointerdown', event => {
                    if (event.pointerType === 'mouse' && event.button !== 0) return;

                    event.preventDefault();
                    const stickerIndex = Number(stickerEl.dataset.coverStickerIndex);
                    const rect = previewSurface.getBoundingClientRect();

                    const moveSticker = moveEvent => {
                        const relativeX = ((moveEvent.clientX - rect.left) / rect.width) * 100;
                        const relativeY = ((moveEvent.clientY - rect.top) / rect.height) * 100;
                        updateDraftCoverStickerPosition(stickerIndex, relativeX, relativeY);
                        stickerEl.style.left = `${Math.max(8, Math.min(92, relativeX))}%`;
                        stickerEl.style.top = `${Math.max(10, Math.min(90, relativeY))}%`;
                    };

                    const stopDragging = () => {
                        window.removeEventListener('pointermove', moveSticker);
                        window.removeEventListener('pointerup', stopDragging);
                        window.removeEventListener('pointercancel', stopDragging);
                    };

                    window.addEventListener('pointermove', moveSticker);
                    window.addEventListener('pointerup', stopDragging);
                    window.addEventListener('pointercancel', stopDragging);
                    stickerEl.setPointerCapture?.(event.pointerId);
                });
            });
        }

                                                <p class="mt-1 text-[10px] font-bold uppercase tracking-[0.18em] text-sage">${Number(sticker.rotation) || 0}°</p>
                                            </div>
                                        </div>
                                    </div>
                                `).join('') : '<div class="rounded-xl border border-dashed border-parchmentDark p-4 text-sm font-semibold text-sage">No stickers yet. Add one to start decorating your cover.</div>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            lucide.createIcons();
            attachCoverEditorInteractions();
            scheduleNotebookCoverTextFit(document.getElementById('cover-editor-body'));
        }

        function focusNotebookStickyNoteEditor(recipeId, noteIndex) {
            requestAnimationFrame(() => {
                const editor = document.querySelector(`[data-notebook-note-editor="${recipeId}-${noteIndex}"]`);
                if (!(editor instanceof HTMLTextAreaElement)) return;

                editor.focus({ preventScroll: true });
                const textLength = editor.value.length;
                editor.setSelectionRange(textLength, textLength);
            });
        }

        function openNotebookStickyNotesEditor(recipeId) { if(!hasPremiumAccess()) { showPremiumModal("use sticky notes"); return; }
            const recipe = recipes.find(item => item.id === recipeId);
            if (!recipe) return;

            const normalizedNotes = normalizeNotebookStickyNotes(recipe.notebookStickyNotes);
            const hadOverflowNotes = Array.isArray(recipe.notebookStickyNotes) && recipe.notebookStickyNotes.length !== normalizedNotes.length;
            recipe.notebookStickyNotes = normalizedNotes;

            let shouldSave = false;
            let createdNote = false;
            if (hadOverflowNotes) {
                shouldSave = true;
            }

            if (!recipe.notebookStickyNotes.length) {
                recipe.notebookStickyNotes = [getDefaultNotebookStickyNote(0, window.innerWidth < 768 ? notebookMobileSide : 'right')];
                shouldSave = true;
                createdNote = true;
            }

            if (userSettings.showNotebookStickyNotes === false) {
                userSettings.showNotebookStickyNotes = true;
                shouldSave = true;
            }

            if (shouldSave) {
                saveData();
            }

            openNotebookStickyNoteMenu(recipeId, 0);

            if (createdNote) {
                showToast('Sticky note added. Click it to enlarge and edit.', 'sticky-note');
            }
        }

        function loadData() {
            resetAuthenticatedUserState();
            loadModerationLogCache();

            const savedAdminConfig = localStorage.getItem(adminConfigStorageKey);
            adminConfig = normalizeAdminConfig(savedAdminConfig ? JSON.parse(savedAdminConfig) : getDefaultAdminConfig());

            if (!currentUser?.uid) {
                applyUserModeClasses();
                document.documentElement.style.colorScheme = 'light';
                return;
            }

            ensureInitialAdminBootstrap();
            loadAdminConfigFromCloud();
            loadCurrentUserModerationStatusFromCloud();

            const savedSettings = localStorage.getItem(getScopedStorageKey(legacyRecipeSettingsStorageKey));
            let shouldResaveSettings = false;

            if (savedSettings) {
                const parsedSettings = JSON.parse(savedSettings);
                userSettings = { ...userSettings, ...parsedSettings };
            } else {
                userSettings.language = getRequestedUiLanguage()
                    || resolveSupportedLanguage(localStorage.getItem(globalUiLanguageStorageKey))
                    || detectPreferredSupportedLanguage();
                localStorage.setItem(globalUiLanguageStorageKey, userSettings.language);
                shouldResaveSettings = true;
            }

            if (Object.prototype.hasOwnProperty.call(userSettings, 'themeMode')) {
                delete userSettings.themeMode;
                shouldResaveSettings = true;
            }

            if (Object.prototype.hasOwnProperty.call(userSettings, 'simpleMode')) {
                delete userSettings.simpleMode;
                shouldResaveSettings = true;
            }

            if (Object.prototype.hasOwnProperty.call(userSettings, 'hasCompletedOnboarding')) {
                delete userSettings.hasCompletedOnboarding;
                shouldResaveSettings = true;
            }

            userSettings.autoPublish = userSettings.autoPublish === true;

            syncBillingStateWithPremiumFlag();
            userSettings.notebookCover = normalizeNotebookCover(userSettings.notebookCover);
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            userSettings.notifications = normalizeFamilyNotifications(userSettings.notifications);
            userSettings.recipeUndo = normalizeRecipeUndoEntry(userSettings.recipeUndo);
            userSettings.hasCompletedTutorial = userSettings.hasCompletedTutorial === true;
            document.getElementById('body')?.classList.remove('theme-dark');
            applyUserModeClasses();
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.lang = userSettings.language || 'en';
            indexViewMode = ['cards', 'list', 'book'].includes(userSettings.indexViewMode) ? userSettings.indexViewMode : 'cards';
            if (!hasPremiumAccess() && indexViewMode === 'book') {
                indexViewMode = 'cards';
                userSettings.indexViewMode = 'cards';
                shouldResaveSettings = true;
            }

            if (!resolveSupportedLanguage(userSettings.language)) {
                userSettings.language = getRequestedUiLanguage()
                    || resolveSupportedLanguage(localStorage.getItem(globalUiLanguageStorageKey))
                    || detectPreferredSupportedLanguage();
                localStorage.setItem(globalUiLanguageStorageKey, userSettings.language);
                shouldResaveSettings = true;
            }

            const savedRecipes = localStorage.getItem(getScopedStorageKey(legacyRecipeDataStorageKey));
            if (savedRecipes) {
                recipes = JSON.parse(savedRecipes).map(recipe => ({
                    ...recipe,
                    versionHistory: Array.isArray(recipe.versionHistory) ? recipe.versionHistory.slice(0, 5) : [],
                    notebookStickyNotes: normalizeNotebookStickyNotes(recipe.notebookStickyNotes)
                }));
            } else {
                recipes = [createDefaultStarterRecipe()];
                saveData();
                shouldResaveSettings = false;
            }

            const savedFamilies = localStorage.getItem(getScopedStorageKey(legacyRecipeFamiliesStorageKey));
            userFamilies = savedFamilies ? JSON.parse(savedFamilies).map(normalizeFamilyRecord) : [];

            if (shouldResaveSettings) {
                saveData();
            }

            maybeRunAutomaticDuplicateCleanup();
        }

        function saveData() {
            if (!currentUser?.uid) return;
            applyUserModeClasses();
            localStorage.setItem(getScopedStorageKey(legacyRecipeSettingsStorageKey), JSON.stringify(userSettings));
            localStorage.setItem(getScopedStorageKey(legacyRecipeDataStorageKey), JSON.stringify(recipes));
            localStorage.setItem(getScopedStorageKey(legacyRecipeFamiliesStorageKey), JSON.stringify((userFamilies || []).map(normalizeFamilyRecord)));

            if (!isDeveloperBypassSession() && firebaseInitialized && isAuthenticated && currentUser) {
                if (pendingCloudSyncTimer) {
                    clearTimeout(pendingCloudSyncTimer);
                }
                pendingCloudSyncTimer = setTimeout(() => {
                    pendingCloudSyncTimer = null;
                    syncToFirestore();
                }, 450);
            }
        }

        function normalizeShoppingListLabel(value = '') {
            return String(value || '').replace(/\s+/g, ' ').trim();
        }

        function normalizeShoppingListCollaborator(collaborator, index = 0) {
            const name = normalizeShoppingListLabel(typeof collaborator === 'string' ? collaborator : collaborator?.name);
            if (!name) return null;

            const fallbackSlug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || `partner-${index + 1}`;
            return {
                id: typeof collaborator === 'object' && collaborator?.id ? collaborator.id : `shopping-collab-${fallbackSlug}`,
                name
            };
        }

        function normalizeShoppingListItem(item, index = 0) {
            const label = normalizeShoppingListLabel(item?.label || item?.name);
            if (!label) return null;

            const normalizedSourceRecipeIds = Array.from(new Set((item?.sourceRecipeIds || []).map(value => Number(value)).filter(Number.isFinite)));
            const normalizedSourceRecipeTitles = Array.from(new Set((item?.sourceRecipeTitles || []).map(value => normalizeShoppingListLabel(value)).filter(Boolean)));
            const createdAt = item?.createdAt || new Date().toISOString();

            return {
                id: item?.id || `shopping-item-${Date.now()}-${index}-${Math.random().toString(36).slice(2, 8)}`,
                label,
                note: normalizeShoppingListLabel(item?.note),
                checked: Boolean(item?.checked),
                kind: item?.kind === 'custom' ? 'custom' : 'recipe',
                sourceRecipeIds: normalizedSourceRecipeIds,
                sourceRecipeTitles: normalizedSourceRecipeTitles,
                occurrences: Math.max(1, Number(item?.occurrences) || Math.max(1, normalizedSourceRecipeIds.length, normalizedSourceRecipeTitles.length)),
                assignedTo: normalizeShoppingListLabel(item?.assignedTo),
                createdAt,
                updatedAt: item?.updatedAt || createdAt
            };
        }

        function normalizeShoppingListState(list = {}) {
            const now = new Date();
            return {
                ...getDefaultShoppingList(),
                ...(list || {}),
                items: (list?.items || []).map((item, index) => normalizeShoppingListItem(item, index)).filter(item => {
                    if (item && item.checked && item.updatedAt) {
                        const updatedTime = new Date(item.updatedAt);
                        const diffHours = (now - updatedTime) / (1000 * 60 * 60);
                        if (diffHours >= 24) return false;
                    }
                    return Boolean(item);
                }),
                collaborators: (list?.collaborators || []).map((item, index) => normalizeShoppingListCollaborator(item, index)).filter(Boolean)
            };
        }

        function persistShoppingListState({ rerender = true } = {}) {
            userSettings.shoppingList = normalizeShoppingListState({
                ...userSettings.shoppingList,
                lastUpdatedAt: new Date().toISOString()
            });
            saveData();
            if (rerender && currentView === 'shopping') {
                renderShoppingList();
            }
        }

        function getShoppingListItemByLabel(label) {
            const normalizedLabel = normalizeShoppingListLabel(label).toLowerCase();
            return userSettings.shoppingList.items.find(item => item.label.toLowerCase() === normalizedLabel) || null;
        }

        function toggleRecipeIngredientsInShoppingList(recipeId, openView = false) {
            const recipe = recipes.find(entry => entry.id === recipeId);
            if (!recipe) return;

            const recipeIngredients = (recipe.ingredients || [])
                .map(ingredient => normalizeShoppingListLabel(applyMeasurementSystem(ingredient)))
                .filter(Boolean);

            if (recipeIngredients.length === 0) {
                showToast('No ingredients available.', 'alert-circle');
                return;
            }

            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            
            const hasIngredients = userSettings.shoppingList.items.some(item => 
                !item.checked && (item.sourceRecipeIds || []).includes(recipe.id)
            );

            if (hasIngredients) {
                let removedCount = 0;
                userSettings.shoppingList.items = userSettings.shoppingList.items.filter(item => {
                    if ((item.sourceRecipeIds || []).includes(recipe.id)) {
                        if (item.sourceRecipeIds.length <= 1) {
                            removedCount++;
                            return false;
                        }
                        item.sourceRecipeIds = item.sourceRecipeIds.filter(id => id !== recipe.id);
                        item.sourceRecipeTitles = item.sourceRecipeTitles.filter(title => title !== recipe.title);
                        item.occurrences = Math.max(1, item.sourceRecipeTitles.length);
                        item.updatedAt = new Date().toISOString();
                    }
                    return true;
                });
                persistShoppingListState({ rerender: false });
                showToast(`Removed from shopping list.`, 'shopping-basket');
            } else {
                let addedCount = 0;
                let reopenedCount = 0;
                recipeIngredients.forEach(label => {
                    const existingItem = getShoppingListItemByLabel(label);
                    if (existingItem) {
                        if (existingItem.checked) {
                            existingItem.checked = false;
                            reopenedCount += 1;
                        }
                        existingItem.sourceRecipeIds = Array.from(new Set([...(existingItem.sourceRecipeIds || []), recipe.id]));
                        existingItem.sourceRecipeTitles = Array.from(new Set([...(existingItem.sourceRecipeTitles || []), recipe.title]));
                        existingItem.occurrences = Math.max(1, existingItem.sourceRecipeTitles.length || existingItem.occurrences || 1);
                        existingItem.updatedAt = new Date().toISOString();
                        return;
                    }

                    userSettings.shoppingList.items.push(normalizeShoppingListItem({
                        label,
                        kind: 'recipe',
                        checked: false,
                        sourceRecipeIds: [recipe.id],
                        sourceRecipeTitles: [recipe.title],
                        occurrences: 1,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    }, userSettings.shoppingList.items.length));
                    addedCount += 1;
                });
                
                persistShoppingListState({ rerender: false });
                showToast(`Added to shopping list.`, 'shopping-basket');
                
                if (openView) {
                    renderShoppingList();
                    return;
                }
            }
        }

        function addCustomShoppingListItem() {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);

            const nameInput = document.getElementById('shopping-list-custom-name');
            const noteInput = document.getElementById('shopping-list-custom-note');
            if (!(nameInput instanceof HTMLInputElement) || !(noteInput instanceof HTMLInputElement)) return;

            const label = normalizeShoppingListLabel(nameInput.value);
            const note = normalizeShoppingListLabel(noteInput.value);
            if (!label) {
                showToast('Enter an ingredient or item first.', 'alert-circle');
                nameInput.focus();
                return;
            }

            const existingItem = getShoppingListItemByLabel(label);
            if (existingItem) {
                existingItem.checked = false;
                existingItem.note = note || existingItem.note;
                existingItem.updatedAt = new Date().toISOString();
                persistShoppingListState({ rerender: true });
                nameInput.value = '';
                noteInput.value = '';
                nameInput.focus();
                showToast('Existing shopping item reopened.', 'rotate-ccw');
                return;
            }

            userSettings.shoppingList.items.unshift(normalizeShoppingListItem({
                label,
                note,
                kind: 'custom',
                checked: false,
                sourceRecipeIds: [],
                sourceRecipeTitles: [],
                occurrences: 1,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            }, userSettings.shoppingList.items.length));

            persistShoppingListState({ rerender: true });
            nameInput.value = '';
            noteInput.value = '';
            nameInput.focus();
            showToast('Custom item added to your shopping list.', 'plus');
        }

        function toggleShoppingListItemChecked(itemId) {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const item = userSettings.shoppingList.items.find(entry => entry.id === itemId);
            if (!item) return;

            item.checked = !item.checked;
            item.updatedAt = new Date().toISOString();
            persistShoppingListState({ rerender: true });
        }

        function removeShoppingListItem(itemId) {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const nextItems = userSettings.shoppingList.items.filter(entry => entry.id !== itemId);
            if (nextItems.length === userSettings.shoppingList.items.length) return;

            userSettings.shoppingList.items = nextItems;
            persistShoppingListState({ rerender: true });
            showToast('Shopping item removed.', 'trash-2');
        }

        function clearCheckedShoppingListItems() {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const checkedCount = userSettings.shoppingList.items.filter(item => item.checked).length;
            if (checkedCount === 0) {
                showToast('No checked items to clear.', 'info');
                return;
            }

            userSettings.shoppingList.items = userSettings.shoppingList.items.filter(item => !item.checked);
            persistShoppingListState({ rerender: true });
            showToast(`${checkedCount} checked item${checkedCount === 1 ? '' : 's'} cleared.`, 'rotate-ccw');
        }

        const shoppingListSelfName = 'You';

        function submitShoppingListCollaborator(inputId, modalId) {
            const input = document.getElementById(inputId);
            if (!(input instanceof HTMLInputElement)) return;

            const name = normalizeShoppingListLabel(input.value);
            if (!name) {
                showToast('Enter a partner name first.', 'alert-circle');
                input.focus();
                return;
            }

            if (name.toLowerCase() === shoppingListSelfName.toLowerCase()) {
                showToast('That is you, the person using this device.', 'info');
                input.focus();
                input.select();
                return;
            }

            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const exists = userSettings.shoppingList.collaborators.some(collaborator => collaborator.name.toLowerCase() === name.toLowerCase());
            if (exists) {
                showToast('That partner is already on this list.', 'info');
                input.focus();
                input.select();
                return;
            }

            userSettings.shoppingList.collaborators.push(normalizeShoppingListCollaborator({ name }, userSettings.shoppingList.collaborators.length));
            persistShoppingListState({ rerender: true });
            closeModal(modalId);
            showToast('Shopping partner added.', 'users');
        }

        function showShoppingListCollaboratorModal() {
            const inputId = `shopping-collaborator-input-${Date.now()}`;
            let modalId = null;

            modalId = createModal('Add partner', `
                <div class="space-y-4 text-inkDark">
                    <p class="text-sm font-semibold leading-relaxed text-forest">Type a name. It stays on this device only.</p>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-[0.22em] text-sage mb-2" for="${inputId}">Name</label>
                        <input id="${inputId}" type="text" class="${inputClass}" placeholder="e.g. Anna" autocomplete="off" />
                    </div>
                </div>
            `, [
                { text: 'Cancel', onClick: () => closeModal(modalId) },
                { text: 'Add partner', primary: true, onClick: () => submitShoppingListCollaborator(inputId, modalId) }
            ]);

            requestAnimationFrame(() => {
                const input = document.getElementById(inputId);
                if (input instanceof HTMLInputElement) {
                    input.focus();
                    input.select();
                }
            });
        }

        function removeShoppingListCollaborator(collaboratorId) {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const collaborator = userSettings.shoppingList.collaborators.find(entry => entry.id === collaboratorId);
            if (!collaborator) return;

            userSettings.shoppingList.collaborators = userSettings.shoppingList.collaborators.filter(entry => entry.id !== collaboratorId);
            userSettings.shoppingList.items = userSettings.shoppingList.items.map(item => (
                item.assignedTo === collaborator.name
                    ? { ...item, assignedTo: '', updatedAt: new Date().toISOString() }
                    : item
            ));
            persistShoppingListState({ rerender: true });
            showToast('Partner removed from the shopping list.', 'user-minus');
        }

        function assignShoppingListItem(itemId, assignedTo) {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const item = userSettings.shoppingList.items.find(entry => entry.id === itemId);
            if (!item) return;

            item.assignedTo = normalizeShoppingListLabel(decodeURIComponent(String(assignedTo || '').replace(/\+/g, ' ')));
            item.updatedAt = new Date().toISOString();
            persistShoppingListState({ rerender: true });
        }

        function shoppingListAssigneeMark(name, names) {
            const compact = String(name || '').replace(/\s+/g, '');
            if (!compact) return '?';
            const lower = compact.toLowerCase();
            const others = names
                .filter(entry => entry !== name)
                .map(entry => String(entry || '').replace(/\s+/g, '').toLowerCase());
            let length = 1;
            while (length < compact.length && others.some(other => other.slice(0, length) === lower.slice(0, length))) {
                length += 1;
            }
            const mark = compact.slice(0, length);
            return mark.charAt(0).toUpperCase() + mark.slice(1);
        }

        function shoppingListAssigneeGroups(items, collaborators) {
            const you = [];
            const buckets = (collaborators || []).map(collaborator => ({ name: collaborator.name, items: [] }));
            const open = [];
            items.forEach(item => {
                const assignedTo = normalizeShoppingListLabel(item.assignedTo);
                if (!assignedTo) {
                    open.push(item);
                    return;
                }
                if (assignedTo.toLowerCase() === shoppingListSelfName.toLowerCase()) {
                    you.push(item);
                    return;
                }
                const bucket = buckets.find(entry => entry.name.toLowerCase() === assignedTo.toLowerCase());
                if (bucket) bucket.items.push(item);
                else open.push(item);
            });
            const groups = [];
            if (you.length) groups.push({ title: shoppingListSelfName, items: you });
            buckets.forEach(bucket => {
                if (bucket.items.length) groups.push({ title: bucket.name, items: bucket.items });
            });
            if (open.length) groups.push({ title: 'Not assigned', items: open });
            return groups;
        }

        function shareShoppingListSnapshot() {
            const shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const pendingItems = shoppingList.items.filter(item => !item.checked);
            const completedCount = shoppingList.items.filter(item => item.checked).length;
            const groups = shoppingListAssigneeGroups(pendingItems, shoppingList.collaborators);
            const pendingBody = groups.length > 0
                ? groups.map(group => `${group.title}\n${group.items.map(item => `- ${item.label}`).join('\n')}`).join('\n\n')
                : 'Nothing left to pick up.';
            const shareText = `Uculi shopping list\n\n${pendingBody}\n\nCompleted: ${completedCount}`;

            if (navigator.share) {
                navigator.share({
                    title: 'Uculi shopping list',
                    text: shareText
                }).catch(() => copyToClipboard(shareText));
                return;
            }

            copyToClipboard(shareText);
        }

        function renderShoppingListItem(item) {
            const shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const itemMetaBadges = [
                `<span class="inline-flex items-center rounded-full border border-parchmentDark bg-white px-2 py-0.5 text-[9px] font-bold uppercase tracking-[0.16em] text-sage shadow-sm">${item.kind === 'custom' ? 'Custom' : 'Recipe'}</span>`,
                ...(item.sourceRecipeTitles || []).slice(0, 2).map(title => `<span class="inline-flex items-center rounded-full border border-gold border-opacity-30 bg-gold bg-opacity-10 px-2 py-0.5 text-[9px] font-bold uppercase tracking-[0.16em] text-forest">${escapeHTML(title)}</span>`),
                ((item.sourceRecipeTitles || []).length > 2) ? `<span class="inline-flex items-center rounded-full border border-parchmentDark bg-parchment px-2 py-0.5 text-[9px] font-bold uppercase tracking-[0.16em] text-sage">+${item.sourceRecipeTitles.length - 2} more</span>` : ''
            ].join('');

            const assigneeNames = [shoppingListSelfName, ...shoppingList.collaborators.map(collaborator => collaborator.name)];
            const assignees = assigneeNames.map(name => ({
                value: name,
                label: shoppingListAssigneeMark(name, assigneeNames)
            }));

            const assigneesHtml = assignees.map(assignee => `
                <button type="button" onclick="assignShoppingListItem('${item.id}', '${item.assignedTo === assignee.value ? '' : encodeURIComponent(assignee.value)}')"
                    class="inline-flex h-8 min-w-8 shrink-0 items-center justify-center rounded-full px-1.5 text-[11px] font-bold leading-none transition-all ${item.assignedTo === assignee.value ? 'bg-forest text-white shadow-sm ring-2 ring-forest/20' : 'bg-parchment text-sage border border-parchmentDark hover:border-gold hover:text-forest'}"
                    title="Assign to ${escapeHTML(assignee.value)}" aria-label="Assign to ${escapeHTML(assignee.value)}">
                    ${escapeHTML(assignee.label)}
                </button>
            `).join('');

            return `
                <article class="shop-line rounded-xl border border-parchmentDark bg-white p-3 shadow-sm transition-all ${item.checked ? 'opacity-70' : ''}">
                    <div class="shop-line-row flex items-center gap-3">
                        <button type="button" onclick="toggleShoppingListItemChecked('${item.id}')" class="${getAppButtonClasses(item.checked ? 'accent' : 'secondary', { iconOnly: true, size: 'sm' })} flex-shrink-0" title="${item.checked ? 'Reopen item' : 'Mark item done'}" aria-label="${item.checked ? 'Reopen item' : 'Mark item done'}">
                            <i data-lucide="${item.checked ? 'check-check' : 'circle'}" class="h-4 w-4"></i>
                        </button>

                        <div class="shop-line-copy min-w-0 flex-1 flex flex-col justify-center">
                            <p class="shop-line-name text-sm font-bold text-forest truncate ${item.checked ? 'line-through' : ''}">${escapeHTML(item.label)}</p>
                            ${(itemMetaBadges || item.note) ? `
                                <div class="shop-line-meta mt-1 flex flex-wrap items-center gap-2">
                                    ${itemMetaBadges}
                                    ${item.note ? `<span class="text-[10px] font-semibold text-sage truncate max-w-[120px]">- ${escapeHTML(item.note)}</span>` : ''}
                                </div>
                            ` : ''}
                        </div>

                        <div class="shop-line-actions flex items-center gap-2 pl-2 border-l border-parchmentDark">
                            ${assignees.length > 0 ? `<div class="shop-line-assignees flex max-w-[9.5rem] flex-wrap items-center justify-end gap-1.5">${assigneesHtml}</div>` : ''}
                            <button type="button" onclick="removeShoppingListItem('${item.id}')" class="shop-line-remove flex h-11 w-11 items-center justify-center rounded-xl text-sage hover:bg-coral hover:text-white transition-colors" title="Remove" aria-label="Remove">
                                <i data-lucide="trash-2" class="h-4 w-4"></i>
                            </button>
                        </div>
                    </div>
                </article>
            `;
        }

        function loadLaunchDiagnostics() {

                launchDiagnostics = {
                    analytics: { ...defaultLaunchAnalytics, ...(parsedDiagnostics.analytics || {}) },
                    errors: Array.isArray(parsedDiagnostics.errors) ? parsedDiagnostics.errors.slice(0, 12) : []
                };

                launchDiagnostics = {
                    analytics: { ...defaultLaunchAnalytics },
                    errors: []
                };
            }

            if (!Object.prototype.hasOwnProperty.call(defaultLaunchAnalytics, eventKey)) return;

            saveLaunchDiagnostics();

        async function applyAccountModeration({
            targetUserId,
            targetEmail,
            reason,
            sanctionType,
            durationUnit,
            durationValue,
            offlineProfileNow
        } = {}) {
            if (!firebaseInitialized || !isAuthenticated || !currentUser || !isCurrentUserAdmin()) return false;

            const sanitizedTargetUserId = String(targetUserId || '').trim();
            const sanitizedTargetEmail = normalizeAdminEmail(targetEmail || '');
            const sanitizedReason = sanitizeModerationReason(reason || 'No reason provided.');
            const normalizedSanctionType = String(sanctionType || 'timeout').toLowerCase();
            const isPermanent = durationUnit === 'permanent';
            const expiresAt = getDurationExpirationIso(durationUnit, durationValue, isPermanent);
            const durationLabel = getDurationLabel(durationUnit, durationValue, isPermanent);
            const nowIso = new Date().toISOString();

            if (!sanitizedTargetUserId) {
                showToast('Provide the target user ID.', 'alert-circle', true);
                return false;
            }

            if (sanitizedReason.length < 4) {
                showToast('Please provide a short clear reason.', 'alert-circle', true);
                return false;
            }

            const moderationRef = firebase.firestore().collection('user-moderation').doc(sanitizedTargetUserId);
            const moderationSnap = await moderationRef.get();
            const previous = moderationSnap.exists
                ? normalizeModerationStatus({ ...moderationSnap.data(), uid: sanitizedTargetUserId })
                : getDefaultModerationStatus();

            const nextStrikeCount = (previous.strikeCount || 0) + 1;
            const nextBanCount = normalizedSanctionType === 'ban'
                ? (previous.banCount || 0) + 1
                : (previous.banCount || 0);
            const escalationToPermaban = nextBanCount >= 3;
            const nextState = escalationToPermaban ? 'permaban' : normalizedSanctionType;
            const shouldProfileOffline = escalationToPermaban || offlineProfileNow === true;
            const socialIsolation = escalationToPermaban;
            const familyReadOnly = escalationToPermaban;
            const publishBlocked = true;
            const reviewAt = escalationToPermaban ? getNextPermabanReviewIso() : (previous.permabanReviewAt || '');
            const messageBody = escalationToPermaban
                ? `Your account has been placed on permanent social restriction after repeated bans. Reason: ${sanitizedReason}. Admin review date: ${new Date(reviewAt).toLocaleDateString()}.`
                : `Admin moderation applied: ${nextState} for ${durationLabel}. Reason: ${sanitizedReason}.`;

            await moderationRef.set({
                uid: sanitizedTargetUserId,
                targetEmail: sanitizedTargetEmail,
                state: nextState,
                sanctionType: normalizedSanctionType,
                reason: sanitizedReason,
                startedAt: nowIso,
                expiresAt: escalationToPermaban ? '' : expiresAt,
                actorId: currentUser.uid || '',
                actorEmail: currentUser.email || '',
                strikeCount: nextStrikeCount,
                banCount: nextBanCount,
                publishBlocked,
                profileOffline: shouldProfileOffline,
                socialIsolation,
                familyReadOnly,
                permabanReviewAt: reviewAt,
                latestNotification: {
                    id: `moderation-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                    title: escalationToPermaban ? 'Permanent account restriction' : 'Account moderation update',
                    message: messageBody,
                    createdAt: nowIso
                },
                updatedAt: nowIso
            }, { merge: true });

            if (shouldProfileOffline) {
                await firebase.firestore().collection('users').doc(sanitizedTargetUserId).set({
                    isPublic: false,
                    displayName: '',
                    country: '',
                    bio: '',
                    updatedAt: new Date(),
                    moderationProfileClearedAt: new Date()
                }, { merge: true });
            }

            await logModerationAction('account-moderation-applied', {
                targetUserId: sanitizedTargetUserId,
                targetEmail: sanitizedTargetEmail,
                reason: sanitizedReason,
                details: {
                    sanctionType: normalizedSanctionType,
                    state: nextState,
                    durationLabel,
                    expiresAt: escalationToPermaban ? '' : expiresAt,
                    strikeCount: nextStrikeCount,
                    banCount: nextBanCount,
                    profileOffline: shouldProfileOffline,
                    socialIsolation,
                    familyReadOnly,
                    permabanReviewAt: reviewAt
                }
            });

            showToast(escalationToPermaban ? 'Permaban applied (3rd ban reached).' : 'Account moderation saved.', escalationToPermaban ? 'shield-x' : 'shield-check');
            return true;
        }
