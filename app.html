        function formatLocalAiAmount(value) {
            const rounded = Math.round((Number(value) + Number.EPSILON) * 100) / 100;
            if (Number.isNaN(rounded)) return '0';
            return Number.isInteger(rounded)
                ? String(rounded)
                : String(rounded).replace(/\.0+$/, '').replace(/(\.\d*?[1-9])0+$/, '$1');
        }

        function normalizeLocalAiQuantities(text = '') {
            let normalized = String(text)
                .replace(/¼/g, ' 1/4 ')
                .replace(/½/g, ' 1/2 ')
                .replace(/¾/g, ' 3/4 ');

            normalized = normalized.replace(/\b(\d+)\s+(\d+)\/(\d+)\b/g, (match, whole, numerator, denominator) => {
                const total = Number(whole) + (Number(numerator) / Number(denominator));
                return formatLocalAiAmount(total);
            });

            normalized = normalized.replace(/\b(\d+)\/(\d+)\b/g, (match, numerator, denominator) => {
                const total = Number(numerator) / Number(denominator);
                return formatLocalAiAmount(total);
            });

            localAiQuantityPhrasePatterns.forEach(({ pattern, replacement }) => {
                normalized = normalized.replace(pattern, replacement);
            });

            localAiNumberWordPatterns.forEach(({ pattern, replacement }) => {
                normalized = normalized.replace(pattern, replacement);
            });

            return normalized.replace(/\s+/g, ' ').trim();
        }

        function normalizeTextForLocalAI(text = '') {
            let normalized = String(text)
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/['’]/g, ' ')
                .replace(/[()]/g, ' ')
                .replace(/[|/]/g, ', ')
                .replace(/[•·]/g, ', ')
                .replace(/[–—]/g, ' ')
                .replace(/\s*&\s*/g, ' and ');

            normalized = normalizeLocalAiQuantities(normalized);

            localAiTranslationPatterns.forEach(({ pattern, replacement }) => {
                normalized = normalized.replace(pattern, replacement);
            });

            localAiUnitAliasPatterns.forEach(({ pattern, replacement }) => {
                normalized = normalized.replace(pattern, replacement);
            });

            return normalized.replace(/\s+/g, ' ').trim();
        }

        function splitLocalAiIngredientInput(input = '') {
            return normalizeTextForLocalAI(String(input).replace(/\r/g, ' '))
                .replace(/\b(?:and|with|plus)\b/g, ',')
                .split(/[\n,;]+/)
                .map(item => item.replace(/^\d+\.\s+/, '').trim())
                .filter(Boolean);
        }

        function titleCaseLocalAi(text = '') {
            return String(text)
                .split(/\s+/)
                .filter(Boolean)
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function humanizeLocalAiIngredient(ingredient = '') {
            const cleaned = normalizeTextForLocalAI(ingredient).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
            return titleCaseLocalAi(cleaned || 'Pantry Ingredient');
        }

        function pluralizeLocalAiUnit(unit = '', quantity = 1) {
            if (Math.abs(quantity - 1) < 0.001) return unit;
            if (unit === 'clove') return 'cloves';
            if (unit === 'head') return 'heads';
            if (unit === 'handful') return 'handfuls';
            if (unit === 'thumb') return 'thumbs';
            return unit;
        }

        function pluralizeLocalAiIngredientLabel(label = '', quantity = 1) {
            if (Math.abs(quantity - 1) < 0.001) return label;
            if (/Rice|Spinach|Garlic|Ginger|Flour|Sugar|Water|Milk|Cheese$/i.test(label) || /s$/i.test(label)) return label;
            if (/[^aeiou]y$/i.test(label)) return label.replace(/y$/i, 'ies');
            if (/(s|x|z|ch|sh)$/i.test(label)) return `${label}es`;
            return `${label}s`;
        }

        function isLocalAiLikelyLiquidIngredient(ingredient = '') {
            return /water|milk|stock|broth|juice|tea|coffee|cream|coconut milk|soup|smoothie|oil|vinegar|sauce/.test(ingredient);
        }

        function getLocalAiIngredientSubject(ingredient = '') {
            const parsedIngredient = parseLocalAiExplicitIngredient(ingredient);
            return (parsedIngredient?.ingredientName || String(ingredient || '')).trim();
        }

        function normalizeLocalAiMetricMeasure(quantity, unit = '', ingredientName = '') {
            let amount = Number(quantity) || 0;
            let normalizedUnit = String(unit || '').toLowerCase().replace(/\s+/g, ' ').trim();

            if (!normalizedUnit) {
                return {
                    quantity: amount,
                    unit: '',
                    ingredientName: getLocalAiIngredientSubject(ingredientName)
                };
            }

            if (normalizedUnit === 'tsp') {
                amount *= 5;
                normalizedUnit = 'ml';
            } else if (normalizedUnit === 'tbsp') {
                amount *= 15;
                normalizedUnit = 'ml';
            } else if (normalizedUnit === 'glass') {
                amount *= 250;
                normalizedUnit = 'ml';
            } else if (normalizedUnit === 'cup') {
                amount *= 240;
                normalizedUnit = 'ml';
            } else if (normalizedUnit === 'l' || normalizedUnit === 'fl oz') {
                amount *= normalizedUnit === 'l' ? 1000 : 29.5735;
                normalizedUnit = 'ml';
            } else if (normalizedUnit === 'lb' || normalizedUnit === 'oz' || normalizedUnit === 'kg') {
                amount *= normalizedUnit === 'lb' ? 453.592 : normalizedUnit === 'oz' ? 28.3495 : 1000;
                normalizedUnit = 'g';
            } else if (normalizedUnit === 'mg' && amount >= 1000) {
                amount /= 1000;
                normalizedUnit = 'g';
            }

            if (normalizedUnit === 'g' && amount >= 1000) {
                amount /= 1000;
                normalizedUnit = 'kg';
            } else if (normalizedUnit === 'g' && amount < 1) {
                amount *= 1000;
                normalizedUnit = 'mg';
            } else if (normalizedUnit === 'ml' && amount >= 1000) {
                amount /= 1000;
                normalizedUnit = 'l';
            }

            return {
                quantity: amount,
                unit: normalizedUnit,
                ingredientName: getLocalAiIngredientSubject(ingredientName)
            };
        }

        function parseLocalAiExplicitIngredient(normalizedIngredient = '') {
            const cleaned = String(normalizedIngredient)
                .replace(/^[-*]\s*/, '')
                .replace(/\bof\b/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            const match = cleaned.match(/^(\d+(?:\.\d+)?)\s*(mg|kg|g|ml|l|tsp|tbsp|cup|glass|fl\s*oz|oz|lb|clove|head|handful|thumb)?\s+(.+)$/i);
            if (!match) return null;
            return {
                quantity: parseFloat(match[1]),
                unit: (match[2] || '').toLowerCase().replace(/\s+/g, ' ').trim(),
                ingredientName: match[3].trim()
            };
        }

        function formatLocalAiExplicitIngredient(rawIngredient = '', normalizedIngredient = '') {
            const parsedIngredient = parseLocalAiExplicitIngredient(normalizedIngredient);
            if (!parsedIngredient) return /\d/.test(rawIngredient) ? rawIngredient.trim() : '';

            let { quantity, unit, ingredientName } = normalizeLocalAiMetricMeasure(parsedIngredient.quantity, parsedIngredient.unit, parsedIngredient.ingredientName);
            if (!ingredientName) return /\d/.test(rawIngredient) ? rawIngredient.trim() : '';

            const amountLabel = formatLocalAiAmount(quantity);
            const ingredientLabel = humanizeLocalAiIngredient(ingredientName);

            if (!unit) return `${amountLabel} ${pluralizeLocalAiIngredientLabel(ingredientLabel, quantity)}`.trim();
            if (/^(ml|g|kg)$/.test(unit)) return `${amountLabel}${unit} ${ingredientLabel}`.trim();

            const unitLabel = pluralizeLocalAiUnit(unit, quantity);
            const needsOf = /^(clove|cloves|head|heads|handful|handfuls|thumb|thumbs)$/.test(unitLabel);
            return `${amountLabel} ${unitLabel}${needsOf ? ' of' : ''} ${ingredientLabel}`.trim();
        }

        function shouldUseSavoryLocalAiDefaults(tags, normalizedIngredients = []) {
            const normalizedText = normalizedIngredients.join(' ');
            const singleIngredientSubject = normalizedIngredients.length === 1 ? getLocalAiIngredientSubject(normalizedIngredients[0]) : '';
            const isDrinkProfile = tags.category === 'Drink' || (normalizedIngredients.length === 1 && isLocalAiLikelyLiquidIngredient(singleIngredientSubject)) || /water|juice|tea|coffee|smoothie|shake|lemonade|cocktail/.test(normalizedText);
            const isSweetProfile = tags.category === 'Dessert' || tags.category === 'Baking' || /powdered sugar|sugar|honey|chocolate|icing|vanilla|jam|fruit|apple|banana|orange|berry|mango|pear|melon|pineapple|grape|peach|plum/.test(normalizedText);
            const isPantryBaseProfile = normalizedIngredients.length === 1 && /powdered sugar|sugar|flour|salt|pepper|paprika|cumin|turmeric|oregano|thyme|saffron|cocoa|vanilla|spice|seasoning/.test(singleIngredientSubject);
            return !isDrinkProfile && !isSweetProfile && !isPantryBaseProfile;
        }

        function pickLocalAiLeadIngredient(normalizedIngredients = []) {
            const priorities = [/chicken/, /beef/, /salmon|fish|shrimp|tuna/, /pork/, /turkey|lamb/, /tofu/, /lentil|chickpea|beans/, /mushroom/, /potato/, /rice/, /pasta|noodle/, /tomato/, /pepper/, /broccoli/, /spinach/];
            for (const pattern of priorities) {
                const match = normalizedIngredients.find(item => pattern.test(getLocalAiIngredientSubject(item)));
                if (match) return match;
            }
            return normalizedIngredients[0] || 'garden';
        }

        function pickLocalAiSupportingIngredient(normalizedIngredients = [], leadIngredient = '') {
            return normalizedIngredients.find(item => item !== leadIngredient && !/salt|pepper|olive oil|water|stock|broth|soy sauce|sesame oil|lemon juice|lime juice/.test(getLocalAiIngredientSubject(item))) || '';
        }

        function detectLocalAiCountry(cuisine = 'Homestyle') {
            const countries = {
                Italian: '🇮🇹 Italy',
                Asian: '🇯🇵 Japan',
                Thai: '🇹🇭 Thailand',
                Indian: '🇮🇳 India',
                Mexican: '🇲🇽 Mexico',
                Mediterranean: '🇬🇷 Greece',
                'Middle Eastern': '🇱🇧 Lebanon',
                French: '🇫🇷 France',
                American: '🇺🇸 United States',
                Homestyle: userSettings.country || '🌍 Home Kitchen'
            };
            return countries[cuisine] || countries.Homestyle;
        }

        function getLocalAiIngredientMeasure(ingredient = '') {
            if (/olive oil|soy sauce|sesame oil|lemon juice|lime juice/.test(ingredient)) return '1 tbsp';
            if (/salt|pepper/.test(ingredient)) return '';
            if (/garam masala|cumin|oregano|turmeric|paprika|thyme/.test(ingredient)) return '1 tsp';
            if (/chicken|beef|pork|fish|shrimp|turkey|lamb|tofu/.test(ingredient)) return '400g';
            if (/rice|pasta|noodle|beans|chickpea|lentil/.test(ingredient)) return '250g';
            if (/potato|tomato|pepper|carrot|onion|mushroom|zucchini|cucumber|corn|lemon|lime|apple|banana/.test(ingredient)) return '2';
            if (/broccoli|cauliflower/.test(ingredient)) return '1 head';
            if (/garlic|shallot/.test(ingredient)) return '2 cloves';
            if (/cheese/.test(ingredient)) return '100g';
            if (/water|milk|cream|stock|broth|coconut milk|yogurt/.test(ingredient)) return '250ml';
            if (/flour/.test(ingredient)) return '200g';
            if (/spinach|parsley|cilantro|basil/.test(ingredient)) return '1 handful';
            if (/ginger/.test(ingredient)) return '1 thumb';
            if (/powdered sugar|sugar|butter|honey/.test(ingredient)) return '2 tbsp';
            if (/tortilla/.test(ingredient)) return '4';
            return '1 cup';
        }

        function buildLocalAiTitle(leadIngredient, supportingIngredient, tags, normalizedIngredients = []) {
            const normalizedText = normalizedIngredients.join(' ');
            const leadSubject = getLocalAiIngredientSubject(leadIngredient);
            const supportSubject = supportingIngredient ? getLocalAiIngredientSubject(supportingIngredient) : '';
            const styleWord = {
                Italian: 'Rustic',
                Asian: 'Savory',
                Thai: 'Bright',
                Indian: 'Spiced',
                Mexican: 'Zesty',
                Mediterranean: 'Sunlit',
                'Middle Eastern': 'Golden',
                French: 'Silky',
                American: 'Hearty',
                Homestyle: 'Cozy'
            }[tags.cuisine] || 'Cozy';

            const leadLabel = humanizeLocalAiIngredient(leadSubject);
            const supportLabel = supportSubject ? humanizeLocalAiIngredient(supportSubject) : '';
            let dishWord = 'Skillet';

            if (normalizedIngredients.length === 1) {
                if (tags.category === 'Drink') return `${leadLabel} Refresher`.trim();
                if (tags.category === 'Dessert' || tags.category === 'Baking') return `${leadLabel} Treat`.trim();
                return `Simple ${leadLabel} Prep`.trim();
            }

            if (tags.category === 'Drink') dishWord = 'Refresher';
            else if (tags.category === 'Dessert') dishWord = 'Treat';
            else if (tags.category === 'Baking') dishWord = 'Bake';
            else if (/tortilla/.test(normalizedText)) dishWord = 'Tacos';
            else if (/pasta|noodle/.test(normalizedText)) dishWord = 'Pasta';
            else if (/rice|grain/.test(normalizedText)) dishWord = 'Bowl';
            else if (/broth|stock|soup/.test(normalizedText) || (tags.method === 'simmer' && /beans|lentil|chickpea|potato/.test(normalizedText))) dishWord = 'Stew';
            else if (/bread/.test(normalizedText) && /cheese|tomato|mushroom/.test(normalizedText)) dishWord = 'Toast';
            else if (tags.method === 'grill') dishWord = 'Grill';
            else if (tags.method === 'bake') dishWord = 'Bake';
            else if (/lettuce|spinach|cucumber|tomato/.test(normalizedText) && !/rice|pasta|potato/.test(normalizedText)) dishWord = 'Salad';

            return `${styleWord} ${leadLabel}${supportLabel ? ` and ${supportLabel}` : ''} ${dishWord}`.trim();
        }

        function buildSingleIngredientLocalAiInstructions(leadIngredient = '', tags = {}) {
            const leadSubject = getLocalAiIngredientSubject(leadIngredient);
            const leadLabel = humanizeLocalAiIngredient(leadSubject).toLowerCase();

            if (tags.category === 'Drink' || /water|milk|juice|tea|coffee/.test(leadSubject)) {
                return [
                    `Chill the ${leadLabel} well before serving.`,
                    /water/.test(leadSubject) ? 'Pour it into a glass with ice if you want it colder.' : `Pour the ${leadLabel} into a glass or bottle and shake or blend if needed.`,
                    'Add a garnish, citrus, or sweetener only if you want to build it out further.',
                    'Serve immediately while fresh and cold.'
                ];
            }

            if (/powdered sugar|sugar|flour|salt|pepper|paprika|cumin|turmeric|oregano|thyme/.test(leadSubject)) {
                return [
                    `Measure the ${leadLabel} into a small bowl or jar.`,
                    'Use it as a finishing ingredient, pantry base, or garnish rather than a complete dish on its own.',
                    'If you want a fuller recipe, add at least one liquid or main ingredient and run the generator again.',
                    'Store any extra in an airtight container.'
                ];
            }

            if (/apple|banana|orange|berry|mango|pineapple|pear|melon|grape|peach|plum/.test(leadSubject)) {
                return [
                    `Wash and prepare the ${leadLabel} as needed.`,
                    'Slice it and serve it fresh, or chill it for a colder snack.',
                    'Add a little citrus, yogurt, or nuts if you want to turn it into something more substantial.',
                    'Serve immediately for the best texture.'
                ];
            }

            if (/garlic|onion|shallot|ginger/.test(leadSubject)) {
                return [
                    `Peel and prepare the ${leadLabel} as needed.`,
                    `Roast, saute, or mince the ${leadLabel} gently until fragrant and tender.`,
                    'Use it as a flavorful base for toast, soup, pasta, rice, or grain bowls.',
                    'Finish with a little oil or salt if desired.'
                ];
            }

            if (/chicken|beef|pork|fish|shrimp|turkey|lamb|tofu/.test(leadSubject)) {
                return [
                    `Pat the ${leadLabel} dry and season it well.`,
                    `Cook the ${leadLabel} in a hot pan, oven, or grill until it is properly done.`,
                    'Rest briefly before slicing or serving.',
                    'Pair it with a sauce, herb, or side if you want a fuller meal.'
                ];
            }

            if (/potato|tomato|pepper|carrot|mushroom|broccoli|zucchini|cucumber|corn|spinach|cauliflower/.test(leadSubject)) {
                return [
                    `Wash and prepare the ${leadLabel} into even pieces.`,
                    /cucumber|tomato|spinach/.test(leadSubject) ? `Serve the ${leadLabel} raw, chilled, or lightly dressed for a quick simple plate.` : `Roast, steam, or saute the ${leadLabel} until tender and nicely cooked.`,
                    'Season to taste and add a small finishing touch like citrus, herbs, or oil if you want more flavor.',
                    'Serve warm or at room temperature.'
                ];
            }

            return [
                `Prepare the ${leadLabel} so it is ready to cook or serve.`,
                `Cook, chill, or plate the ${leadLabel} in the simplest way that suits it best.`,
                'Add one sauce, spice, or side ingredient if you want a fuller result.',
                'Serve while the texture is at its best.'
            ];
        }

        function getSingleIngredientLocalAiTip(leadIngredient = '', tags = {}) {
            const leadSubject = getLocalAiIngredientSubject(leadIngredient);

            if (tags.category === 'Drink' || /water|milk|juice|tea|coffee/.test(leadSubject)) {
                return 'Single-ingredient drinks stay intentionally simple. Add citrus, herbs, ice, or a sweetener if you want a fuller drink idea.';
            }

            if (/powdered sugar|sugar|flour|salt|pepper|paprika|cumin|turmeric|oregano|thyme/.test(leadSubject)) {
                return 'Single pantry ingredients work best as bases or finishers. Add one more ingredient for a more complete recipe suggestion.';
            }

            return 'Single-ingredient recipes stay intentionally simple. Add one sauce, spice, or side ingredient if you want a fuller dish.';
        }

        function getLocalAiPantryAdditions(tags, normalizedIngredients = []) {
            const additions = [];
            const normalizedText = normalizedIngredients.join(' ');
            const allowSavoryDefaults = shouldUseSavoryLocalAiDefaults(tags, normalizedIngredients);
            const isPlainDrinkBase = normalizedIngredients.length === 1 && /water|milk|juice|tea|coffee/.test(normalizedText);

            if (allowSavoryDefaults && !/olive oil/.test(normalizedText)) additions.push('1 tbsp olive oil');

            if (allowSavoryDefaults) {
                if (tags.cuisine === 'Italian') additions.push('1 tsp dried oregano', '1 handful basil');
                if (tags.cuisine === 'Asian') additions.push('1 tbsp soy sauce', '1 tsp sesame oil', '1 thumb ginger');
                if (tags.cuisine === 'Thai') additions.push('200ml coconut milk', '1 tbsp lime juice');
                if (tags.cuisine === 'Indian') additions.push('1 tsp garam masala', '1 tsp turmeric');
                if (tags.cuisine === 'Mexican') additions.push('1 tsp cumin', '1 tbsp lime juice');
                if (tags.cuisine === 'Mediterranean') additions.push('1 tbsp lemon juice', '1 handful parsley');
                if (tags.cuisine === 'Middle Eastern') additions.push('1 tsp cumin', '1 handful parsley', '1 tbsp lemon juice');
                if (tags.cuisine === 'French') additions.push('1 tbsp butter', '1 tsp thyme');
                if (tags.cuisine === 'American') additions.push('1 tsp smoked paprika');
            }

            if (tags.category === 'Drink' && !isPlainDrinkBase) additions.push('200ml cold water or milk');
            if ((tags.category === 'Dessert' || tags.category === 'Baking') && /flour/.test(normalizedText) && !/baking powder/.test(normalizedText)) additions.push('1 tsp baking powder');

            return additions;
        }

        function buildLocalAiIngredientList(rawIngredients, normalizedIngredients, tags) {
            const generatedIngredients = rawIngredients.map((rawIngredient, index) => {
                const normalizedIngredient = normalizedIngredients[index] || normalizeTextForLocalAI(rawIngredient);
                const explicitIngredient = formatLocalAiExplicitIngredient(rawIngredient, normalizedIngredient);
                if (explicitIngredient) return explicitIngredient;
                if (/\d/.test(rawIngredient)) return rawIngredient.trim();
                if (/salt|pepper/.test(normalizedIngredient)) return 'Salt and pepper to taste';
                return `${getLocalAiIngredientMeasure(normalizedIngredient)} ${humanizeLocalAiIngredient(normalizedIngredient)}`.trim();
            }).filter(Boolean);

            const pantryAdditions = getLocalAiPantryAdditions(tags, normalizedIngredients);
            const combinedIngredients = [...generatedIngredients, ...pantryAdditions];
            if (shouldUseSavoryLocalAiDefaults(tags, normalizedIngredients) && !combinedIngredients.some(item => /salt and pepper/i.test(item))) {
                combinedIngredients.push('Salt and pepper to taste');
            }

            return Array.from(new Set(combinedIngredients.filter(Boolean))).slice(0, 12);
        }

        function buildLocalAiInstructions(normalizedIngredients, tags, leadIngredient, supportingIngredient) {
            const leadSubject = getLocalAiIngredientSubject(leadIngredient);
            const supportSubject = supportingIngredient ? getLocalAiIngredientSubject(supportingIngredient) : '';
            const leadLabel = humanizeLocalAiIngredient(leadSubject).toLowerCase();
            const supportLabel = supportSubject ? humanizeLocalAiIngredient(supportSubject).toLowerCase() : 'the remaining ingredients';
            const vegetables = normalizedIngredients
                .map(item => getLocalAiIngredientSubject(item))
                .filter(item => /onion|garlic|ginger|shallot|tomato|mushroom|broccoli|pepper|carrot|spinach|zucchini|cucumber/.test(item) && item !== leadSubject && item !== supportSubject)
                .slice(0, 2)
                .map(item => humanizeLocalAiIngredient(item).toLowerCase());
            const aromaticHint = vegetables.length ? vegetables.join(' and ') : 'any aromatics you have';

            if (normalizedIngredients.length === 1) {
                return buildSingleIngredientLocalAiInstructions(leadIngredient, tags);
            }

            if (tags.category === 'Drink') {
                return [
                    `Add ${leadLabel}${supportingIngredient ? ` and ${supportLabel}` : ''} to a blender with a splash of cold liquid.`,
                    'Blend until smooth and creamy.',
                    'Taste and adjust with citrus, sweetener, or ice if needed.',
                    'Serve immediately while cold and fresh.'
                ];
            }

            if (tags.category === 'Dessert' || tags.category === 'Baking') {
                return [
                    'Heat the oven to 180°C and lightly grease a baking dish or tray.',
                    `Mix ${leadLabel}${supportingIngredient ? ` with ${supportLabel}` : ''} until evenly combined.`,
                    'Transfer the mixture to the prepared dish and bake until golden and set.',
                    'Let it cool slightly before serving.'
                ];
            }

            if (tags.method === 'grill') {
                return [
                    `Season ${leadLabel}${supportingIngredient ? ` and ${supportLabel}` : ''} well and let everything sit for a few minutes.`,
                    'Heat a grill pan or barbecue until hot.',
                    `Cook the ${leadLabel} until nicely marked, then add ${supportLabel} until tender.`,
                    'Rest briefly, slice if needed, and serve warm.'
                ];
            }

            if (tags.method === 'steam') {
                return [
                    `Prepare ${leadLabel}${supportingIngredient ? ` and ${supportLabel}` : ''} into even pieces.`,
                    'Bring a steamer or a pan with a steaming basket up to a gentle simmer.',
                    'Steam the ingredients until just tender.',
                    'Finish with seasoning, oil, or citrus before serving.'
                ];
            }

            if (tags.method === 'simmer') {
                return [
                    `Prepare ${leadLabel}${supportingIngredient ? ` and ${supportLabel}` : ''}${vegetables.length ? `, then slice ${vegetables.join(' and ')}` : ''} into bite-size pieces.`,
                    `Warm olive oil in a pot and soften ${aromaticHint}.`,
                    `${/chicken|beef|pork|fish|shrimp|turkey|lamb/.test(leadSubject) ? `Add the ${leadLabel} and cook until lightly coloured.` : 'Add the main ingredients and stir for 2 to 3 minutes.'}`,
                    'Pour in stock or water, bring everything to a gentle simmer, and cook until tender and flavorful.',
                    'Taste, adjust the seasoning, and serve warm.'
                ];
            }

            if (tags.method === 'boil') {
                return [
                    `Prepare ${leadLabel}${supportingIngredient ? ` and ${supportLabel}` : ''}.`,
                    'Bring a pot of salted water or stock to the boil.',
                    `Cook the main base until just tender, then stir in ${supportLabel}.`,
                    'Drain or reduce the liquid as needed, season well, and serve hot.'
                ];
            }

            const liquidHint = tags.cuisine === 'Asian'
                ? 'a splash of soy sauce and water'
                : tags.cuisine === 'Thai'
                    ? 'coconut milk and a little water'
                    : tags.cuisine === 'Indian'
                        ? 'stock and warm spices'
                : tags.cuisine === 'Mexican'
                    ? 'stock and a pinch of cumin'
                    : tags.cuisine === 'Mediterranean'
                        ? 'a little stock and lemon juice'
                        : tags.cuisine === 'Middle Eastern'
                            ? 'stock and a squeeze of lemon'
                        : 'a little stock or water';

            return [
                `Prepare ${leadLabel}${supportingIngredient ? ` and ${supportLabel}` : ''}${vegetables.length ? `, then slice ${vegetables.join(' and ')}` : ''} into bite-size pieces.`,
                `Warm olive oil in a pan over medium heat and cook ${aromaticHint} until fragrant.`,
                `${/chicken|beef|pork|fish|shrimp/.test(leadSubject) ? `Add the ${leadLabel} and cook until it starts to brown.` : 'Add the main ingredients and stir for 2 to 3 minutes.'}`,
                `Stir in the remaining ingredients with ${liquidHint} and cook until everything is tender and well coated.`,
                'Taste, adjust the seasoning, and serve warm.'
            ];
        }

        function generateLocalRecipeFromIngredients(input) {
            const rawIngredients = splitLocalAiIngredientInput(input);
            if (rawIngredients.length === 0) throw new Error('No recognizable ingredients were found.');
            const normalizedIngredients = rawIngredients.map(item => normalizeTextForLocalAI(item)).filter(Boolean);
            const tags = localAutoTagRecipe('', normalizedIngredients.join(', '));
            const leadIngredient = pickLocalAiLeadIngredient(normalizedIngredients);
            const supportingIngredient = pickLocalAiSupportingIngredient(normalizedIngredients, leadIngredient);
            const singleIngredientTip = normalizedIngredients.length === 1 ? getSingleIngredientLocalAiTip(leadIngredient, tags) : '';

            return {
                title: buildLocalAiTitle(leadIngredient, supportingIngredient, tags, normalizedIngredients),
                category: tags.category,
                country: detectLocalAiCountry(tags.cuisine),
                prepTime: tags.prepTime,
                cookTime: tags.cookTime,
                servings: tags.servings,
                difficulty: tags.difficulty,
                cuisine: tags.cuisine,
                diet: tags.diet,
                ingredients: buildLocalAiIngredientList(rawIngredients, normalizedIngredients, tags),
                instructions: buildLocalAiInstructions(normalizedIngredients, tags, leadIngredient, supportingIngredient),
                tips: singleIngredientTip || (tags.category === 'Drink'
                    ? 'Blend again with extra ice if you want a colder finish.'
                    : tags.cuisine === 'Indian'
                        ? 'A spoonful of yogurt or a squeeze of lemon at the end will round everything out.'
                        : tags.cuisine === 'Thai'
                            ? 'Finish with extra lime or fresh herbs to keep the flavors bright.'
                            : tags.cuisine === 'Middle Eastern'
                                ? 'A drizzle of olive oil and some chopped herbs will lift the final dish.'
                    : tags.cuisine === 'Italian'
                        ? 'Finish with a little extra olive oil or fresh herbs just before serving.'
                        : tags.cuisine === 'Asian'
                            ? 'A squeeze of lime or a few sesame seeds will brighten the final dish.'
                            : 'Taste once more at the end and add a fresh herb or citrus squeeze to wake everything up.')
            };
        }

        function localAutoTagRecipe(title, ingredientsStr, notesStr = '', stepsStr = '') {
            const sourceText = normalizeTextForLocalAI(`${title} ${ingredientsStr} ${notesStr} ${stepsStr}`);
            const ingredientCount = splitLocalAiIngredientInput(ingredientsStr).length;
            const stepCount = String(stepsStr).split(/\n+/).map(step => step.trim()).filter(Boolean).length;
            const hasDrinkKeywords = /smoothie|juice|latte|tea|coffee|drink|cocktail|lemonade|water/.test(sourceText);
            const hasDessertKeywords = /cake|cookie|brownie|sweet|sugar|chocolate|icing|dessert|pie/.test(sourceText);
            const hasBakingKeywords = /flour|yeast|bread|muffin|cupcake|pastry|bake/.test(sourceText);
            const hasSoupKeywords = /soup|stew|broth|stock/.test(sourceText);
            const hasRiceKeywords = /rice|risotto|grain/.test(sourceText);
            const hasPastaKeywords = /pasta|noodle/.test(sourceText);
            const hasMeatKeywords = /beef|chicken|pork|sausage|meat|steak|bacon|turkey|lamb/.test(sourceText);
            const hasFishKeywords = /fish|salmon|tuna|shrimp|prawn|cod|seafood/.test(sourceText);
            const hasDairyKeywords = /milk|cheese|butter|cream|yogurt/.test(sourceText);
            const hasEggKeywords = /egg/.test(sourceText);
            const hasGlutenKeywords = /flour|bread|pasta|noodle|wheat/.test(sourceText);
            const hasNutKeywords = /almond|cashew|walnut|hazelnut|peanut|pistachio/.test(sourceText);
            const hasSoyKeywords = /soy|tofu|tempeh|miso|edamame/.test(sourceText);

            let category = 'Cooking';
            if (hasDrinkKeywords) category = 'Drink';
            else if (hasDessertKeywords) category = 'Dessert';
            else if (hasBakingKeywords) category = 'Baking';

            let cuisine = 'Homestyle';
            if (/garam masala|turmeric|paneer|dal|masala|cardamom|coriander/.test(sourceText)) cuisine = 'Indian';
            else if (/lemongrass|fish sauce|coconut milk|thai basil|red curry|green curry|lime leaves/.test(sourceText)) cuisine = 'Thai';
            else if (/tahini|zaatar|sumac|halloumi|falafel|shawarma|harissa|pita/.test(sourceText)) cuisine = 'Middle Eastern';
            else if (/shallot|thyme|creme fraiche|dijon|wine sauce/.test(sourceText)) cuisine = 'French';
            else if (/bbq|barbecue|cheddar|burger|ranch|cornbread/.test(sourceText)) cuisine = 'American';
            else if (/soy|ginger|sesame|noodle|miso|teriyaki|curry|szechuan|gochujang/.test(sourceText)) cuisine = 'Asian';
            else if (/basil|mozzarella|parmesan|pasta|risotto|oregano/.test(sourceText)) cuisine = 'Italian';
            else if (/tortilla|jalapeno|cumin|salsa|taco|quesadilla/.test(sourceText)) cuisine = 'Mexican';
            else if (/olive oil|feta|chickpea|hummus|zaatar|harissa/.test(sourceText)) cuisine = 'Mediterranean';

            let method = 'saute';
            if (hasDrinkKeywords) method = 'blend';
            else if (/grill|barbecue/.test(sourceText)) method = 'grill';
            else if (/steam/.test(sourceText)) method = 'steam';
            else if (/roast/.test(sourceText)) method = 'roast';
            else if (/bake|oven/.test(sourceText) || hasBakingKeywords || hasDessertKeywords) method = 'bake';
            else if (/boil|blanch/.test(sourceText) || hasRiceKeywords || hasPastaKeywords) method = 'boil';
            else if (/simmer|stew|curry|soup/.test(sourceText)) method = 'simmer';
            else if (/fry|saute|sear|stir fry/.test(sourceText)) method = 'fry';

            const diet = [];
            if (!hasMeatKeywords && !hasFishKeywords) diet.push('Vegetarian');
            if (!hasMeatKeywords && hasFishKeywords) diet.push('Pescatarian');
            if (!hasMeatKeywords && !hasFishKeywords && !hasDairyKeywords && !hasEggKeywords && !/honey/.test(sourceText)) diet.push('Vegan');
            if (!hasDairyKeywords) diet.push('Dairy-free');
            if (!hasGlutenKeywords) diet.push('Gluten-free');
            if (!hasNutKeywords) diet.push('Nut-free');
            if (!hasEggKeywords) diet.push('Egg-free');
            if (!hasSoyKeywords) diet.push('Soy-free');

            let difficulty = 'Easy';
            const complexityScore = ingredientCount + stepCount + ((method === 'simmer' || method === 'bake') ? 2 : 0) + ((/marinate|ferment|proof|temper|reduce/.test(sourceText)) ? 2 : 0) + ((/Indian|Thai|French/.test(cuisine)) ? 1 : 0);
            if (complexityScore >= 12 || /ferment|proof|temper/.test(sourceText)) difficulty = 'Hard';
            else if (complexityScore >= 7) difficulty = 'Medium';

            const baseTimes = {
                blend: { prepTime: 10, cookTime: 0 },
                bake: { prepTime: 20, cookTime: 30 },
                roast: { prepTime: 18, cookTime: 35 },
                grill: { prepTime: 15, cookTime: 18 },
                steam: { prepTime: 12, cookTime: 14 },
                boil: { prepTime: 12, cookTime: 18 },
                simmer: { prepTime: 15, cookTime: 30 },
                fry: { prepTime: 12, cookTime: 16 },
                saute: { prepTime: 10, cookTime: 14 }
            };
            const timing = baseTimes[method] || baseTimes.saute;
            let prepTime = timing.prepTime + (ingredientCount >= 8 ? 5 : 0);
            let cookTime = timing.cookTime + (stepCount >= 5 ? 5 : 0) + ((hasMeatKeywords || hasFishKeywords) ? 5 : 0) + (hasSoupKeywords ? 8 : 0);
            const servings = hasDrinkKeywords ? 2 : (hasDessertKeywords || hasBakingKeywords ? 6 : (/tortilla|wrap/.test(sourceText) ? 4 : (ingredientCount >= 8 ? 6 : 4)));

            return {
                category,
                cuisine,
                diet,
                difficulty,
                method,
                prepTime,
                cookTime,
                servings
            };
        }

        function addDraftStep() {
            const input = document.getElementById('new-step');
            if(input.value.trim() === '') return;
            const minutesInput = document.getElementById('new-step-minutes');
            const typed = Number.parseInt(minutesInput?.value || '', 10);
            const minutes = Math.max(1, Math.min(240, Number.isInteger(typed) ? typed : (readStepMinutes(input.value) || 1)));
            draftSteps.push({ text: input.value.trim(), image: '', minutes });
            input.value = '';
            if (minutesInput) minutesInput.value = '1';
            renderDraftSteps();
        }

        function setDraftStepMinutes(index, value) {
            if (!draftSteps[index]) return;
            const normalized = normalizeRecipeInstructionStep(draftSteps[index]) || { text: '', image: '', minutes: 1 };
            draftSteps[index] = {
                ...normalized,
                minutes: Math.max(1, Math.min(240, Number.parseInt(value, 10) || 1))
            };
        }

        function removeDraftStep(index) { draftSteps.splice(index, 1); renderDraftSteps(); }

        function handleDraftStepImageUpload(event, index) {
            const file = event.target.files[0];
            if (!file || !draftSteps[index]) return;

            const reader = new FileReader();
            reader.onload = function(loadEvent) {
                const normalizedStep = normalizeRecipeInstructionStep(draftSteps[index]) || { text: '', image: '' };
                draftSteps[index] = {
                    ...normalizedStep,
                    image: loadEvent.target.result
                };
                renderDraftSteps();
            };
            reader.readAsDataURL(file);
        }

        function clearDraftStepImage(index) {
            if (!draftSteps[index]) return;

            const normalizedStep = normalizeRecipeInstructionStep(draftSteps[index]) || { text: '', image: '' };
            draftSteps[index] = {
                ...normalizedStep,
                image: ''
            };
            renderDraftSteps();
        }

        function renderDraftSteps() {
            document.getElementById('draft-steps-list').innerHTML = draftSteps.map((step, i) => {
                const stepText = getRecipeInstructionText(step);
                const stepImage = getRecipeInstructionImage(step);
                const stepMinutes = getRecipeInstructionMinutes(step) || 1;

                return `
                    <li class="bg-white p-3 rounded-sm border border-parchmentDark shadow-sm text-sm font-medium text-forest">
                        <div class="flex items-start gap-3">
                            <span class="bg-sage text-white w-6 h-6 flex items-center justify-center rounded-sm text-xs font-bold flex-shrink-0 mt-0.5">${i + 1}</span>
                            <div class="flex-1 pt-0.5">
                                <p class="leading-relaxed">${stepText}</p>
                                ${stepImage ? `<div class="mt-3 overflow-hidden rounded-md border border-parchmentDark bg-parchment"><img src="${stepImage}" alt="Draft step ${i + 1}" class="h-40 w-full object-cover"></div>` : ''}
                                <label class="mt-3 inline-flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.16em] text-sage">
                                    Minutes
                                    <input type="number" min="1" max="240" inputmode="numeric" value="${stepMinutes}" aria-label="Minutes for step ${i + 1}" class="${inputClass} !h-9 !w-20" onchange="setDraftStepMinutes(${i}, this.value)">
                                </label>
                                <div class="mt-3 flex flex-wrap gap-2">
                                    <label class="inline-flex h-9 items-center justify-center gap-2 rounded-full border border-parchmentDark bg-white px-3 text-[10px] font-bold uppercase tracking-[0.16em] text-sage shadow-sm transition-all hover:border-gold hover:text-forest cursor-pointer">
                                        <input type="file" accept="image/*" class="hidden" onchange="handleDraftStepImageUpload(event, ${i})">
                                        <i data-lucide="image-plus" class="h-4 w-4 text-gold"></i>${stepImage ? 'Change photo' : 'Add photo'}
                                    </label>
                                    ${stepImage ? `<button type="button" onclick="clearDraftStepImage(${i})" class="inline-flex h-9 items-center justify-center gap-2 rounded-full border border-parchmentDark bg-white px-3 text-[10px] font-bold uppercase tracking-[0.16em] text-sage shadow-sm transition-all hover:border-red-400 hover:text-red-500"><i data-lucide="image-off" class="h-4 w-4"></i>Remove photo</button>` : ''}
                                </div>
                            </div>
                            <button type="button" onclick="removeDraftStep(${i})" class="text-red-400 hover:text-red-600 p-1 flex-shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </li>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function saveRecipe(event) {
            event.preventDefault();
            if (isCurrentUserSociallyIsolated()) {
                showToast('Recipe editing is disabled while your account is under permanent social restriction.', 'alert-circle', true);
                return;
            }
            if (draftIngredients.length === 0) { showToast('Add at least one ingredient!', 'alert-circle'); return; }
            if (draftSteps.length === 0) { showToast('Add at least one step!', 'alert-circle'); return; }

            const explicitPublishAfterSave = recipeSubmitAction === 'publish';
            recipeSubmitAction = 'save';

            const dietCheckboxes = document.querySelectorAll('.diet-checkbox:checked');
            const selectedDiet = Array.from(dietCheckboxes).map(cb => cb.value);

            const existingRecipe = editingRecipeId ? recipes.find(recipe => recipe.id === editingRecipeId) : null;
            const shouldPublishAfterSave = explicitPublishAfterSave || (userSettings.autoPublish === true && (!existingRecipe || existingRecipe.source !== 'published'));
            const localRecipesCount = recipes.filter(recipe => recipe.source === 'local').length;
            if (!existingRecipe && !hasPremiumAccess() && localRecipesCount >= freeLocalRecipeLimit) {
                showPremiumModal('add more than 3 recipes');
                return;
            }

            const titleValue = document.getElementById('r-title').value;
            const notesValue = document.getElementById('r-tips').value;
            const manualCategory = document.getElementById('r-category').value;
            const selectedMealTypes = Array.from(document.querySelectorAll('.meal-type-btn[data-selected="true"]')).map(btn => btn.dataset.mealType).filter(Boolean);
            const manualPrepTime = parseInt(document.getElementById('r-prepTime').value) || 0;
            const manualCookTime = parseInt(document.getElementById('r-cookTime').value) || 0;
            const manualServings = parseInt(document.getElementById('r-servings').value) || 4;
            const manualDifficulty = document.getElementById('r-difficulty').value || '';
            const manualCuisine = document.getElementById('r-cuisine').value || '';
            const selectedFamilyId = document.getElementById('r-family-book')?.value || '';
            const selectedFamily = getFamilyById(selectedFamilyId);
            if ((isCurrentUserFamilyReadOnly() || isCurrentUserSociallyIsolated()) && selectedFamily?.id) {
                showToast('You can only view family recipes right now. Editing or adding family recipes is blocked.', 'alert-circle', true);
                return;
            }
            const recipePayload = {
                ...existingRecipe,
                id: existingRecipe?.id || generateId(),
                title: titleValue,
                author: document.getElementById('r-author').value || 'Unknown',
                source: existingRecipe?.source || 'local',
                category: manualCategory,
                mealType: selectedMealTypes,
                country: document.getElementById('r-country').value,
                familyId: selectedFamily?.id || '',
                familyName: selectedFamily?.name || '',
                familyColorKey: selectedFamily?.colorKey || '',
                profile: draftProfile || existingRecipe?.profile || defaultPlaceholderProfile,
                prepTime: manualPrepTime,
                cookTime: manualCookTime,
                servings: manualServings,
                difficulty: manualDifficulty,
                diet: selectedDiet,
                cuisine: manualCuisine,
                ingredients: [...draftIngredients],
                instructions: normalizeRecipeInstructions(draftSteps),
                tips: notesValue,
                lastOpened: existingRecipe?.lastOpened || Date.now(),
                checkedIngredients: existingRecipe?.checkedIngredients || [],
                checkedSteps: existingRecipe?.checkedSteps || [],
                personalNotes: existingRecipe?.personalNotes || "",
                notebookStickyNotes: normalizeNotebookStickyNotes(existingRecipe?.notebookStickyNotes),
                versionHistory: existingRecipe ? getUpdatedRecipeVersionHistory(existingRecipe, {
                    ...existingRecipe,
                    title: titleValue,
                    author: document.getElementById('r-author').value || 'Unknown',
                    category: manualCategory,
                    mealType: selectedMealTypes,
                    country: document.getElementById('r-country').value,
                    familyId: selectedFamily?.id || '',
                    familyName: selectedFamily?.name || '',
                    familyColorKey: selectedFamily?.colorKey || '',
                    prepTime: manualPrepTime,
                    cookTime: manualCookTime,
                    servings: manualServings,
                    difficulty: manualDifficulty,
                    diet: selectedDiet,
                    cuisine: manualCuisine,
                    ingredients: [...draftIngredients],
                    instructions: normalizeRecipeInstructions(draftSteps),
                    tips: notesValue
                }) : []
            };

            if (existingRecipe) {
                recipes = recipes.map(recipe => recipe.id === existingRecipe.id ? recipePayload : recipe);
            } else {
                recipes.push(recipePayload);
                trackLaunchEvent('recipesCreated');
            }

            if (selectedFamily?.id) {
                addFamilyNotification({
                    type: existingRecipe ? 'family-recipe-edited' : 'family-recipe-added',
                    title: existingRecipe ? 'Family recipe edited' : 'Family recipe added',
                    message: existingRecipe
                        ? `"${recipePayload.title}" was updated in ${selectedFamily.name}.`
                        : `"${recipePayload.title}" was added to ${selectedFamily.name}.`,
                    familyId: selectedFamily.id,
                    recipeId: recipePayload.id,
                    recipeTitle: recipePayload.title
                });
            }

            saveData();
            const savedRecipeId = recipePayload.id;
            editingRecipeId = null;

            if (shouldPublishAfterSave) {
                await publishRecipe(savedRecipeId);
                renderDetail(savedRecipeId);
                contentDiv.scrollTop = 0;
                return;
            }

            if (existingRecipe) {
                showToast('Recipe updated successfully!', 'check-circle');
                renderDetail(savedRecipeId);
            } else {
                showToast('Recipe successfully added!', 'check-circle');
                searchQuery = "";
                categoryFilter = "";
                renderList();
            }

            contentDiv.scrollTop = 0;
        }

        function shareRecipe(id) {
            if (requirePremiumFeature('recipeSharing')) {
                return;
            }

            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;
            const shareText = `Check out this recipe: ${recipe.title}!\n\nIngredients:\n- ${recipe.ingredients.join('\n- ')}\n\nLet's cook!`;
            if (navigator.share) navigator.share({ title: recipe.title, text: shareText }).catch(() => copyToClipboard(shareText));
            else copyToClipboard(shareText);
        }

        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try { document.execCommand('copy'); showToast('Copied to clipboard!', 'copy'); } 
            catch (err) { showToast('Copy failed.', 'x-circle'); }
            document.body.removeChild(textArea);
        }

        loadLaunchDiagnostics();
        trackLaunchEvent('appLoads');
        loadData();
        configureDesktopNavAutoHide();

        contentDiv?.addEventListener('scroll', handleDesktopNavScrollActivity, { passive: true });
        window.addEventListener('scroll', handleDesktopNavScrollActivity, { passive: true });
        document.addEventListener('pointermove', handleDesktopNavPointerActivity, { passive: true });
        document.addEventListener('keydown', () => revealDesktopNav({ scheduleHide: true }));
        document.addEventListener('focusin', event => {
            revealDesktopNav({ scheduleHide: true });
            scrollFocusedFieldIntoView(event);
        });
        window.addEventListener('resize', configureDesktopNavAutoHide);
        window.addEventListener('resize', syncNotebookViewportHeight);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncNotebookViewportHeight);
            window.visualViewport.addEventListener('scroll', syncNotebookViewportHeight);
        }
        if (typeof desktopNavAutoHideMedia.addEventListener === 'function') {
            desktopNavAutoHideMedia.addEventListener('change', configureDesktopNavAutoHide);
        } else if (typeof desktopNavAutoHideMedia.addListener === 'function') {
            desktopNavAutoHideMedia.addListener(configureDesktopNavAutoHide);
        }
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearDesktopNavHideTimer();
            } else {
                revealDesktopNav({ scheduleHide: true });
            }
        });
        window.setInterval(() => {
            syncRecipeUndoButton();
        }, 15000);

        window.addEventListener('error', event => {
            recordLaunchError('window.error', event.error || event.message || 'Unknown runtime error', event.error?.stack || `${event.filename || 'inline'}:${event.lineno || 0}:${event.colno || 0}`);
        });

        window.addEventListener('unhandledrejection', event => {
            recordLaunchError('unhandledrejection', event.reason || 'Unhandled promise rejection');
        });
        
        window.addEventListener('DOMContentLoaded', () => {
            ensureUiLanguagePreference();

            const requestedAuthMode = getRequestedAuthViewMode();
            if (requestedAuthMode) {
                authViewMode = requestedAuthMode;
                sessionStorage.setItem(landingSessionKey, '1');
                document.getElementById('app-landing')?.remove();
            }

            if (typeof firebase !== 'undefined') {
                try {
                    initializeFirebase();
                } catch (error) {
                    console.log("Firebase SDK not loaded - local mode only");
                    finishLocalBoot();
                }
            } else {
                finishLocalBoot();
            }
            openRequestedLegalDocument();

            // Safety net: if Firebase never calls onAuthStateChanged within 6 seconds, dismiss loading
            setTimeout(() => {
                dismissAuthLoadingScreen();
            }, 6000);

            lucide.createIcons();
        });
        ensureUiLanguagePreference();
        showAppLanding();
    </script>
</body>
</html>
