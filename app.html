                                            <div class="relative">
                                                <select onchange="categoryFilter = this.value; renderList()" class="h-11 w-full appearance-none rounded-xl border border-sage border-opacity-20 bg-white px-4 pr-11 text-sm font-semibold text-forest shadow-sm outline-none transition-all focus:border-gold focus:shadow-md">
                                                    <option value="">All categories</option>
                                                    <option value="Baking" ${categoryFilter === 'Baking' ? 'selected' : ''}>Baking</option>
                                                    <option value="Cooking" ${categoryFilter === 'Cooking' ? 'selected' : ''}>Cooking</option>
                                                    <option value="Dessert" ${categoryFilter === 'Dessert' ? 'selected' : ''}>Dessert</option>
                                                    <option value="Drink" ${categoryFilter === 'Drink' ? 'selected' : ''}>Drink</option>
                                                </select>
                                                <i data-lucide="chevron-down" class="pointer-events-none absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 text-sage"></i>

                                                    <option value="">All levels</option>
                                                    <option value="Easy" ${difficultyFilter === 'Easy' ? 'selected' : ''}>Easy</option>

                                            <label class="block text-[11px] font-bold uppercase tracking-[0.28em] text-sage opacity-80">Cuisine</label>

                                                    <option value="">All cuisines</option>
                                                    <option value="European" ${cuisineFilter === 'European' ? 'selected' : ''}>European</option>
                                                    <option value="Asian" ${cuisineFilter === 'Asian' ? 'selected' : ''}>Asian</option>
                                                    <option value="Italian" ${cuisineFilter === 'Italian' ? 'selected' : ''}>Italian</option>
                                                    <option value="Mediterranean" ${cuisineFilter === 'Mediterranean' ? 'selected' : ''}>Mediterranean</option>
                                                    <option value="American" ${cuisineFilter === 'American' ? 'selected' : ''}>American</option>
                                                    <option value="Mexican" ${cuisineFilter === 'Mexican' ? 'selected' : ''}>Mexican</option>

                                                <button onclick="resetRecipeFilters()" class="${getAppButtonClasses('secondary')}">

        window.addEventListener('storage', event => {
            const scopedSettingsKey = currentUser?.uid ? getScopedStorageKey(legacyRecipeSettingsStorageKey) : legacyRecipeSettingsStorageKey;
            if (event.key !== scopedSettingsKey || !event.newValue) return;

            try {
                const parsedSettings = JSON.parse(event.newValue);
                if (!parsedSettings || !Object.prototype.hasOwnProperty.call(parsedSettings, 'shoppingList')) return;

                const nextShoppingList = normalizeShoppingListState(parsedSettings.shoppingList);
                if (JSON.stringify(nextShoppingList) === JSON.stringify(userSettings.shoppingList)) return;

                userSettings.shoppingList = nextShoppingList;
                if (currentView === 'shopping') {
                    renderShoppingList();
                }
            } catch (error) {
                console.warn('Shopping list sync skipped:', error);
            }
        });

            const remoteRecipes = firebaseInitialized ? await loadPublishedRecipes() : [];
            let authorRecipes = (remoteRecipes || []).filter(recipe => recipe.authorId === authorId && recipe.publicationState !== 'retracted');

            if (firebaseInitialized && authorRecipes.length === 0) {
                try {
                    const db = firebase.firestore();
                    const snapshot = await db.collection('published-recipes').where('authorId', '==', authorId).limit(100).get();
                    authorRecipes = snapshot.docs
                        .map(doc => ({ ...doc.data(), id: doc.id }))
                        .filter(recipe => recipe.publicationState !== 'retracted');
                    authorRecipes.forEach(recipe => upsertPublishedRecipeCacheEntry(recipe));

                    console.error('Public profile recipe load failed:', error);
                }
            }

            authorRecipes.sort((a, b) => {
                const aTime = a?.publishedAt?.toMillis ? a.publishedAt.toMillis() : new Date(a?.publishedAt || 0).getTime();
                const bTime = b?.publishedAt?.toMillis ? b.publishedAt.toMillis() : new Date(b?.publishedAt || 0).getTime();
                return bTime - aTime;
            });

            let userDoc = null;
            if (firebaseInitialized) {
                try {
                    const db = firebase.firestore();
                    const userSnapshot = await db.collection('users').doc(authorId).get();
                    if (userSnapshot.exists) {
                        userDoc = userSnapshot.data() || null;
                    }

                    console.error('Public profile user load failed:', error);

            maybeRunAutomaticDuplicateCleanup();

            const normalizedQuery = browseQuery.trim().toLowerCase();

                    .filter(Boolean)

                                <ul class="text-sm space-y-2">

        // --- TIMER FUNCTIONS ---
        let cookTimerInterval = null;
        let cookTimerRemaining = 5 * 60;
        let cookTimerDuration = 5 * 60;
        let cookTimerRunning = false;
        let cookWakeLock = null;
        let cookSession = null;

        function formatCookClock(totalSeconds) {
            const safe = Math.max(0, Number(totalSeconds) || 0);
            const mins = Math.floor(safe / 60);
            const secs = safe % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function showCookTimerDock() {}

        function stopCookTicker() {
            cookTimerRunning = false;
            if (cookTimerInterval) clearInterval(cookTimerInterval);
            cookTimerInterval = null;
        }

        function pauseCookTimer() {
            stopCookTicker();
        }

        function cookIngredientName(item) {
            return String(item || '').replace(/^\d[\d\s./]*/, '').replace(/\b(g|kg|ml|cl|l|tbsp|tsp|cups?|cloves?|of)\b/gi, ' ').replace(/\s+/g, ' ').trim();
        }

        function ingredientsForCookStep(recipe, stepText) {
            const hay = String(stepText || '').toLowerCase();
            return (recipe?.ingredients || []).filter(item => {
                const name = cookIngredientName(item).toLowerCase();
                if (!name) return false;
                if (hay.includes(name)) return true;
                return name.split(' ').filter(word => word.length >= 4).some(word => hay.includes(word));
            });
        }

        function paintCookClock() {
            const clock = document.getElementById('cook-clock');
            if (!clock || !cookSession) return;
            const seconds = cookSession.phase === 'done' ? 0 : (cookSession.remaining[cookSession.index] || 0);
            clock.textContent = formatCookClock(seconds);
        }

        function paintCookStep() {
            if (!cookSession) return;
            const recipe = recipes.find(entry => entry.id === cookSession.recipeId);
            const steps = recipe?.instructions || [];
            const stage = document.querySelector('.cook-stage');
            if (stage) {
                stage.dataset.cookPhase = cookSession.phase;
                stage.dataset.cookStep = String(cookSession.index);
            }
            if (cookSession.phase === 'done') {
                const kicker = document.getElementById('cook-kicker');
                const instruction = document.getElementById('cook-instruction');
                const list = document.getElementById('cook-ingredients');
                const peek = document.getElementById('cook-peek-text');
                if (kicker) kicker.textContent = 'Finished';
                if (instruction) instruction.textContent = 'Cooking is done.';
                if (list) list.innerHTML = '';
                if (peek) peek.textContent = 'That was the last step.';
                paintCookClock();
                return;
            }
            const step = steps[cookSession.index];
            const plain = getRecipeInstructionText(step);
            const text = applyMeasurementSystem(plain);
            const kicker = document.getElementById('cook-kicker');
            const instruction = document.getElementById('cook-instruction');
            const list = document.getElementById('cook-ingredients');
            const peek = document.getElementById('cook-peek-text');
            if (kicker) kicker.textContent = `Step ${cookSession.index + 1} of ${steps.length}`;
            if (instruction) instruction.textContent = text;
            if (list) {
                const items = ingredientsForCookStep(recipe, plain);
                list.innerHTML = items.map(item => `<li>${escapeHTML(applyMeasurementSystem(scaleCookQuantityText(item, currentScale)))}</li>`).join('');
            }
            const next = steps[cookSession.index + 1];
            if (peek) peek.textContent = next ? applyMeasurementSystem(getRecipeInstructionText(next)) : 'That was the last step.';
            paintCookClock();
        }

        function tickCook() {
            if (!cookSession || cookSession.phase !== 'cooking') return;
            const index = cookSession.index;
            if ((cookSession.remaining[index] || 0) <= 0) return;
            cookSession.remaining[index] -= 1;
            paintCookClock();
            if (cookSession.remaining[index] > 0) return;
            const recipe = recipes.find(entry => entry.id === cookSession.recipeId);
            const last = (recipe?.instructions || []).length - 1;
            if (index >= last) {
                cookSession.phase = 'done';
                stopCookTicker();
                paintCookStep();
                return;
            }
            cookSession.index += 1;
            paintCookStep();
        }

        function startCookTicker() {
            if (cookTimerInterval || !cookSession || cookSession.phase !== 'cooking') return;
            cookTimerRunning = true;
            cookTimerInterval = setInterval(tickCook, 1000);
        }

        function beginCookSession() {
            if (!cookSession) return;
            document.querySelectorAll('[data-cook-minutes]').forEach(input => {
                const index = Number(input.dataset.cookMinutes);
                const value = Math.max(1, Math.min(240, Number.parseInt(input.value, 10) || 1));
                cookSession.minutes[index] = value;
            });
            cookSession.remaining = cookSession.minutes.map(minutes => minutes * 60);
            cookSession.index = 0;
            cookSession.phase = 'cooking';
            renderDetail(cookSession.recipeId);
            startCookTicker();
        }

        function moveCookStep(direction) {
            if (!cookSession || cookSession.phase === 'prepare') return;
            const recipe = recipes.find(entry => entry.id === cookSession.recipeId);
            const count = (recipe?.instructions || []).length;
            if (!count) return;
            if (cookSession.phase === 'done') {
                if (direction > 0) return;
                cookSession.phase = 'cooking';
                cookSession.index = count - 1;
                paintCookStep();
                return;
            }
            const next = cookSession.index + (direction > 0 ? 1 : -1);
            if (next < 0) return;
            if (next >= count) {
                cookSession.phase = 'done';
                stopCookTicker();
                paintCookStep();
                return;
            }
            cookSession.index = next;
            cookSession.phase = 'cooking';
            paintCookStep();
            startCookTicker();
        }

        function bindCookStage() {
            if (!isCookingMode || !cookSession) return;
            if (cookSession.phase === 'cooking' || cookSession.phase === 'done') paintCookStep();
            const sheet = document.getElementById('cook-sheet');
            if (!sheet || sheet.dataset.peekBound === 'true') return;
            sheet.dataset.peekBound = 'true';
            let holding = false;
            const endPeek = () => {
                if (!holding) return;
                holding = false;
                sheet.classList.remove('is-peeking');
            };
            sheet.addEventListener('pointerdown', event => {
                if (event.target.closest('button, input, a, label')) return;
                if (!cookSession || cookSession.phase !== 'cooking') return;
                holding = true;
                sheet.classList.add('is-peeking');
                if (sheet.setPointerCapture) {
                    try { sheet.setPointerCapture(event.pointerId); } catch (error) {}
                }
            });
            sheet.addEventListener('pointerup', endPeek);
            sheet.addEventListener('pointercancel', endPeek);
        }

        function readStepMinutes(text) {
            const source = String(text || '');
            const minuteMatch = source.match(/(\d+)\s*(?:minutes|minute|mins|min|minuten|minuut)\b/i);
            if (minuteMatch) return Number(minuteMatch[1]);
            const hourMatch = source.match(/(\d+)\s*(?:hours|hour|hrs|hr|uur)\b/i);
            if (hourMatch) return Number(hourMatch[1]) * 60;
            return null;
        }

        function closeTimer() {

        }

        async function requestCookWakeLock() {
            const dock = document.getElementById('cook-timer-dock');
            try {
                if (!('wakeLock' in navigator)) {
                    if (dock) dock.dataset.wakeLock = 'unsupported';
                    return;
                }
                cookWakeLock = await navigator.wakeLock.request('screen');
                if (dock) dock.dataset.wakeLock = 'active';
                cookWakeLock.addEventListener('release', () => {
                    cookWakeLock = null;
                    const currentDock = document.getElementById('cook-timer-dock');
                    if (currentDock && isCookingMode) currentDock.dataset.wakeLock = 'released';
                });
            } catch (error) {
                if (dock) dock.dataset.wakeLock = 'denied';
            }
        }

        async function releaseCookWakeLock() {
            try {
                await cookWakeLock?.release();
            } catch (error) {}
            cookWakeLock = null;
            const dock = document.getElementById('cook-timer-dock');
            if (dock) dock.dataset.wakeLock = 'off';
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isCookingMode) requestCookWakeLock();
        });

        function closeModal(modalId) {
            const modals = document.querySelectorAll('.app-overlay[id^="dynamic-modal-"]');
            const requested = modalId ? document.getElementById(modalId) : null;
            const targetModal = requested?.classList?.contains('app-overlay')
                ? requested
                : (requested?.closest?.('.app-overlay[id^="dynamic-modal-"]') || modals[modals.length - 1]);
            
            if (targetModal) {
                const content = document.getElementById(`${targetModal.id}-content`);
                targetModal.classList.add('opacity-0');

                Object.keys(window)
                    .filter(key => key.startsWith(`dynamic-modal-btn-${targetModal.id}-`))
                    .forEach(key => {
                        delete window[key];
                    });
                
                setTimeout(() => {
                    targetModal.remove();
                }, 300);
            }

        function updateFamilyColorSelection() {

                const isSelected = radio === checked;
                if (div) {

        function initFamilySortable() {
            const list = document.getElementById('family-list-sortable');
            if (!list) return;
            let dragSrc = null;
            list.querySelectorAll('.family-sortable-row').forEach(row => {
                row.addEventListener('dragstart', e => {
                    dragSrc = row;
                    e.dataTransfer.effectAllowed = 'move';
                    row.style.opacity = '0.45';
                });
                row.addEventListener('dragend', () => {
                    row.style.opacity = '';
                    list.querySelectorAll('.family-sortable-row').forEach(r => r.classList.remove('drag-over'));
                });
                row.addEventListener('dragover', e => {
                    e.preventDefault();
                    list.querySelectorAll('.family-sortable-row').forEach(r => r.classList.remove('drag-over'));
                    if (row !== dragSrc) {
                        row.classList.add('drag-over');
                        row.style.outline = '2px solid #c39a4d';
                    }
                });
                row.addEventListener('dragleave', () => {
                    row.classList.remove('drag-over');
                    row.style.outline = '';
                });
                row.addEventListener('drop', e => {
                    e.preventDefault();
                    row.style.outline = '';
                    if (!dragSrc || dragSrc === row) return;
                    const rows = [...list.querySelectorAll('.family-sortable-row')];
                    const fromIdx = rows.indexOf(dragSrc);
                    const toIdx = rows.indexOf(row);
                    if (fromIdx < toIdx) list.insertBefore(dragSrc, row.nextSibling);
                    else list.insertBefore(dragSrc, row);
                    // Persist new order
                    const newOrder = [...list.querySelectorAll('.family-sortable-row')].map(r => r.dataset.familyId);
                    saveFamilyOrder(newOrder);
                    // Update rank labels
                    list.querySelectorAll('.family-sortable-row').forEach((r, i) => {
                        const label = r.querySelector('span[class*="tracking-[0.2em]"]');
                        if (label) label.textContent = ['#1 Familie', '#2 Familie', '#3 Familie'][i] || '';
                    });
                });
            });
        }

            if (!validateFamilyNameForModeration(name)) return;
            showToast('Creating family...', 'loader');
            const tag = Math.floor(1000 + Math.random() * 9000).toString();
            const color = getFamilyColorOption(colorKey);
            
            const newFamily = {
                id: 'fam_' + Date.now(),
                name: name,
                tag: tag,
                pinCode: pin,
                colorKey: color.key,
                creatorId: currentUser.uid,
                memberIds: [currentUser.uid],
                removedMembers: []
            };
            
            userFamilies.push(normalizeFamilyRecord(newFamily));
            saveData();
            showToast(`Family created! Invite others with tag #${tag}.`, 'check');
            renderProfile(); 
        }

        async function submitJoinFamily(name, tag, pin) {
            if (!validateFamilyNameForModeration(name)) return;
            if (!isAuthenticated || !currentUser) {
                showToast('Je moet ingelogd zijn.', 'alert-circle', true);
                return;
            }

            showToast('Familie zoeken…', 'loader');

            // Check local cache first
            const localMatch = (userFamilies || []).find(
                f => f.name.trim().toLowerCase() === name.trim().toLowerCase()
                    && String(f.tag) === String(tag)
                    && String(f.pinCode) === String(pin)
            );
            if (localMatch) {
                showToast('Je bent al lid van deze familie.', 'users');
                return;
            }

            if (!firebaseInitialized) {
                showToast('Cloudverbinding niet beschikbaar. Probeer het opnieuw.', 'cloud-off', true);
                return;
            }

            try {
                const db = firebase.firestore();
                const snapshot = await db.collection('family-books')
                    .where('tag', '==', String(tag))
                    .limit(5)
                    .get();

                if (snapshot.empty) {
                    showToast('Geen familie gevonden met deze code. Controleer naam, code en pincode.', 'alert-circle', true);
                    return;
                }

                let targetFamily = null;
                snapshot.forEach(doc => {
                    const d = doc.data();
                    if (
                        String(d.name || '').trim().toLowerCase() === name.trim().toLowerCase()
                        && String(d.pinCode || '') === String(pin)
                    ) {
                        targetFamily = { ...d, id: doc.id };
                    }
                });

                if (!targetFamily) {
                    showToast('Naam of pincode klopt niet. Controleer de gegevens bij de beheerder.', 'alert-circle', true);
                    return;
                }

                if ((targetFamily.memberIds || []).includes(currentUser.uid)) {
                    showToast('Je bent al lid van deze familie.', 'users');
                    return;
                }

                const updatedMemberIds = [...(targetFamily.memberIds || []), currentUser.uid];
                await db.collection('family-books').doc(targetFamily.id).update({
                    memberIds: updatedMemberIds,
                    updatedAt: new Date()
                });

                const normalizedFamily = normalizeFamilyRecord({ ...targetFamily, memberIds: updatedMemberIds });
                userFamilies = [...(userFamilies || []), normalizedFamily];
                saveData();

                showToast(`Welkom bij ${targetFamily.name}!`, 'check-circle');
                renderProfile();
            } catch (error) {
                console.error('Join family error:', error);
                showToast('Er ging iets mis. Controleer je verbinding en probeer opnieuw.', 'alert-circle', true);
            }
        }

        function showFamilyDetails(familyId) {
            const family = userFamilies.find(f => f.id === familyId);
            if (!family) return;

            const isRemoved = family.removedMembers && family.removedMembers.some(m => m.userId === currentUser?.uid);
            const isCreator = family.creatorId === currentUser?.uid;

            const membersHtml = family.memberIds.map(uid => `
                <div class="flex items-center justify-between p-3 border-b border-parchmentDark last:border-0 hover:bg-white transition-colors group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-forest text-white flex items-center justify-center font-bold text-xs uppercase">
                            ${uid === currentUser?.uid ? 'ME' : 'U'}
                        </div>
                        <div>
                            <p class="font-bold text-forest text-sm">${uid === currentUser?.uid ? 'You' : 'Family Member'}</p>
                            <p class="text-[10px] text-sage uppercase tracking-wider">${uid === family.creatorId ? 'Admin' : 'Member'}</p>
                        </div>
                    </div>
                    ${(isCreator && uid !== currentUser?.uid) ? `
                        <button onclick="removeFamilyMember('${family.id}', '${uid}')" class="${getAppButtonClasses('danger', { iconOnly: true })} opacity-0 group-hover:opacity-100 group-focus-within:opacity-100" title="Remove Member">
                            <i data-lucide="user-minus" class="w-4 h-4"></i>
                        </button>
                    ` : ''}
                </div>
            `).join('');

            createModal(`${family.name} <span class="text-sage font-normal text-sm opacity-60">#${family.tag}</span>`, `
                <div class="space-y-6 text-inkDark max-h-[60vh] overflow-y-auto w-[650px] max-w-[90vw]">
                    ${isRemoved ? `
                        <div class="bg-coral text-white p-4 rounded-sm flex gap-3 text-sm shadow-sm mb-6 border border-coral/20">
                            <i data-lucide="alert-triangle" class="w-5 h-5 shrink-0 mt-0.5"></i>
                            <div>
                                <p class="font-bold mb-1">You are no longer an active member.</p>
                                <p class="opacity-90">You have read-only access to this family's recipes to back them up via PDF export. This access will expire automatically 30 days after removal.</p>
                            </div>
                        </div>
                    ` : ''}

                    <div>
                        <h4 class="text-xs uppercase tracking-wide font-bold text-sage mb-3 flex justify-between items-end">
                            <span>Members (${family.memberIds.length})</span>
                            ${isCreator ? '<span class="text-[10px] font-normal opacity-70">You can manage members</span>' : ''}
                        </h4>
                        <div class="bg-parchment rounded-sm border border-parchmentDark">
                            ${membersHtml}
                        </div>
                    </div>

                    ${!isRemoved ? `
                        <div class="bg-white p-5 border border-parchmentDark rounded-sm shadow-sm">
                            <h4 class="text-xs uppercase tracking-wide font-bold text-sage mb-2 flex items-center justify-between">
                                Invite Others
                                <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
                            </h4>
                            <p class="text-sm text-forest opacity-80 mb-4">Share your exact family name, tag, and pincode so loved ones can search and join your book. They will need all three parts.</p>
                            <button onclick="shareFamilyInvite('${family.name}', '${family.tag}', '${family.pinCode || 'Hidden'}')" class="${getAppButtonClasses('primary', { fullWidth: true, size: 'lg' })}">
                                Share Invite Link
                            </button>
                        </div>
                    ` : ''}
                </div>
            `, [
                { text: 'Close', onClick: () => closeModal() },
                (!isRemoved && !isCreator) ? { text: 'Leave Family', danger: true, onClick: () => handleLeaveFamily(family.id) } : null
            ].filter(Boolean));
        }

        async function shareFamilyInvite(name, tag, pin) {
            const shareText = `Cook with me on Uculi!\n\nSearch my family book in the Profile section.\nFamily: ${name}\nTag: #${tag}\nPincode: ${pin}`;
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Join our Recipe Book',
                        text: shareText
                    });
                } catch (err) {
                    console.log('Share failed:', err);
                }
            } else {
                navigator.clipboard.writeText(shareText);
                showToast('Invite copied to clipboard!', 'clipboard-copy');
            }
        }

        async function removeFamilyMember(familyId, userId) {
            if (isCurrentUserFamilyReadOnly() || isCurrentUserSociallyIsolated()) {
                showToast('Family member changes are disabled for your account.', 'alert-circle', true);
                return;
            }
            if (!confirm('Are you sure you want to remove this member? They will have a 30-day grace period to download their shared recipes before losing access permanently.')) return;
            
            const fam = userFamilies.find(f => f.id === familyId);
            if (fam) {
                fam.memberIds = fam.memberIds.filter(id => id !== userId);
                if (!fam.removedMembers) fam.removedMembers = [];
                fam.removedMembers.push({
                    userId: userId,
                    removedAt: Date.now(),
                    acknowledged: false
                });
                saveData();
                
                showToast('Member removed successfully.', 'user-minus');
                closeModal();
                showFamilyDetails(familyId); // refresh
                renderProfile();
            }
        }

        async function handleLeaveFamily(familyId) {
            if (isCurrentUserFamilyReadOnly() || isCurrentUserSociallyIsolated()) {
                showToast('Family changes are disabled for your account.', 'alert-circle', true);
                return;
            }
            if (!confirm('Are you sure you want to leave this family? You will instantly lose access to all family recipes, and all your recipes shared to this family will be withdrawn.')) return;

            const fam = userFamilies.find(f => f.id === familyId);
            if (fam) {
                fam.memberIds = fam.memberIds.filter(id => id !== currentUser.uid);
                saveData();
                showToast('Left family successfully.', 'log-out');
                closeModal();
                renderProfile();
            }
        }

        // --- BACKGROUND CHECKS ---
        function checkFamilyRemovals() {
            if (!currentUser) return;
            
            // Look for any unacknowledged removals
            const unacknowledged = [];
            userFamilies.forEach(fam => {
                if (fam.removedMembers) {
                    const entry = fam.removedMembers.find(m => m.userId === currentUser.uid && !m.acknowledged);
                    if (entry) unacknowledged.push({ fam, entry });
                }
            });

            if (unacknowledged.length > 0) {
                const names = unacknowledged.map(u => u.fam.name).join(', ');
                createModal('Family Membership Update', `
                    <div class="space-y-4">
                        <div class="bg-coral text-white p-4 rounded-sm flex gap-3 text-sm shadow-sm mb-2 border border-coral/20">
                            <i data-lucide="alert-triangle" class="w-6 h-6 shrink-0 mt-0.5"></i>
                            <div>
                                <p class="font-bold text-lg mb-1">You were removed</p>
                                <p class="opacity-90 leading-relaxed">You have been removed from the following family group(s): <strong>${names}</strong>.</p>
                            </div>
                        </div>
                        <p class="text-sm text-forest font-semibold mt-4">You have a 30-day grace period from the date of removal to view and download (PDF) your favorite shared recipes, or duplicate them to your own account. After 30 days, your access will be permanently revoked.</p>
                        <p class="text-sm text-sage mt-2">Any recipes that you originally created and shared to this family have automatically been withdrawn from the group and return solely to you.</p>
                    </div>
                `, [{ text: 'I Understand', primary: true, onClick: () => {
                    unacknowledged.forEach(u => u.entry.acknowledged = true);
                    saveData();
                    closeModal();
                }}]);
            }
        }

        // --- FAVORITES & RATINGS ---
        function toggleFavorite(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;

            if (isRecipeAlwaysFavorite(recipe)) {
                showToast('Your own recipes always stay in favorites.', 'heart');
                return;
            }

            if (!userSettings.favorites) userSettings.favorites = [];
            const index = userSettings.favorites.indexOf(recipeId);
            if (index === -1) {
                userSettings.favorites.push(recipeId);
                showToast('Added to favorites!', 'heart');
            } else {
                userSettings.favorites.splice(index, 1);
                showToast('Removed from favorites', 'x-circle');
            }
            saveData();
            const btn = document.getElementById(`fav-btn-${recipeId}`);
            if (btn) {
                btn.classList.toggle('text-red-500');
                btn.classList.toggle('text-sage');
                lucide.createIcons();
            }
        }

        function setRating(recipeId, stars) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;
            if (!canRateRecipe(recipe)) {
                showToast('You cannot rate your own recipes.', 'star-off');
                return;
            }

            if (!userSettings.myRecipeRatings) userSettings.myRecipeRatings = {};
            userSettings.myRecipeRatings[recipeId] = stars;
            saveData();
            updateRatingDisplay(recipeId);
            showToast(`Rated ${stars} stars!`, 'star');
        }

        function updateRatingDisplay(recipeId) {
            const rating = userSettings.myRecipeRatings?.[recipeId] || 0;
            document.querySelectorAll(`.rating-star-${recipeId}`).forEach((star, idx) => {
                if (idx < rating) {
                    star.classList.remove('opacity-30');
                } else {
                    star.classList.add('opacity-30');
                }
            });
        }
        // --- PERSONAL NOTES ---
        function openNotesEditor(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;
            closeCompetingSheets();
            
            const currentNotes = recipe.personalNotes || '';
            const modal = document.getElementById('notes-modal');
            const textarea = document.getElementById('notes-textarea');
            const saveBtn = document.getElementById('notes-save-btn');
            
            textarea.value = currentNotes;
            modal.classList.remove('hidden', 'opacity-0');
            modal.firstElementChild?.classList.remove('scale-95');
            saveBtn.onclick = () => savePersonalNotes(recipeId);
        }
        
        function closeNotesEditor() {
            const modal = document.getElementById('notes-modal');
            modal.classList.add('hidden', 'opacity-0');
            modal.firstElementChild?.classList.add('scale-95');
        }
        
        function savePersonalNotes(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;
            
            const textarea = document.getElementById('notes-textarea');
            recipe.personalNotes = textarea.value;
            saveData();
            closeNotesEditor();
            showToast('Notes saved!', 'check-circle');
            if (currentView === 'index' && indexViewMode === 'book') {
                renderList();
                return;
            }
            const notesSection = document.getElementById(`notes-section-${recipeId}`);
            if (notesSection) {
                notesSection.innerHTML = recipe.personalNotes ? `<p class="text-sm text-forest mb-2"><strong>Your notes:</strong> ${recipe.personalNotes}</p>` : '';
            }
        }

        function requestRecipeDeletion(recipeId) {
            const recipe = recipes.find(entry => entry.id === recipeId);
            if (!recipe) return;

            if (recipe.pendingDeletionVote?.status === 'pending') {
                showToast('A deletion vote is already active for this recipe.', 'bell');
                showNotificationsModal();
                return;
            }

            const family = recipe.familyId ? getFamilyById(recipe.familyId) : null;
            const activeFamily = family && !(family.removedMembers || []).some(member => member.userId === currentUser?.uid) ? family : null;
            const familyMembers = Array.isArray(activeFamily?.memberIds) ? activeFamily.memberIds.filter(Boolean) : [];

            if (activeFamily && familyMembers.length > 1) {
                createModal('Start Deletion Vote', `
                    <div class="space-y-4">
                        <p class="text-sm font-semibold leading-relaxed text-forest">This recipe belongs to <strong>${escapeHTML(activeFamily.name)}</strong>. Deleting it requires family confirmation.</p>
                        <p class="text-sm font-semibold leading-relaxed text-sage">A vote notification will be created for all members. Any member can veto (X). If not all votes arrive within 72 hours, the recipe is deleted automatically unless someone vetoed.</p>
                    </div>
                `, [
                    { text: 'Cancel', onClick: () => closeModal() },
                    {
                        text: 'Start Vote',
                        primary: true,
                        onClick: () => {
                            const actorId = getCurrentActorId();
                            const expiresAtIso = new Date(Date.now() + familyDeletionVoteTimeoutMs).toISOString();
                            recipe.pendingDeletionVote = {
                                status: 'pending',
                                requestedAt: new Date().toISOString(),
                                requestedBy: actorId,
                                familyId: activeFamily.id,
                                requiredMemberIds: familyMembers,
                                votes: { [actorId]: 'approve' },
                                expiresAt: expiresAtIso
                            };

                            addFamilyNotification({
                                type: 'deletion-vote',
                                title: 'Deletion vote requested',
                                message: `Vote to delete "${recipe.title}" from ${activeFamily.name}.`,
                                familyId: activeFamily.id,
                                recipeId: recipe.id,
                                recipeTitle: recipe.title,
                                action: {
                                    kind: 'deletion-vote',
                                    expiresAt: expiresAtIso,
                                    requiredMemberIds: familyMembers,
                                    votes: { [actorId]: 'approve' }
                                }
                            });

                            saveData();
                            closeModal();
                            showToast('Deletion vote started. Open the bell to review votes.', 'bell');
                            renderDetail(recipe.id);
                        }
                    }
                ]);
                return;
            }

            createModal('Delete Recipe', `
                <div class="space-y-4">
                    <p class="text-sm font-semibold leading-relaxed text-forest">Are you sure you want to permanently delete <strong>${escapeHTML(recipe.title)}</strong>?</p>
                    <p class="text-xs font-bold uppercase tracking-[0.16em] text-red-500">Confirm to remove it from this device. Undo stays available for 5 minutes.</p>
                </div>
            `, [
                { text: 'Cancel', onClick: () => closeModal() },
                {
                    text: 'Delete',
                    danger: true,
                    onClick: () => {
                        const recipeTitle = recipe.title;
                        deleteRecipeNow(recipe.id, `Recipe "${recipeTitle}" deleted.`);
                        closeModal();
                        showToast('Recipe deleted. Undo available for 5 minutes.', 'trash-2');
                    }
                }
            ]);
        }

        function renderDetail(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            activeDetailRecipeId = id;
            chromeBackAction = 'list';
            setActiveNav('index');
            check12HourReset(recipe);
            currentScale = 1;

            const headerBg = recipe.profile || defaultPlaceholderProfile;
            const isSavedCommunityRecipe = recipe.source === 'published';
            const isOwnedRecipe = isRecipeOwnedByCurrentUser(recipe);
            const canEditExistingRecipe = isRecipeEditable(recipe);
            const recipeLocationLabel = getRecipeDetailLocationLabel(recipe);
            const recipeFamilyChip = getRecipeFamilyChipMarkup(recipe, 'text-[10px] font-bold px-2.5 py-1.5 rounded-sm uppercase tracking-[0.16em] border');
            const versionHistoryCount = Array.isArray(recipe.versionHistory) ? recipe.versionHistory.length : 0;
            const recipeVersionLabel = getPublishedVersionLabel(recipe);
            const recipeIsLive = isRecipePublishedLive(recipe);
            const recipeHasUnpublishedChanges = hasRecipeChangesSincePublish(recipe);
            const publishActionLabel = getPublishActionLabel(recipe);
            const deletionVoteProgress = getDeletionVoteProgress(recipe);
            const publishActionIcon = recipe.publicationState === 'pending-retract'
                ? 'clock-3'
                : (recipeIsLive ? 'cloud-off' : 'cloud-upload');
            const canAdminForceOffline = isCurrentUserAdmin() && recipeIsLive && Boolean(recipe.publishedId);
            const latestPublishedRecipe = isSavedCommunityRecipe ? getPublishedRecipeFromCache(recipe.publishedId) : null;
            const savedRecipeIsOutdated = isSavedCommunityRecipe ? isSavedPublishedRecipeOutdated(recipe) : false;
            const savedRecipeSourceRetracted = Boolean(isSavedCommunityRecipe && latestPublishedRecipe?.publicationState === 'retracted');
            const latestPublishedVersionLabel = latestPublishedRecipe ? getPublishedVersionLabel(latestPublishedRecipe) : '';
            const instructionCount = (recipe.instructions || []).length;
            const nextUnfinishedStepIndex = instructionCount > 0
                ? (recipe.instructions || []).findIndex((_, index) => !(recipe.checkedSteps || []).includes(index))
                : -1;
            const remainingStepCount = instructionCount > 0
                ? Math.max(0, instructionCount - ((recipe.checkedSteps || []).length || 0))
                : 0;
            const nextStepText = nextUnfinishedStepIndex >= 0
                ? applyMeasurementSystem(getRecipeInstructionText(recipe.instructions[nextUnfinishedStepIndex]))
                : '';
            const nextStepPreview = nextStepText.length > 140 ? `${nextStepText.slice(0, 137)}...` : nextStepText;
            const cookingSummary = instructionCount === 0
                ? 'Add instructions to unlock cooking mode.'
                : (nextUnfinishedStepIndex === -1
                    ? `All ${instructionCount} steps are checked off. You can re-read from step 1 or uncheck a step to continue.`
                    : `${remainingStepCount} step${remainingStepCount === 1 ? '' : 's'} left. Next up: ${escapeHTML(nextStepPreview)}`);
            const primarySupportActionClass = getAppButtonClasses('secondary', { size: 'md' });
            const primarySupportAction = canEditExistingRecipe
                ? `<button onclick="renderAddForm(${recipe.id})" class="${primarySupportActionClass}" translate="no"><i data-lucide="pencil-line" class="h-4 w-4 text-gold"></i>Edit recipe</button>`
                : `<button onclick="renderPublishedRecipeDetail('${recipe.publishedId}')" class="${primarySupportActionClass}"><i data-lucide="external-link" class="h-4 w-4 text-gold"></i>${savedRecipeIsOutdated ? 'Open latest' : 'Browse original'}</button>`;
            const publishDetailVariant = !isSavedCommunityRecipe && recipe.publishedId ? 'accent' : 'secondary';
            const detailActionButtonsMarkup = `
                <div class="detail-actions action-row">
                    ${savedRecipeIsOutdated ? renderDetailIconAction('Update warning', 'alert-circle', `toggleSavedRecipeUpdateNotice(${recipe.id})`, 'warning', '', true) : ''}
                    <button onclick="toggleCookingMode(${recipe.id})" class="detail-cook-toggle-btn inline-flex h-11 items-center justify-center gap-2 rounded-xl transition-all bg-gold text-white font-bold text-xs uppercase tracking-wider px-4 hover:bg-opacity-90">
                        <i id="focus-btn-icon" data-lucide="${isCookingMode ? 'x-circle' : 'chef-hat'}" class="h-4 w-4"></i>
                        <span id="focus-btn-text">${isCookingMode ? 'Exit Cooking' : 'Cook Mode'}</span>
                    </button>
                    ${primarySupportAction}
                    ${!isSavedCommunityRecipe && versionHistoryCount > 0 ? renderDetailIconAction(`History (${versionHistoryCount})`, 'history', `showRecipeVersionHistory(${recipe.id})`, 'secondary', '', true) : ''}
                    ${hasPremiumAccess()
                        ? renderDetailIconAction('Share', 'share-2', `shareRecipe(${recipe.id})`, 'secondary', '', true)
                        : renderDetailIconAction('Share', 'lock', "showPremiumModal('share recipes')", 'muted', '', true)}
                    ${hasPremiumAccess()
                        ? renderDetailIconAction('Export', 'download', `exportRecipeAsPDF(${recipe.id})`, 'secondary', '', true)
                        : renderDetailIconAction('Export', 'lock', "showPremiumModal('download recipe PDFs')", 'muted', '', true)}
                    ${isSavedCommunityRecipe ? '' : renderDetailIconAction(publishActionLabel, publishActionIcon, `publishRecipe(${recipe.id})`, publishDetailVariant, '', true)}
                    ${canAdminForceOffline ? renderDetailIconAction('Admin: offline now', 'shield-x', `adminForceOfflineRecipe(${recipe.id})`, 'danger', '', true) : ''}
                    ${deletionVoteProgress
                        ? renderDetailIconAction('Vote pending', 'bell-ring', 'showNotificationsModal()', 'warning', '', true)
                        : renderDetailIconAction('Delete', 'trash-2', `requestRecipeDeletion(${recipe.id})`, 'danger', '', true)}
                </div>
            `;

            if (isSavedCommunityRecipe) {
                queuePublishedRecipeStatusRefresh(recipe.id, recipe.publishedId);
            }

            contentDiv.innerHTML = `
                <div class="cook-mode-bar">
                    <button onclick="toggleCookingMode(${recipe.id})" id="cooking-mode-exit-btn" class="cooking-mode-exit-btn header-icon-button" aria-label="Back to recipe">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <p class="cook-mode-title">${escapeHTML(recipe.title)}</p>
                </div>
                <div class="detail-shell push-sheet bg-white rounded-sm shadow-sm mb-6 border border-parchmentDark relative w-full">
                    <div class="detail-hero-shell rounded-t-sm">
                        <div class="detail-hero-wash" aria-hidden="true">
                            <div class="detail-hero-wash-image" style="background-image: url('${headerBg}')"></div>
                        </div>
                        <div class="detail-hero-frame">
                            <div class="detail-hero-portrait" style="background-image: url('${headerBg}')"></div>
                            <div class="detail-hero-copy">
                                <p class="detail-hero-kicker">${recipeLocationLabel}</p>
                                <h2 class="detail-hero-title">${recipe.title}</h2>
                                <div class="detail-hero-meta">
                                    <span class="flex items-center gap-1"><i data-lucide="user" class="w-4 h-4"></i> ${recipe.author}</span>
                                    <span>|</span>
                                    <span class="flex items-center gap-1"><i data-lucide="map-pinned" class="w-4 h-4"></i> ${recipe.country || 'Unknown'}</span>
                                    ${isSavedCommunityRecipe ? `<span>|</span><span class="flex items-center gap-1"><i data-lucide="heart" class="w-4 h-4"></i> Community save${recipeVersionLabel ? ` ${recipeVersionLabel}` : ''}</span>` : ''}
                                    ${!isSavedCommunityRecipe && recipe.publishedId ? `<span>|</span><span class="flex items-center gap-1"><i data-lucide="${recipeIsLive ? 'cloud' : 'cloud-off'}" class="w-4 h-4"></i> ${recipeIsLive ? 'Live in Browse' : 'Removed from Browse'}${recipeVersionLabel ? ` ${recipeVersionLabel}` : ''}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="detail-hero-spacer"></div>

                    <div class="detail-content-shell p-4 md:p-10">
                        ${isCookingMode ? renderCookStage(recipe) : ''}

                            ${recipe.servings ? `<div class="text-center"><div class="flex justify-center mb-2"><i data-lucide="users" class="w-5 h-5 text-gold"></i></div><div class="text-xs uppercase font-bold text-sage">Servings</div><div class="text-lg font-bold text-forest">${recipe.servings}</div></div>` : ''}
                            ${recipe.difficulty ? `<div class="text-center"><div class="flex justify-center mb-2"><i data-lucide="zap" class="w-5 h-5 text-gold"></i></div><div class="text-xs uppercase font-bold text-sage">Difficulty</div><div class="text-lg font-bold text-forest">${recipe.difficulty}</div></div>` : ''}

                        </div>

                        <div class="mb-6 grid gap-4 xl:grid-cols-[minmax(0,1fr)_auto] xl:items-center">

                                ${recipe.diet && recipe.diet.length > 0 ? recipe.diet.map(d => `<span class="text-[10px] bg-gold bg-opacity-20 text-sage font-bold px-2.5 py-1.5 rounded-sm uppercase tracking-[0.16em]">${d}</span>`).join('') : ''}

            const rows = steps.map((step, index) => {
                const minutes = cookSession?.minutes?.[index] || getRecipeInstructionMinutes(step) || 1;
                return `

                        <p>${index + 1}. ${escapeHTML(getRecipeInstructionText(step))}</p>

            return `

                    </article>
                </section>
            `;
        }

        function formatCookAmount(value) {
            const rounded = Math.round(Number(value) * 1000) / 1000;
            if (!Number.isFinite(rounded)) return '';
            const sign = rounded < 0 ? '-' : '';
            const abs = Math.abs(rounded);
            const whole = Math.floor(abs + 1e-8);
            const fraction = abs - whole;
            const table = [[0.25, '1/4'], [1 / 3, '1/3'], [0.5, '1/2'], [2 / 3, '2/3'], [0.75, '3/4']];
            const match = table.find(([amount]) => Math.abs(fraction - amount) < 0.04);
            if (match) return whole === 0 ? `${sign}${match[1]}` : `${sign}${whole} ${match[1]}`;
            if (Math.abs(abs - Math.round(abs)) < 0.05) return `${sign}${Math.round(abs)}`;
            return `${sign}${String(Math.round(abs * 10) / 10).replace('.', ',')}`;
        }

        function scaleCookQuantityText(text, scale) {
            if (!text || scale === 1) return text;
            return String(text).replace(/(\d+)\s+(\d+)\s*\/\s*(\d+)|(\d+)\s*\/\s*(\d+)|(\d+(?:[.,]\d+)?)/g, (match, mixedWhole, mixedNum, mixedDen, fracNum, fracDen, plain) => {
                let value = NaN;
                if (mixedWhole !== undefined) {
                    const denominator = Number(mixedDen);
                    if (!denominator) return match;
                    value = Number(mixedWhole) + (Number(mixedNum) / denominator);
                } else if (fracNum !== undefined) {
                    const denominator = Number(fracDen);
                    if (!denominator) return match;
                    value = Number(fracNum) / denominator;
                } else {
                    value = Number(String(plain).replace(',', '.'));
                }
                if (!Number.isFinite(value)) return match;
                return formatCookAmount(value * scale);
            });
        }

        function formatScaleLabel(recipe) {
            const base = Number(recipe?.servings) || 4;
            const servings = formatCookAmount(base * currentScale);
            const factor = Number.isInteger(currentScale) ? String(currentScale) : String(Math.round(currentScale * 10) / 10);
            return `${factor}× · ${servings} servings`;
        }

        function setMealTypeButtonVisualState(button, isSelected) {

            button.classList.toggle('!text-white', isSelected);
            button.classList.toggle('!border-forest', isSelected);

        function hydrateMealTypeButtons(selectedMealTypes = []) {

            document.querySelectorAll('.meal-type-btn').forEach(button => {
                const type = String(button.dataset.mealType || '');
                setMealTypeButtonVisualState(button, selected.has(type));
            });

        function toggleMealTypeBtn(button) {
            if (!(button instanceof HTMLElement)) return;
            const currentlySelected = button.dataset.selected === 'true';
            if (!currentlySelected) {
                const selectedCount = document.querySelectorAll('.meal-type-btn[data-selected="true"]').length;
                if (selectedCount >= 2) {
                    showToast('You can select up to 2 meal types.', 'alert-circle');

            setMealTypeButtonVisualState(button, !currentlySelected);

        function setRecipeDetailsVisibility(isVisible) {

        function applyRecipeDetailFields(recipeData) {

            if (recipeData.cookTime !== undefined && recipeData.cookTime !== null) {

            if (recipeData.servings !== undefined && recipeData.servings !== null) {

            if (recipeData.cuisine) {
