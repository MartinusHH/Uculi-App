        function enterAppFromLanding(origin = 'landing-enter') {
            sessionStorage.setItem(landingSessionKey, '1');
            document.getElementById('app-landing')?.remove();
            trackLaunchEvent('appEntered');
            if (isAuthenticated && currentUser) {
                renderList();
                return;
            }
            if (origin === 'hero-enter' || origin === 'landing-enter') {
                authViewMode = 'register';
            }
            renderAuthGate();
        }

        const familyColorOptions = [
            { key: 'sage', name: 'Sage', hex: '#6d8a69', soft: 'rgba(109, 138, 105, 0.14)' },
            { key: 'gold', name: 'Gold', hex: '#c39a4d', soft: 'rgba(195, 154, 77, 0.16)' },
            { key: 'coral', name: 'Coral', hex: '#d97b63', soft: 'rgba(217, 123, 99, 0.15)' },
            { key: 'berry', name: 'Berry', hex: '#b45d7a', soft: 'rgba(180, 93, 122, 0.15)' },
            { key: 'ocean', name: 'Ocean', hex: '#4d84a8', soft: 'rgba(77, 132, 168, 0.14)' },
            { key: 'teal', name: 'Teal', hex: '#4f9b8f', soft: 'rgba(79, 155, 143, 0.14)' },
            { key: 'plum', name: 'Plum', hex: '#7a5ea8', soft: 'rgba(122, 94, 168, 0.15)' },
            { key: 'slate', name: 'Slate', hex: '#6c7a89', soft: 'rgba(108, 122, 137, 0.14)' }
        ];

        function getFamilyColorOption(colorKey = 'sage') {
            return familyColorOptions.find(option => option.key === colorKey) || familyColorOptions[0];
        }

        function normalizeFamilyRecord(family = {}) {
            const color = getFamilyColorOption(family.colorKey);
            return {
                ...family,
                name: String(family.name || 'Family book').trim(),
                colorKey: color.key,
                memberIds: Array.isArray(family.memberIds) ? family.memberIds.filter(Boolean) : [],
                removedMembers: Array.isArray(family.removedMembers) ? family.removedMembers : []
            };
        }

        function getActiveFamiliesForCurrentUser() {
            return (userFamilies || [])
                .map(normalizeFamilyRecord)
                .filter(family => !family.removedMembers.some(member => member.userId === currentUser?.uid));
        }

        function getCurrentActorId() {
            return currentUser?.uid || 'local-user';
        }

        function normalizeFamilyNotifications(notifications = []) {
            if (!Array.isArray(notifications)) return [];
            return notifications
                .filter(Boolean)
                .map((entry, index) => ({
                    id: String(entry.id || `notif-${Date.now()}-${index}`),
                    type: String(entry.type || 'family-update'),
                    title: String(entry.title || 'Family update'),
                    message: String(entry.message || ''),
                    createdAt: entry.createdAt || new Date().toISOString(),
                    readAt: entry.readAt || '',
                    resolvedAt: entry.resolvedAt || '',
                    familyId: entry.familyId || '',
                    recipeId: Number(entry.recipeId) || 0,
                    recipeTitle: String(entry.recipeTitle || ''),
                    action: entry.action && typeof entry.action === 'object'
                        ? {
                            kind: String(entry.action.kind || ''),
                            expiresAt: entry.action.expiresAt || '',
                            threshold: Number(entry.action.threshold) || 0,
                            requiredMemberIds: Array.isArray(entry.action.requiredMemberIds) ? entry.action.requiredMemberIds.filter(Boolean) : [],
                            votes: entry.action.votes && typeof entry.action.votes === 'object' ? { ...entry.action.votes } : {}
                        }
                        : null
                }))
                .sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime())
                .slice(0, 120);
        }

        function normalizeRecipeUndoEntry(entry = null) {
            if (!entry || typeof entry !== 'object') return null;
            const recipe = entry.recipe && typeof entry.recipe === 'object' ? entry.recipe : null;
            if (!recipe || !recipe.id) return null;

            const expiresAtMs = new Date(entry.expiresAt || 0).getTime();
            if (!Number.isFinite(expiresAtMs) || expiresAtMs <= Date.now()) return null;

            return {
                recipe,
                deletedAt: entry.deletedAt || new Date().toISOString(),
                expiresAt: entry.expiresAt,
                reason: String(entry.reason || '')
            };
        }

        function getActiveRecipeUndoEntry() {
            const normalized = normalizeRecipeUndoEntry(userSettings.recipeUndo);
            if (!normalized && userSettings.recipeUndo) {
                userSettings.recipeUndo = null;
                saveData();
            }
            return normalized;
        }

        function getFamilyNotifications() {
            userSettings.notifications = normalizeFamilyNotifications(userSettings.notifications);
            return userSettings.notifications;
        }

        function hasModerationNotifications() {
            return getFamilyNotifications().some(notification => notification.type === 'moderation-status' || notification.type === 'report-status');
        }

        function getUnreadFamilyNotificationCount() {
            return getFamilyNotifications().filter(notification => !notification.readAt).length;
        }

        function getPendingDeletionVoteActionCount() {
            const actorId = getCurrentActorId();
            return getFamilyNotifications().filter(notification => {
                if (notification.type !== 'deletion-vote') return false;
                if (notification.resolvedAt) return false;
                const action = notification.action;
                if (!action || action.kind !== 'deletion-vote') return false;
                if (new Date(action.expiresAt || 0).getTime() <= Date.now()) return false;
                return !action.votes?.[actorId];
            }).length;
        }

        function getPendingPublicationVoteActionCount() {
            const actorId = getCurrentActorId();
            return getFamilyNotifications().filter(notification => {
                if (notification.type !== 'publication-vote') return false;
                if (notification.resolvedAt) return false;
                const action = notification.action;
                if (!action || action.kind !== 'publication-vote') return false;
                if (new Date(action.expiresAt || 0).getTime() <= Date.now()) return false;
                return !action.votes?.[actorId];
            }).length;
        }

        function syncNotificationBell() {
            const button = document.getElementById('notifications-button');
            const badge = document.getElementById('notifications-badge');
            if (!button || !badge) return;

            const hasActiveFamilies = getActiveFamiliesForCurrentUser().length > 0;
            const shouldShowBell = hasActiveFamilies || hasModerationNotifications();
            button.classList.toggle('hidden', !shouldShowBell);
            button.classList.toggle('inline-flex', shouldShowBell);
            if (!shouldShowBell) {
                badge.classList.add('hidden');
                badge.textContent = '';
                return;
            }

            const unread = getUnreadFamilyNotificationCount();
            const pendingVotes = getPendingDeletionVoteActionCount() + getPendingPublicationVoteActionCount();
            const displayCount = Math.max(unread, pendingVotes);
            if (displayCount > 0) {
                badge.classList.remove('hidden');
                badge.textContent = displayCount > 99 ? '99+' : String(displayCount);
            } else {
                badge.classList.add('hidden');
                badge.textContent = '';
            }
        }

        function syncRecipeUndoButton() {
            const undoButton = document.getElementById('undo-delete-button');
            const undoLabel = document.getElementById('undo-delete-label');
            if (!undoButton) return;

            const undoEntry = getActiveRecipeUndoEntry();
            const shouldShow = Boolean(undoEntry);
            undoButton.classList.toggle('hidden', !shouldShow);
            undoButton.classList.toggle('inline-flex', shouldShow);
            if (shouldShow) {
                const msLeft = Math.max(0, new Date(undoEntry.expiresAt).getTime() - Date.now());
                const minutesLeft = Math.max(1, Math.ceil(msLeft / 60000));
                undoButton.title = `Undo last delete (${minutesLeft}m left)`;
                if (undoLabel) {
                    undoLabel.textContent = `Undo ${minutesLeft}m`;
                }
            } else {
                undoButton.title = 'Undo last delete';
                if (undoLabel) {
                    undoLabel.textContent = 'Undo';
                }
            }
        }

        function addFamilyNotification({ type, title, message, familyId = '', recipeId = 0, recipeTitle = '', action = null }) {
            if (!familyId) return;
            const activeFamilyIds = getActiveFamiliesForCurrentUser().map(family => family.id);
            if (!activeFamilyIds.includes(familyId)) return;

            const notifications = getFamilyNotifications();
            notifications.unshift({
                id: `notif-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                type: String(type || 'family-update'),
                title: String(title || 'Family update'),
                message: String(message || ''),
                createdAt: new Date().toISOString(),
                readAt: '',
                resolvedAt: '',
                familyId,
                recipeId: Number(recipeId) || 0,
                recipeTitle: String(recipeTitle || ''),
                action: action && typeof action === 'object' ? {
                    kind: String(action.kind || ''),
                    expiresAt: action.expiresAt || '',
                    threshold: Number(action.threshold) || 0,
                    requiredMemberIds: Array.isArray(action.requiredMemberIds) ? action.requiredMemberIds.filter(Boolean) : [],
                    votes: action.votes && typeof action.votes === 'object' ? { ...action.votes } : {}
                } : null
            });
            userSettings.notifications = notifications.slice(0, 120);
        }

        function addUserNotification({ type, title, message, action = null, recipeId = 0, recipeTitle = '' }) {
            const notifications = getFamilyNotifications();
            notifications.unshift({
                id: `notif-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                type: String(type || 'system-update'),
                title: String(title || 'Update'),
                message: String(message || ''),
                createdAt: new Date().toISOString(),
                readAt: '',
                resolvedAt: '',
                familyId: '',
                recipeId: Number(recipeId) || 0,
                recipeTitle: String(recipeTitle || ''),
                action: action && typeof action === 'object' ? {
                    kind: String(action.kind || ''),
                    expiresAt: action.expiresAt || '',
                    threshold: Number(action.threshold) || 0,
                    requiredMemberIds: Array.isArray(action.requiredMemberIds) ? action.requiredMemberIds.filter(Boolean) : [],
                    votes: action.votes && typeof action.votes === 'object' ? { ...action.votes } : {}
                } : null
            });
            userSettings.notifications = notifications.slice(0, 200);
            saveData();
            syncNotificationBell();
        }

        function markNotificationsAsRead() {
            const nowIso = new Date().toISOString();
            let changed = false;
            getFamilyNotifications().forEach(notification => {
                if (!notification.readAt) {
                    notification.readAt = nowIso;
                    changed = true;
                }
            });
            if (changed) saveData();
        }

        function resolveRecipeDeletionVoteNotifications(recipeId, resolutionMessage = '') {
            const nowIso = new Date().toISOString();
            let changed = false;
            getFamilyNotifications().forEach(notification => {
                if (notification.type !== 'deletion-vote' || notification.recipeId !== recipeId) return;
                if (!notification.resolvedAt) {
                    notification.resolvedAt = nowIso;
                    changed = true;
                }
                if (resolutionMessage) {
                    notification.message = resolutionMessage;
                    changed = true;
                }
            });
            if (changed) saveData();
        }

        function cleanupShoppingListForDeletedRecipe(recipeId, recipeTitle = '') {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            userSettings.shoppingList.items = (userSettings.shoppingList.items || []).filter(item => {
                if (!(item.sourceRecipeIds || []).includes(recipeId)) return true;
                const remainingRecipeIds = (item.sourceRecipeIds || []).filter(id => id !== recipeId);
                const remainingRecipeTitles = (item.sourceRecipeTitles || []).filter(title => title !== recipeTitle);
                if (remainingRecipeIds.length === 0 && item.kind !== 'custom') return false;
                item.sourceRecipeIds = remainingRecipeIds;
                item.sourceRecipeTitles = remainingRecipeTitles;
                item.occurrences = Math.max(1, remainingRecipeIds.length || remainingRecipeTitles.length || 1);
                item.updatedAt = new Date().toISOString();
                return true;
            });
        }

        function deleteRecipeNow(recipeId, reasonMessage = '') {
            const recipeIndex = recipes.findIndex(recipe => recipe.id === recipeId);
            if (recipeIndex === -1) return;

            const recipe = recipes[recipeIndex];
            const recipeSnapshot = JSON.parse(JSON.stringify(recipe));
            recipes.splice(recipeIndex, 1);
            userSettings.favorites = (userSettings.favorites || []).filter(id => id !== recipeId);
            cleanupShoppingListForDeletedRecipe(recipeId, recipe.title || '');
            resolveRecipeDeletionVoteNotifications(recipeId, reasonMessage);
            userSettings.recipeUndo = {
                recipe: recipeSnapshot,
                deletedAt: new Date().toISOString(),
                expiresAt: new Date(Date.now() + recipeDeleteUndoWindowMs).toISOString(),
                reason: reasonMessage || 'Recipe deleted'
            };

            const family = recipe.familyId ? getFamilyById(recipe.familyId) : null;
            if (family?.id) {
                addFamilyNotification({
                    type: 'family-recipe-deleted',
                    title: 'Family recipe deleted',
                    message: `"${recipe.title}" was deleted from ${family.name}.`,
                    familyId: family.id,
                    recipeId: recipe.id,
                    recipeTitle: recipe.title
                });
            }

            saveData();
            syncRecipeUndoButton();
            syncNotificationBell();

            if (currentView === 'detail') {
                renderList();
            } else if (currentView === 'shopping') {
                renderShoppingList();
            } else if (currentView === 'index') {
                renderList();
            }
        }

        function processRecipeDeletionVotes() {
            let didMutate = false;
            const now = Date.now();

            recipes.slice().forEach(recipe => {
                const vote = recipe?.pendingDeletionVote;
                if (!vote || vote.status !== 'pending') return;

                const requiredMemberIds = Array.isArray(vote.requiredMemberIds) ? vote.requiredMemberIds.filter(Boolean) : [];
                const votes = vote.votes && typeof vote.votes === 'object' ? vote.votes : {};
                const hasVeto = requiredMemberIds.some(memberId => votes[memberId] === 'reject');

                if (hasVeto) {
                    recipe.pendingDeletionVote.status = 'rejected';
                    resolveRecipeDeletionVoteNotifications(recipe.id, `Deletion vetoed for "${recipe.title}".`);
                    delete recipe.pendingDeletionVote;
                    didMutate = true;
                    return;
                }

                const everyoneApproved = requiredMemberIds.length > 0 && requiredMemberIds.every(memberId => votes[memberId] === 'approve');
                if (everyoneApproved) {
                    deleteRecipeNow(recipe.id, `All family votes approved deletion for "${recipe.title}".`);
                    didMutate = true;
                    return;
                }

                const expiresAt = new Date(vote.expiresAt || 0).getTime();
                if (Number.isFinite(expiresAt) && expiresAt > 0 && now >= expiresAt) {
                    deleteRecipeNow(recipe.id, `Deletion auto-approved after 72 hours for "${recipe.title}".`);
                    didMutate = true;
                }
            });

            if (didMutate) {
                saveData();
                syncRecipeUndoButton();
                syncNotificationBell();
            }
        }

        function processRecipePublicationVotes() {
            let didMutate = false;
            const now = Date.now();

            recipes.forEach(recipe => {
                const vote = recipe?.pendingPublicationVote;
                if (!vote || vote.status !== 'pending') return;

                const requiredMemberIds = Array.isArray(vote.requiredMemberIds) ? vote.requiredMemberIds.filter(Boolean) : [];
                const votes = vote.votes && typeof vote.votes === 'object' ? vote.votes : {};
                const approvals = requiredMemberIds.filter(memberId => votes[memberId] === 'approve').length;
                const threshold = Number(vote.threshold) > 0 ? Number(vote.threshold) : getPublicationApprovalThreshold(requiredMemberIds.length || 1);
                const expiresAt = new Date(vote.expiresAt || 0).getTime();
                const isExpired = Number.isFinite(expiresAt) && expiresAt > 0 ? now >= expiresAt : false;

                if (approvals >= threshold) {
                    recipe.pendingPublicationVote.status = 'approved';
                    delete recipe.pendingPublicationVote;
                    publishRecipe(recipe.id, { bypassFamilyVote: true });
                    didMutate = true;
                    return;
                }

                if (isExpired) {
                    recipe.pendingPublicationVote.status = 'expired';
                    resolveRecipePublicationVoteNotifications(recipe.id, `Publication vote expired for "${recipe.title}" (majority not reached). Save as personal to publish publicly.`);
                    delete recipe.pendingPublicationVote;
                    didMutate = true;
                }
            });

            if (didMutate) {
                saveData();
                syncNotificationBell();
            }
        }

        async function processScheduledPublicationRetractions() {
            if (!isAuthenticated || !firebaseInitialized || !currentUser) return;

            const dueRecipes = recipes.filter(recipe => {
                if (recipe?.publicationState !== 'pending-retract' || !recipe?.publishedId) return false;
                const retractionMs = new Date(recipe.scheduledRetractionAt || 0).getTime();
                return Number.isFinite(retractionMs) && retractionMs > 0 && Date.now() >= retractionMs;
            });

            for (const recipe of dueRecipes) {
                await unpublishRecipe(recipe.id, { source: 'scheduled' });
            }
        }

        function undoDeletedRecipe() {
            const undoEntry = getActiveRecipeUndoEntry();
            if (!undoEntry) {
                showToast('Undo window expired.', 'history');
                syncRecipeUndoButton();
                return;
            }

            const restoredRecipe = JSON.parse(JSON.stringify(undoEntry.recipe));
            if (recipes.some(recipe => recipe.id === restoredRecipe.id)) {
                restoredRecipe.id = generateId();
            }
            if (restoredRecipe.pendingDeletionVote) {
                delete restoredRecipe.pendingDeletionVote;
            }

            recipes.push(restoredRecipe);
            userSettings.recipeUndo = null;

            const family = restoredRecipe.familyId ? getFamilyById(restoredRecipe.familyId) : null;
            if (family?.id) {
                addFamilyNotification({
                    type: 'family-recipe-restored',
                    title: 'Family recipe restored',
                    message: `"${restoredRecipe.title}" was restored after deletion.`,
                    familyId: family.id,
                    recipeId: restoredRecipe.id,
                    recipeTitle: restoredRecipe.title
                });
            }

            saveData();
            syncRecipeUndoButton();
            syncNotificationBell();
            showToast('Recipe restored.', 'rotate-ccw');
            renderDetail(restoredRecipe.id);
        }

        function getDeletionVoteProgress(recipe) {
            const vote = recipe?.pendingDeletionVote;
            if (!vote || vote.status !== 'pending') return null;
            const requiredMemberIds = Array.isArray(vote.requiredMemberIds) ? vote.requiredMemberIds.filter(Boolean) : [];
            const votes = vote.votes && typeof vote.votes === 'object' ? vote.votes : {};
            const approved = requiredMemberIds.filter(memberId => votes[memberId] === 'approve').length;
            const rejected = requiredMemberIds.filter(memberId => votes[memberId] === 'reject').length;
            return {
                approved,
                rejected,
                total: requiredMemberIds.length,
                expiresAt: vote.expiresAt
            };

        function renderNotificationMarkup(notification) {
            const actorId = getCurrentActorId();
            const hasAction = notification?.action?.kind === 'deletion-vote' || notification?.action?.kind === 'publication-vote';
            const action = notification.action || null;
            const actionKind = action?.kind || '';
            const actorVote = action?.votes?.[actorId] || '';
            const expiresAtMs = new Date(action?.expiresAt || 0).getTime();
            const isExpired = Number.isFinite(expiresAtMs) && expiresAtMs > 0 ? Date.now() >= expiresAtMs : false;
            const canVote = hasAction && !notification.resolvedAt && !actorVote && !isExpired;
            const votes = action?.votes && typeof action.votes === 'object' ? action.votes : {};
            const required = Array.isArray(action?.requiredMemberIds) ? action.requiredMemberIds : [];
            const approvals = required.filter(memberId => votes[memberId] === 'approve').length;
            const vetoes = required.filter(memberId => votes[memberId] === 'reject').length;
            const threshold = Number(action?.threshold) > 0 ? Number(action.threshold) : (required.length > 0 ? getPublicationApprovalThreshold(required.length) : 1);
            const voteLabel = actionKind === 'publication-vote'
                ? `Votes: ${approvals}/${required.length} approved (need ${threshold})${vetoes ? `, ${vetoes} reject` : ''}`
                : `Votes: ${approvals}/${required.length} approved${vetoes ? `, ${vetoes} veto` : ''}`;
            const userVoteLabel = actorVote === 'approve' ? 'Approved' : 'Rejected';

            return `
                <div class="rounded-xl border border-parchmentDark bg-white p-4 shadow-sm">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-sage">${escapeHTML(notification.title)}</p>
                            <p class="mt-1 text-sm font-semibold text-forest">${escapeHTML(notification.message || 'No details available.')}</p>
                            ${notification.recipeTitle ? `<p class="mt-2 text-xs font-bold uppercase tracking-[0.16em] text-sage">Recipe: ${escapeHTML(notification.recipeTitle)}</p>` : ''}
                        </div>
                        ${notification.resolvedAt ? '<span class="rounded-full border border-parchmentDark bg-parchment px-2 py-1 text-[10px] font-bold uppercase tracking-[0.16em] text-sage">Resolved</span>' : ''}
                    </div>
                    ${hasAction ? `
                        <div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-xs font-semibold text-sage">
                            <span>${voteLabel}</span>
                            <span>${isExpired ? 'Expired' : `Deadline: ${new Date(action.expiresAt).toLocaleString()}`}</span>
                        </div>
                        ${canVote ? `
                            <div class="mt-3 flex items-center gap-2">
                                <button type="button" onclick="respondToFamilyVote('${notification.id}', 'approve')" class="inline-flex h-10 items-center justify-center rounded-lg border border-forest bg-white px-4 text-sm font-bold text-forest shadow-sm transition-all hover:bg-forest hover:text-white">Approve</button>
                                <button type="button" onclick="respondToFamilyVote('${notification.id}', 'reject')" class="inline-flex h-10 items-center justify-center rounded-lg border border-red-300 bg-white px-4 text-sm font-bold text-red-500 shadow-sm transition-all hover:border-red-500 hover:text-red-600">Reject</button>
                            </div>
                        ` : actorVote ? `<p class="mt-3 text-xs font-bold uppercase tracking-[0.16em] ${actorVote === 'approve' ? 'text-forest' : 'text-red-500'}">Your vote: ${userVoteLabel}</p>` : ''}

            `;

        function showNotificationsModal() {
            const hasFamilies = getActiveFamiliesForCurrentUser().length > 0;
            const hasModeration = hasModerationNotifications();
            if (!hasFamilies && !hasModeration) {
                showToast('No notifications right now.', 'bell-off');
                return;

            processScheduledPublicationRetractions();
            processRecipePublicationVotes();
            processRecipeDeletionVotes();
            markNotificationsAsRead();
            const notifications = getFamilyNotifications();
            const markup = notifications.length > 0
                ? notifications.map(renderNotificationMarkup).join('')
                : '<div class="rounded-xl border border-parchmentDark bg-parchment p-5 text-sm font-semibold text-sage">No notifications yet.</div>';

            if (activeNotificationsModalId) {

                activeNotificationsModalId = null;

            activeNotificationsModalId = createModal('Notifications', `
                <div class="space-y-3 max-h-[65vh] overflow-y-auto">${markup}</div>

        function respondToFamilyVote(notificationId, decision) {
            const notifications = getFamilyNotifications();
            const notification = notifications.find(entry => entry.id === notificationId);
            const isDeletionVote = notification?.type === 'deletion-vote';
            const isPublicationVote = notification?.type === 'publication-vote';
            if (!notification || (!isDeletionVote && !isPublicationVote)) return;

            const recipe = recipes.find(entry => entry.id === notification.recipeId);
            const pendingVote = isDeletionVote ? recipe?.pendingDeletionVote : recipe?.pendingPublicationVote;

            if (!recipe || !pendingVote || pendingVote.status !== 'pending') {
                notification.resolvedAt = new Date().toISOString();
                notification.message = `${isPublicationVote ? 'Publication' : 'Deletion'} vote closed for "${notification.recipeTitle || 'recipe'}".`;
                saveData();
                showNotificationsModal();
                return;
            }

            const actorId = getCurrentActorId();
            pendingVote.votes = pendingVote.votes || {};
            pendingVote.votes[actorId] = decision;

            notification.action = notification.action || { kind: isPublicationVote ? 'publication-vote' : 'deletion-vote', votes: {} };
            notification.action.votes = notification.action.votes || {};
            notification.action.votes[actorId] = decision;
            notification.readAt = new Date().toISOString();

            saveData();
            if (isPublicationVote) {
                processRecipePublicationVotes();
            } else {
                processRecipeDeletionVotes();
            }

            if (decision === 'approve' && isPublicationVote) {
                showToast('Publication vote approved.', 'check-circle');
            } else if (decision === 'approve') {
                showToast('Deletion vote approved.', 'check-circle');
            } else if (isPublicationVote) {
                showToast('Publication vote rejected.', 'x-circle');
            } else {
                showToast('Deletion vetoed. Recipe stays in the family book.', 'x-circle');
            }
            showNotificationsModal();
        }

        function respondToDeletionVote(notificationId, decision) {

        function hexToRgba(hex, alpha = 1) {
            const normalized = String(hex || '').replace('#', '').trim();
            if (normalized.length !== 6) return `rgba(109, 138, 105, ${alpha})`;

            const red = Number.parseInt(normalized.slice(0, 2), 16);
            const green = Number.parseInt(normalized.slice(2, 4), 16);
            const blue = Number.parseInt(normalized.slice(4, 6), 16);
            return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
        }

        function buildRecipeVersionSnapshot(recipe = {}) {
            return {
                snapshotId: `recipe-version-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                capturedAt: new Date().toISOString(),
                title: recipe.title || '',
                author: recipe.author || 'Unknown',
                category: recipe.category || '',
                country: recipe.country || '',
                familyId: recipe.familyId || '',
                familyName: recipe.familyName || '',

                cookTime: Number(recipe.cookTime) || 0,

                difficulty: recipe.difficulty || '',

                cuisine: recipe.cuisine || '',
                ingredients: Array.isArray(recipe.ingredients) ? [...recipe.ingredients] : [],
                instructions: normalizeRecipeInstructions(recipe.instructions),
                tips: recipe.tips || ''
            };
        }

        function buildRecipeVersionSignature(recipe = {}) {
            return JSON.stringify(buildRecipeVersionSnapshot(recipe));
        }

        function getUpdatedRecipeVersionHistory(existingRecipe, nextRecipePayload) {
            const priorHistory = Array.isArray(existingRecipe?.versionHistory) ? existingRecipe.versionHistory : [];
            if (!existingRecipe) return priorHistory.slice(0, 5);

            const previousSignature = buildRecipeVersionSignature(existingRecipe);
            const nextSignature = buildRecipeVersionSignature(nextRecipePayload);
            if (previousSignature === nextSignature) return priorHistory.slice(0, 5);

            const previousSnapshot = {
                ...buildRecipeVersionSnapshot(existingRecipe),
                signature: previousSignature
            };

            const filteredHistory = priorHistory.filter(entry => entry.signature !== previousSignature);
            return [previousSnapshot, ...filteredHistory].slice(0, 5);
        }

        function handleImageUpload(event, targetElementId, targetVarName, isUserSetting = false) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const base64 = canvas.toDataURL('image/jpeg', 0.8);
                        document.getElementById(targetElementId).style.backgroundImage = `url(${base64})`;
                        document.getElementById(targetElementId).innerHTML = ''; 
                        if(isUserSetting) userSettings[targetVarName] = base64;
                        else window[targetVarName] = base64;
                    };
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function analyzeProfileBannerTone(imageUrl) {
            if (!imageUrl || profileBannerToneCache[imageUrl] || profileBannerTonePending[imageUrl]) return;
            profileBannerTonePending[imageUrl] = true;

            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = () => {
                let tone = 'light';
                try {
                    const canvas = document.createElement('canvas');
                    const sampleWidth = 32;
                    const sampleHeight = 18;
                    canvas.width = sampleWidth;
                    canvas.height = sampleHeight;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    if (!ctx) throw new Error('Canvas context unavailable');

                    ctx.drawImage(img, 0, 0, sampleWidth, sampleHeight);
                    const data = ctx.getImageData(0, 0, sampleWidth, sampleHeight).data;

                    let brightnessSum = 0;
                    let pixelCount = 0;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        brightnessSum += (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                        pixelCount += 1;
                    }

                    const avgBrightness = pixelCount ? (brightnessSum / pixelCount) : 1;
                    tone = avgBrightness < 0.5 ? 'dark' : 'light';
                } catch (error) {
                    tone = 'light';
                }

                profileBannerToneCache[imageUrl] = tone;
                delete profileBannerTonePending[imageUrl];

                if (currentView === 'profile') {
                    renderProfile();
                }
            };

            img.onerror = () => {
                profileBannerToneCache[imageUrl] = 'light';
                delete profileBannerTonePending[imageUrl];
            };

            img.src = imageUrl;
        }

        function showInteractiveTutorial(step = 0, manualOpen = false) {
            const tourSteps = [
                {
                    title: 'Welkom bij Uculi',
                    body: 'Dit is je persoonlijke receptenarchief. We nemen je in 4 stappen mee langs de belangrijkste onderdelen.',
                    icon: 'sparkles',
                    target: null
                },
                {
                    title: 'Recept toevoegen',
                    body: 'Tap op "Add Recipe" om een nieuw recept te maken. Je voegt ingrediënten, stappen en notities toe. Probeer hem na deze rondleiding!',
                    icon: 'plus-circle',
                    target: 'button[onclick="renderAddForm()"]',
                    position: 'below'
                },
                {
                    title: 'Navigatie',
                    body: 'Via de tabbladen onderaan schakel je tussen Recepten, Shop, Browse en Profiel.',
                    icon: 'navigation',
                    target: '#main-nav',
                    position: 'above'
                },
                {
                    title: 'Instellingen',
                    body: 'Opties open je via het tandwiel. Daar staan account, taal en backup.',
                    icon: 'settings-2',
                    target: '#header-open-settings',
                    position: 'above'
                }
            ];

            const numSteps = tourSteps.length;

            // If we've gone past the last step, finish.
            if (Number(step) >= numSteps) {
                completeInteractiveTutorial();
                return;
            }

            const safeStep = Math.max(0, Math.min(numSteps - 1, Number(step) || 0));
            const current = tourSteps[safeStep];
            const isLast = safeStep === numSteps - 1;
            const PAD = 10;

            // Remove any existing tour element (prevents stacking)
            document.getElementById('uculi-tour')?.remove();

            const targetEl = current.target ? document.querySelector(current.target) : null;
            const rect = targetEl ? targetEl.getBoundingClientRect() : null;

            // Spotlight style: box-shadow "punches a hole" through the backdrop
            let backdropHtml = '';
            let tooltipPosStyle = '';

            if (rect) {
                const sl = rect.left - PAD;
                const st = rect.top - PAD;
                const sw = rect.width + PAD * 2;
                const sh = rect.height + PAD * 2;
                backdropHtml = `<div style="position:fixed;pointer-events:none;left:${sl}px;top:${st}px;width:${sw}px;height:${sh}px;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,0.60);z-index:301;"></div>`;

                const tooltipWidth = Math.min(340, window.innerWidth - 16);
                const rawLeft = Math.min(Math.max(8, rect.left), window.innerWidth - tooltipWidth - 8);
                if (current.position === 'above') {
                    tooltipPosStyle = `left:${rawLeft}px;bottom:${window.innerHeight - (rect.top - PAD - 12)}px;`;
                } else {
                    tooltipPosStyle = `left:${rawLeft}px;top:${rect.bottom + PAD + 12}px;`;
                }
            } else {
                // No target: full dimmed backdrop + centered tooltip
                backdropHtml = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.60);z-index:301;pointer-events:none;"></div>`;
                tooltipPosStyle = 'left:50%;top:50%;transform:translate(-50%,-50%);';
            }

            const dots = tourSteps.map((_, i) =>
                `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${i === safeStep ? '#1c1410' : 'rgba(0,0,0,0.18)'}"></span>`
            ).join('');

            const nextBtn = isLast
                ? `<button onclick="showInteractiveTutorial(${safeStep + 1}, ${manualOpen})" style="display:flex;align-items:center;gap:6px;background:#1c1410;color:#fff;border:none;border-radius:12px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;">
                        <i data-lucide="check" style="width:16px;height:16px;"></i> Klaar
                   </button>`
                : `<button onclick="showInteractiveTutorial(${safeStep + 1}, ${manualOpen})" style="display:flex;align-items:center;gap:6px;background:#1c1410;color:#fff;border:none;border-radius:12px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;">
                        Volgende <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
                   </button>`;

            const tourHtml = `
                <div id="uculi-tour" style="position:fixed;inset:0;z-index:300;pointer-events:none;">
                    ${backdropHtml}
                    <div style="position:fixed;${tooltipPosStyle}pointer-events:all;width:min(340px,calc(100vw - 16px));background:#fff;border:1px solid #E5DDD0;border-radius:20px;box-shadow:0 24px 48px rgba(0,0,0,0.18);overflow:hidden;z-index:302;">
                        <div style="background:#F7F1E8;padding:14px 16px;border-bottom:1px solid #E5DDD0;display:flex;align-items:center;gap:10px;">
                            <i data-lucide="${current.icon}" style="width:20px;height:20px;color:#C8972A;flex-shrink:0;"></i>
                            <span style="font-family:serif;font-weight:700;font-size:17px;color:#1c1410;flex:1;">${current.title}</span>
                            <span style="font-size:11px;font-weight:700;color:#7A8C6E;white-space:nowrap;">${safeStep + 1} / ${numSteps}</span>
                        </div>
                        <div style="padding:14px 16px;">
                            <p style="font-size:14px;font-weight:600;color:#1c1410;line-height:1.55;margin:0;">${current.body}</p>
                        </div>
                        <div style="padding:0 16px 14px;display:flex;align-items:center;gap:8px;">
                            <div style="display:flex;gap:5px;align-items:center;">${dots}</div>
                            <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
                                <button onclick="skipInteractiveTutorial()" style="background:none;border:none;font-size:13px;font-weight:700;color:#7A8C6E;cursor:pointer;padding:8px 10px;border-radius:10px;">Overslaan</button>
                                ${nextBtn}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', tourHtml);
            lucide.createIcons();
        }

        function getRecipeDietCoverage(recipe) {
            const coverage = new Set();
            (recipe?.diet || []).filter(Boolean).forEach(tag => {
                const supportedTag = dietOptions.find(option => option.toLowerCase() === String(tag).toLowerCase()) || tag;
                (dietCompatibilityMap[supportedTag] || [supportedTag]).forEach(mappedTag => coverage.add(mappedTag));
            });
            return coverage;
        }

        function doesRecipeMatchDietFilters(recipe) {
            if (dietFilter.length === 0) return true;
            const coverage = getRecipeDietCoverage(recipe);
            return dietFilter.every(selectedDiet => coverage.has(selectedDiet));
        }

        function resetRecipeFilters() {
            searchQuery = "";
            categoryFilter = "";
            difficultyFilter = "";
            dietFilter = [];
            showDietFilters = false;
            showDietGuide = false;
            cuisineFilter = "";
            mealTypeFilter = [];
            collectionScopeFilter = 'all';
            showFavoritesOnly = false;
            renderList();
        }

        function normalizeCollectionScopeFilter(scope = collectionScopeFilter) {
            return ['mine', 'saved'].includes(scope) ? scope : 'all';
        }

        function getCollectionScopeLabel(scope = collectionScopeFilter) {
            switch (normalizeCollectionScopeFilter(scope)) {
                case 'mine':
                    return 'Mine';
                case 'saved':
                    return 'Saved';
                default:
                    return 'All recipes';
            }
        }

        function recipeNeedsAttention(recipe) {
            if (!recipe) return false;
            if (recipe.source === 'published') return isSavedPublishedRecipeOutdated(recipe);
            if (!recipe.publishedId) return false;
            return hasRecipeChangesSincePublish(recipe) || !isRecipePublishedLive(recipe);
        }

        function doesRecipeMatchCollectionScope(recipe) {
            switch (normalizeCollectionScopeFilter(collectionScopeFilter)) {
                case 'mine':
                    return recipe?.source !== 'published';
                case 'saved':
                    return recipe?.source === 'published';
                default:
                    return true;
            }
        }

        function setIndexViewMode(mode) {

            if (nextMode === 'book' && requirePremiumFeature('notebookMode')) {
                return;
            }
            const enteringBookMode = nextMode === 'book' && indexViewMode !== 'book';
            indexViewMode = nextMode;
            userSettings.indexViewMode = nextMode;
            if (enteringBookMode) {
                notebookCoverOpen = false;
                notebookSpreadPageIndex = 0;
            }
            if (nextMode === 'book') {
                showListSearch = false;
                showListFilters = false;
                showDietFilters = false;
                showDietGuide = false;
            }
            if (nextMode === 'book' && notebookPageIndex >= currentIndexRecipeIds.length) {

        function openNotebookCover(skipAnimate = false) {
            activeNotebookStickyNoteMenu = null;
            const coverSurface = document.getElementById('notebook-cover-surface');
            if (!skipAnimate && coverSurface) {
                coverSurface.style.transition = 'transform 320ms cubic-bezier(0.2, 0.72, 0.18, 1)';
                coverSurface.style.transform = 'translateX(-18px) rotateY(-162deg)';
                window.setTimeout(() => openNotebookCover(true), 270);
                return;
            }

            notebookCoverOpen = true;
            notebookSpreadPageIndex = 0;
            notebookMobileSide = 'left';
            renderList();
            contentDiv.scrollTop = 0;
        }

        function chunkNotebookEntries(items, chunkSize) {
            if (!Array.isArray(items) || items.length === 0) return [];

            const safeChunkSize = Math.max(1, chunkSize || 1);
            const chunks = [];
            for (let index = 0; index < items.length; index += safeChunkSize) {
                chunks.push(items.slice(index, index + safeChunkSize));
            }
            return chunks;
        }

        function isNotebookShortViewport() {
            const viewportHeight = contentDiv?.clientHeight || window.innerHeight || 0;
            return viewportHeight > 0 && viewportHeight < 760;
        }

        function getNotebookRecipeSpreads(recipe) {
            if (!recipe) return [{ left: { kind: 'blank' }, right: { kind: 'blank' } }];

            const isCompactNotebook = window.matchMedia('(max-width: 767px)').matches;
            const isShortNotebook = isNotebookShortViewport();
            const overviewIngredientCount = isShortNotebook ? 2 : (isCompactNotebook ? 4 : 5);
            const extraIngredientPageSize = isShortNotebook ? 3 : (isCompactNotebook ? 5 : 7);
            const firstInstructionPageSize = isShortNotebook ? 2 : (isCompactNotebook ? 3 : 4);
            const extraInstructionPageSize = isShortNotebook ? 3 : (isCompactNotebook ? 4 : 5);
            const ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients : [];
            const instructions = normalizeRecipeInstructions(recipe.instructions || []);
            const noteBlocks = [];

            if (recipe.tips) {
                noteBlocks.push({
                    title: "Chef's notes",
                    text: applyMeasurementSystem(recipe.tips)
                });
            }

            if (recipe.personalNotes) {
                noteBlocks.push({
                    title: 'Your notes',
                    text: applyMeasurementSystem(recipe.personalNotes)
                });
            }

            const overviewIngredients = ingredients.slice(0, overviewIngredientCount);
            const remainingIngredientChunks = chunkNotebookEntries(ingredients.slice(overviewIngredientCount), extraIngredientPageSize);
            const firstInstructionChunk = instructions.slice(0, firstInstructionPageSize);
            const remainingInstructionChunks = chunkNotebookEntries(instructions.slice(firstInstructionChunk.length), extraInstructionPageSize);
            const noteChunks = chunkNotebookEntries(noteBlocks, isCompactNotebook ? 1 : 2);

            const leftPages = [{
                kind: 'overview',
                ingredients: overviewIngredients,
                remainingIngredients: Math.max(0, ingredients.length - overviewIngredients.length)
            }];

            remainingIngredientChunks.forEach((chunk, index) => {
                leftPages.push({
                    kind: 'ingredients',
                    ingredients: chunk,
                    startIndex: overviewIngredients.length + (index * extraIngredientPageSize)
                });
            });

            const rightPages = [];
            if (instructions.length > 0) {
                rightPages.push({
                    kind: 'instructions',
                    instructions: firstInstructionChunk,
                    startIndex: 0,
                    showMeta: true
                });

                let instructionStartIndex = firstInstructionChunk.length;
                remainingInstructionChunks.forEach(chunk => {
                    rightPages.push({
                        kind: 'instructions',
                        instructions: chunk,
                        startIndex: instructionStartIndex,
                        showMeta: false
                    });
                    instructionStartIndex += chunk.length;
                });
            } else {
                rightPages.push({
                    kind: 'notes',
                    notes: noteChunks.shift() || [],
                    showMeta: true,
                    showDiet: true
                });
            }

            while (noteChunks.length > 0) {
                if (leftPages.length <= rightPages.length) {
                    leftPages.push({ kind: 'notes', notes: noteChunks.shift() });
                } else {
                    rightPages.push({ kind: 'notes', notes: noteChunks.shift() });
                }
            }

            const spreadCount = Math.max(leftPages.length, rightPages.length, 1);
            const spreads = Array.from({ length: spreadCount }, (_, index) => ({
                left: leftPages[index] || { kind: 'blank' },
                right: rightPages[index] || { kind: 'blank' }
            }));

            const lastSpread = spreads[spreads.length - 1];
            if (lastSpread) {
                if (lastSpread.right.kind === 'instructions' || lastSpread.right.kind === 'notes') {
                    lastSpread.right.showDiet = true;
                } else {
                    lastSpread.left.showDiet = true;
                }
            }

            return spreads;
        }

        function applyNotebookPhoneFrame(element) {
            if (!element) return;
            element.style.width = '100%';
            element.style.maxWidth = '100%';
            element.style.height = 'auto';
            element.style.minHeight = '0';
            element.style.maxHeight = 'none';
            element.style.aspectRatio = '1 / 1.414';
        }

        function syncNotebookViewportHeight() {
            if (!contentDiv || currentView !== 'index' || indexViewMode !== 'book') return;

            const notebookFrame = contentDiv.querySelector('[data-notebook-frame]');
            const notebookSurface = notebookFrame?.querySelector('.notebook-book-spread-surface');
            const coverSurface = contentDiv.querySelector('#notebook-cover-surface');

            if (window.innerWidth < 768) {
                const coverFrame = coverSurface?.closest('.notebook-landing-cover-frame');
                if (coverFrame) {
                    coverFrame.style.width = '100%';
                    coverFrame.style.maxWidth = '100%';
                }
                applyNotebookPhoneFrame(notebookSurface);
                applyNotebookPhoneFrame(coverSurface);
                return;
            }

            if (!notebookFrame || !notebookSurface) return;

            const frameRect = notebookFrame.getBoundingClientRect();
            const navRect = document.getElementById('main-nav')?.getBoundingClientRect();
            const viewportHeight = Math.floor(window.visualViewport?.height || window.innerHeight || 0);
            const bottomLimit = navRect ? Math.min(navRect.top, viewportHeight) : viewportHeight;
            const bottomReserve = 20;
            const fallbackHeight = 560;
            const minHeight = 360;
            const availableHeight = Math.max(minHeight, Math.floor(bottomLimit - frameRect.top - bottomReserve));
            let fittedHeight = availableHeight || fallbackHeight;

            const fittedWidth = Math.max(320, Math.floor(notebookFrame.clientWidth));

            notebookFrame.style.setProperty('--notebook-spread-max-height', `${fittedHeight}px`);
            notebookFrame.style.setProperty('--notebook-spread-fit-width', `${fittedWidth}px`);
            notebookSurface.style.width = '100%';
            notebookSurface.style.maxWidth = '100%';
            notebookSurface.style.aspectRatio = 'auto';
            notebookSurface.style.height = `${fittedHeight}px`;
            notebookSurface.style.minHeight = `${fittedHeight}px`;
        }

        function nudgeNotebookPage(direction) {
            const surface = document.getElementById('notebook-swipe-surface');
            if (!surface) return;
            surface.classList.remove('is-turning-blocked-forward', 'is-turning-blocked-back');
            void surface.offsetWidth;
            surface.classList.add(direction > 0 ? 'is-turning-blocked-forward' : 'is-turning-blocked-back');
        }

        function finishNotebookPageTurn() {
            renderList();
            if (contentDiv) contentDiv.scrollTop = 0;
        }

        function goToNotebookPage(direction) {
            if (!currentIndexRecipeIds.length) return;
            const step = direction > 0 ? 1 : -1;

            const isMobile = window.innerWidth < 768;
            if (isMobile) {
                if (step > 0 && notebookMobileSide === 'left') {
                    activeNotebookStickyNoteMenu = null;
                    notebookPageTurnDirection = 1;
                    notebookMobileSide = 'right';
                    finishNotebookPageTurn();
                    return;
                }
                if (step < 0 && notebookMobileSide === 'right') {
                    activeNotebookStickyNoteMenu = null;
                    notebookPageTurnDirection = -1;
                    notebookMobileSide = 'left';
                    finishNotebookPageTurn();
                    return;
                }
            }

            const currentRecipe = recipes.find(item => item.id === currentIndexRecipeIds[notebookPageIndex]);
            const currentRecipeSpreads = getNotebookRecipeSpreads(currentRecipe);
            const nextSpreadIndex = notebookSpreadPageIndex + step;

            if (nextSpreadIndex >= 0 && nextSpreadIndex < currentRecipeSpreads.length) {
                activeNotebookStickyNoteMenu = null;
                notebookPageTurnDirection = step;
                notebookSpreadPageIndex = nextSpreadIndex;
                notebookMobileSide = step > 0 ? 'left' : 'right';
                finishNotebookPageTurn();
                return;
            }

            const nextIndex = Math.max(0, Math.min(notebookPageIndex + step, currentIndexRecipeIds.length - 1));
            if (nextIndex === notebookPageIndex) {
                nudgeNotebookPage(step);
                return;
            }

            activeNotebookStickyNoteMenu = null;
            notebookPageTurnDirection = step;
            notebookPageIndex = nextIndex;
            const nextRecipe = recipes.find(item => item.id === currentIndexRecipeIds[nextIndex]);
            const nextRecipeSpreads = getNotebookRecipeSpreads(nextRecipe);
            notebookSpreadPageIndex = step > 0 ? 0 : Math.max(0, nextRecipeSpreads.length - 1);
            notebookMobileSide = step > 0 ? 'left' : 'right';
            finishNotebookPageTurn();
        }

        document.addEventListener('keydown', event => {
            if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
            if (currentView !== 'index' || indexViewMode !== 'book' || !notebookCoverOpen) return;
            const activeTag = document.activeElement?.tagName;
            if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT' || document.activeElement?.isContentEditable) return;
            if (document.querySelector('.app-overlay:not(.hidden)')) return;
            event.preventDefault();
            goToNotebookPage(event.key === 'ArrowRight' ? 1 : -1);
        });

        function isNotebookInteractiveTarget(target) {
            return target instanceof Element && Boolean(target.closest('button, a, input, textarea, select, label, [role="button"], [data-notebook-note-index], [data-notebook-note-control]'));
        }

        function openNotebookRecipeForCooking(recipeId) {
            const recipe = recipes.find(item => item.id === recipeId);
            if (!recipe) return;

            renderDetail(recipeId);
            contentDiv.scrollTop = 0;

            if (!(recipe.instructions || []).length) {
                showToast('Recipe opened. Add instructions to unlock cooking mode.', 'book-open');
                return;
            }

            if (!isCookingMode) toggleCookingMode(recipeId);
        }

        function toggleNotebookStickyNotesVisibility() {
            activeNotebookStickyNoteMenu = null;
            userSettings.showNotebookStickyNotes = userSettings.showNotebookStickyNotes === false;
            saveData();
            if (currentView === 'index' && indexViewMode === 'book') {
                renderList();
            }
        }

        function openNotebookStickyNoteMenu(recipeId, noteIndex) { if(!hasPremiumAccess()) { showPremiumModal("use sticky notes"); return; }
            if (activeNotebookStickyNoteMenu?.recipeId === recipeId && activeNotebookStickyNoteMenu?.noteIndex === noteIndex) {
                focusNotebookStickyNoteEditor(recipeId, noteIndex);
                return;
            }

            activeNotebookStickyNoteMenu = { recipeId, noteIndex };
            if (currentView === 'index' && indexViewMode === 'book') {
                renderList();
            }

            focusNotebookStickyNoteEditor(recipeId, noteIndex);
        }

        function closeNotebookStickyNoteMenu() {
            if (!activeNotebookStickyNoteMenu) return;

            activeNotebookStickyNoteMenu = null;
            if (currentView === 'index' && indexViewMode === 'book') {
                renderList();
            }
        }

        function updateNotebookStickyNoteText(recipeId, noteIndex, value) {
            const recipe = recipes.find(item => item.id === recipeId);
            if (!recipe?.notebookStickyNotes?.[noteIndex]) return;

            const nextText = String(value).slice(0, 160);
            recipe.notebookStickyNotes[noteIndex].text = nextText;
            saveData();

            const noteId = recipe.notebookStickyNotes[noteIndex].id;
            const nextPreviewMarkup = getNotebookStickyNotePreviewMarkup(recipe.notebookStickyNotes[noteIndex]);
            document.querySelectorAll(`[data-notebook-note-preview="${noteId}"]`).forEach(node => {
                node.innerHTML = nextPreviewMarkup;
            });
            document.querySelectorAll(`[data-notebook-note-plaintext="${noteId}"]`).forEach(node => {
                node.textContent = nextText || 'Empty sticky note. Click to edit.';
            });
        }

        function setNotebookStickyNoteColor(recipeId, noteIndex, color) {
            const recipe = recipes.find(item => item.id === recipeId);
            if (!recipe?.notebookStickyNotes?.[noteIndex]) return;

            recipe.notebookStickyNotes[noteIndex].color = color;
            saveData();
            if (currentView === 'index' && indexViewMode === 'book') {
                renderList();
            }
        }

        function deleteNotebookStickyNote(recipeId, noteIndex) {
            const recipe = recipes.find(item => item.id === recipeId);
            if (!recipe?.notebookStickyNotes?.[noteIndex]) return;

            recipe.notebookStickyNotes.splice(noteIndex, 1);
            activeNotebookStickyNoteMenu = null;
            saveData();
            showToast('Sticky note removed!', 'trash-2');
            if (currentView === 'index' && indexViewMode === 'book') {
                renderList();
            }
        }

        function attachNotebookStickyNoteInteractions(surface) {
            const recipeId = Number(surface?.dataset.recipeId);
            if (!recipeId) return;

            const recipe = recipes.find(item => item.id === recipeId);
            if (!recipe) return;

            recipe.notebookStickyNotes = normalizeNotebookStickyNotes(recipe.notebookStickyNotes);

            const getNotebookTargetPage = (clientX, clientY) => {
                const visiblePages = Array.from(surface.querySelectorAll('[data-notebook-paper-side]')).filter(page => page.offsetParent !== null);
                if (!visiblePages.length) return null;

                const containingPage = visiblePages.find(page => {
                    const rect = page.getBoundingClientRect();
                    return clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
                });
                if (containingPage) return containingPage;

                return visiblePages.reduce((closestPage, page) => {
                    const rect = page.getBoundingClientRect();
                    const clampX = Math.max(rect.left, Math.min(clientX, rect.right));
                    const clampY = Math.max(rect.top, Math.min(clientY, rect.bottom));
                    const distance = Math.hypot(clampX - clientX, clampY - clientY);
                    if (!closestPage || distance < closestPage.distance) {
                        return { element: page, distance };
                    }
                    return closestPage;
                }, null)?.element || visiblePages[0];
            };

            surface.querySelectorAll('[data-notebook-note-index]').forEach(noteEl => {
                const noteIndex = Number(noteEl.dataset.notebookNoteIndex);
                const noteCard = noteEl.querySelector('[data-notebook-note-card]');

                noteEl.querySelectorAll('[data-notebook-note-handle]').forEach(handleEl => {
                    handleEl.addEventListener('pointerdown', event => {
                        if (event.pointerType === 'mouse' && event.button !== 0) return;

                        event.preventDefault();
                        event.stopPropagation();

                        if (!recipe.notebookStickyNotes?.[noteIndex] || !noteCard) return;

                        const noteRect = noteEl.getBoundingClientRect();
                        const centerX = noteRect.left + (noteRect.width / 2);
                        const centerY = noteRect.top + (noteRect.height / 2);
                        const startScale = clampNotebookStickyNoteScale(recipe.notebookStickyNotes[noteIndex].scale);
                        const startRotation = clampNotebookStickyNoteRotation(recipe.notebookStickyNotes[noteIndex].rotation);
                        const startDistance = Math.max(1, Math.hypot(event.clientX - centerX, event.clientY - centerY));
                        const startAngle = Math.atan2(event.clientY - centerY, event.clientX - centerX);

                        const moveHandle = moveEvent => {
                            const nextDistance = Math.max(1, Math.hypot(moveEvent.clientX - centerX, moveEvent.clientY - centerY));
                            const nextAngle = Math.atan2(moveEvent.clientY - centerY, moveEvent.clientX - centerX);
                            let angleDelta = (nextAngle - startAngle) * (180 / Math.PI);

                            if (angleDelta > 180) angleDelta -= 360;
                            if (angleDelta < -180) angleDelta += 360;

                            const nextScale = clampNotebookStickyNoteScale(startScale * (nextDistance / startDistance));
                            const nextRotation = clampNotebookStickyNoteRotation(startRotation + angleDelta);

                            recipe.notebookStickyNotes[noteIndex].scale = nextScale;
                            recipe.notebookStickyNotes[noteIndex].rotation = nextRotation;
                            noteCard.style.transform = `rotate(${nextRotation}deg) scale(${nextScale})`;
                        };

                        const stopHandleDrag = () => {
                            window.removeEventListener('pointermove', moveHandle);
                            window.removeEventListener('pointerup', stopHandleDrag);
                            window.removeEventListener('pointercancel', stopHandleDrag);
                            saveData();
                        };

                        window.addEventListener('pointermove', moveHandle);
                        window.addEventListener('pointerup', stopHandleDrag);
                        window.addEventListener('pointercancel', stopHandleDrag);
                        handleEl.setPointerCapture?.(event.pointerId);
                    });
                });

                noteCard?.addEventListener('pointerdown', event => {
                    if (event.pointerType === 'mouse' && event.button !== 0) return;
                    if (event.target.closest('[data-notebook-note-handle]')) return;
                    if (event.target.closest('[data-notebook-note-menu]')) return;
                    if (event.target.closest('button, textarea, input, select, a')) return;

                    event.preventDefault();
                    event.stopPropagation();

                    if (!recipe.notebookStickyNotes?.[noteIndex]) return;

                    const rect = surface.getBoundingClientRect();
                    const startX = event.clientX;
                    const startY = event.clientY;
                    let didDrag = false;

                    const moveNote = moveEvent => {
                        if (Math.abs(moveEvent.clientX - startX) > 4 || Math.abs(moveEvent.clientY - startY) > 4) {
                            didDrag = true;
                        }

                        const targetPage = getNotebookTargetPage(moveEvent.clientX, moveEvent.clientY);
                        const pageRect = targetPage?.getBoundingClientRect() || rect;
                        const targetSide = normalizeNotebookStickyNoteSide(targetPage?.dataset?.notebookPaperSide, recipe.notebookStickyNotes[noteIndex].side);
                        const targetLayer = targetPage?.querySelector(`[data-notebook-note-layer="${targetSide}"]`);
                        if (targetLayer && noteEl.parentElement !== targetLayer) {
                            targetLayer.appendChild(noteEl);
                        }

                        const nextX = clampNotebookStickyNoteX(((moveEvent.clientX - pageRect.left) / pageRect.width) * 100);
                        const nextY = clampNotebookStickyNoteY(((moveEvent.clientY - pageRect.top) / pageRect.height) * 100);
                        recipe.notebookStickyNotes[noteIndex].side = targetSide;
                        recipe.notebookStickyNotes[noteIndex].x = nextX;
                        recipe.notebookStickyNotes[noteIndex].y = nextY;
                        noteEl.dataset.notebookNoteSide = targetSide;
                        noteEl.style.left = `${nextX}%`;
                        noteEl.style.top = `${nextY}%`;
                    };

                    const stopDragging = () => {
                        window.removeEventListener('pointermove', moveNote);
                        window.removeEventListener('pointerup', stopDragging);
                        window.removeEventListener('pointercancel', stopDragging);
                        saveData();
                        if (!didDrag) {
                            openNotebookStickyNoteMenu(recipeId, noteIndex);
                        }
                    };

                    window.addEventListener('pointermove', moveNote);
                    window.addEventListener('pointerup', stopDragging);
                    window.addEventListener('pointercancel', stopDragging);
                    noteEl.setPointerCapture?.(event.pointerId);
                });
            });
        }

        function attachNotebookInteractions() {
            const surface = document.getElementById('notebook-swipe-surface');
            const coverSurface = document.getElementById('notebook-cover-surface');

            if (coverSurface) {
                let startX = 0;
                let startY = 0;
                let pointerId = null;
                let isDragging = false;

                const resetCover = () => {
                    coverSurface.style.transition = 'transform 260ms cubic-bezier(0.2, 0.72, 0.18, 1)';
                    coverSurface.style.transform = '';
                    window.setTimeout(() => {
                        coverSurface.style.transition = '';
                    }, 260);
                };

                coverSurface.addEventListener('pointerdown', event => {
                    if (event.pointerType === 'mouse' && event.button !== 0) return;
                    startX = event.clientX;
                    startY = event.clientY;
                    pointerId = event.pointerId;
                    isDragging = true;
                    coverSurface.style.transition = '';
                    coverSurface.setPointerCapture?.(event.pointerId);
                });

                coverSurface.addEventListener('pointermove', event => {
                    if (!isDragging || pointerId !== event.pointerId) return;

                    const deltaX = Math.min(0, event.clientX - startX);
                    const rotateY = Math.max(-160, deltaX * 0.95);
                    const drift = Math.max(-26, deltaX * 0.12);
                    coverSurface.style.transform = `translateX(${drift}px) rotateY(${rotateY}deg)`;
                });

                const finishCoverDrag = event => {
                    if (!isDragging || pointerId !== event.pointerId) return;

                    isDragging = false;
                    const deltaX = event.clientX - startX;
                    const deltaY = event.clientY - startY;
                    if (deltaX < -90 && Math.abs(deltaX) > Math.abs(deltaY)) {
                        coverSurface.style.transition = 'transform 300ms cubic-bezier(0.2, 0.72, 0.18, 1)';
                        coverSurface.style.transform = 'translateX(-18px) rotateY(-162deg)';
                        window.setTimeout(() => openNotebookCover(true), 260);
                        return;
                    }
                    resetCover();
                };

                coverSurface.addEventListener('pointerup', finishCoverDrag);
                coverSurface.addEventListener('pointercancel', finishCoverDrag);
                coverSurface.addEventListener('lostpointercapture', () => {
                    isDragging = false;
                    resetCover();
                });
                return;
            }

            if (!surface) return;

            let startX = 0;
            let startY = 0;
            let lastX = 0;
            let lastY = 0;
            let pointerId = null;
            let isDragging = false;

            const finishSwipe = (clientX, clientY) => {
                if (!isDragging) return;
                isDragging = false;
                surface.style.transform = '';
                const deltaX = clientX - startX;
                const deltaY = clientY - startY;
                if (Math.abs(deltaX) >= 44 && Math.abs(deltaX) > Math.abs(deltaY) * 0.85) {
                    goToNotebookPage(deltaX < 0 ? 1 : -1);
                }
            };

            surface.addEventListener('pointerdown', event => {
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                if (isNotebookInteractiveTarget(event.target)) return;
                startX = event.clientX;
                startY = event.clientY;
                lastX = event.clientX;
                lastY = event.clientY;
                pointerId = event.pointerId;
                isDragging = true;
                surface.setPointerCapture?.(event.pointerId);
            });

            surface.addEventListener('pointermove', event => {
                if (!isDragging || pointerId !== event.pointerId) return;
                lastX = event.clientX;
                lastY = event.clientY;
                const deltaX = event.clientX - startX;
                const deltaY = event.clientY - startY;
                if (Math.abs(deltaX) > 12 && Math.abs(deltaX) > Math.abs(deltaY)) {
                    event.preventDefault();
                    const shift = Math.max(-56, Math.min(56, deltaX));
                    surface.style.transform = `translateX(${shift * 0.35}px)`;
                }
            }, { passive: false });

            surface.addEventListener('pointerup', event => {
                if (pointerId !== event.pointerId) return;
                finishSwipe(event.clientX, event.clientY);
            });
            surface.addEventListener('pointercancel', event => {
                if (pointerId !== event.pointerId) return;
                finishSwipe(lastX, lastY);
            });

        function renderList() {
            chromeBackAction = null;
            chromePeer = 'index';
            activeDetailRecipeId = null;
            if (!ensureAuthenticatedAccess()) {
                return;
            }
            isCookingMode = false;
            document.getElementById('body').classList.remove('cooking-mode-active');
            setActiveNav('index');
            ensurePublishedRecipesCacheLoaded();

            collectionScopeFilter = normalizeCollectionScopeFilter(collectionScopeFilter);

            const collectionScopeCounts = {
                mine: recipes.filter(recipe => recipe.source !== 'published').length,
                saved: recipes.filter(recipe => recipe.source === 'published').length
            };

            const filteredRecipes = recipes.filter(r => {
                const matchesSearch = r.title.toLowerCase().includes(searchQuery.toLowerCase()) || r.ingredients.some(i => i.toLowerCase().includes(searchQuery.toLowerCase()));
                const matchesCategory = categoryFilter === "" || r.category === categoryFilter;
                const matchesDifficulty = difficultyFilter === "" || r.difficulty === difficultyFilter;
                const matchesDiet = doesRecipeMatchDietFilters(r);
                const matchesCuisine = cuisineFilter === "" || (r.cuisine && r.cuisine.toLowerCase() === cuisineFilter.toLowerCase());
                const matchesMealType = mealTypeFilter.length === 0 || (Array.isArray(r.mealType) && mealTypeFilter.some(type => r.mealType.includes(type)));
                const matchesFavorite = !showFavoritesOnly || isRecipeFavorited(r);
                const matchesCollectionScope = doesRecipeMatchCollectionScope(r);
                return matchesSearch && matchesCategory && matchesDifficulty && matchesDiet && matchesCuisine && matchesMealType && matchesFavorite && matchesCollectionScope;
            });

            const activeFilters = [
                collectionScopeFilter !== 'all' ? `Source: ${getCollectionScopeLabel()}` : '',
                searchQuery.trim() ? `Search: ${searchQuery.trim()}` : '',
                categoryFilter ? `Category: ${categoryFilter}` : '',
                difficultyFilter ? `Level: ${difficultyFilter}` : '',
                cuisineFilter ? `Cuisine: ${cuisineFilter}` : '',
                ...mealTypeFilter.map(item => `Meal: ${item}`),
                ...dietFilter.map(item => `Diet: ${item}`),
                showFavoritesOnly ? 'Favorites only' : ''
            ].filter(Boolean);

            currentIndexRecipeIds = filteredRecipes.map(recipe => recipe.id);
            if (currentIndexRecipeIds.length === 0) {
                notebookPageIndex = 0;
                notebookSpreadPageIndex = 0;
            } else {
                notebookPageIndex = Math.max(0, Math.min(notebookPageIndex, currentIndexRecipeIds.length - 1));
                const currentNotebookRecipe = filteredRecipes[notebookPageIndex] || null;
                const currentNotebookSpreads = getNotebookRecipeSpreads(currentNotebookRecipe);
                notebookSpreadPageIndex = Math.max(0, Math.min(notebookSpreadPageIndex, currentNotebookSpreads.length - 1));
            }

            const resultLabel = `${filteredRecipes.length} recipe${filteredRecipes.length === 1 ? '' : 's'}`;
            const hasActiveListFilters = Boolean(collectionScopeFilter !== 'all' || categoryFilter || difficultyFilter || cuisineFilter || mealTypeFilter.length || showFavoritesOnly || dietFilter.length);
            const localRecipeCount = collectionScopeCounts.mine;
            const freeRecipeSlotsRemaining = Math.max(0, freeLocalRecipeLimit - localRecipeCount);
            const premiumActive = hasPremiumAccess();
            const billingMeta = getBillingStatusMeta();
            const notebookModeLocked = !premiumActive;
            const isNotebookMode = indexViewMode === 'book';
            const isSearchVisible = !isNotebookMode && showListSearch;
            const isFilterVisible = !isNotebookMode && showListFilters;
            const showNotebookOverviewCard = !isNotebookMode || !notebookCoverOpen;
            const activeFiltersMarkup = activeFilters.length > 0 ? `
                <div class="border-b border-parchmentDark bg-white px-5 py-4">
                    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">

                            <span class="text-[11px] font-bold uppercase tracking-[0.28em] text-sage opacity-80">Active</span>

                const nextScope = isActive ? 'all' : scope.value;

            let html = showNotebookOverviewCard ? `

                                <button onclick="toggleListSearchVisibility()" aria-label="Search" class="${getAppButtonClasses(isSearchVisible ? 'primary' : 'secondary', { iconOnly: true })}" title="${isNotebookMode ? 'Switch to card view and open search' : 'Toggle search'}">
